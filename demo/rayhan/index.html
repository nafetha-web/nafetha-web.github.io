<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مطبخ الريحان: مأكولات لبنانية، ومشاوي على الفحم، ومازة. موقع تجريبي من نافذة.">
<title>مطبخ الريحان</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24412F">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الريحان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #F6F3EC;
  --surface: #FFFFFF;
  --fg: #1E2A22;
  --muted: #5E665F;
  --line: #E4DFD3;
  --basil: #24412F;
  --basil-ink: #FFFFFF;
  --saffron: #C9822B;
  --saffron-ink: #8A5512;
  --saffron-soft: #F5E7D0;
  --wa: #1F7A45;
  --display: 'Aref Ruqaa', 'Times New Roman', serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121814; --surface: #1A221D; --fg: #ECEFEA; --muted: #A9B2AB; --line: #2B352F;
  --basil: #1F3528; --saffron: #E3A24E; --saffron-ink: #E3A24E; --saffron-soft: #33291B; --wa: #2B9A5A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1A221D; --fg: #ECEFEA; --muted: #A9B2AB; --line: #2B352F;
  --basil: #1F3528; --saffron: #E3A24E; --saffron-ink: #E3A24E; --saffron-soft: #33291B; --wa: #2B9A5A; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; margin: 0 }
a { color: inherit }
img { display: block; max-width: 100% }
button, input, select, textarea { font-family: inherit; font-size: 16px }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance }
.ltr { direction: ltr; unicode-bidi: isolate }

.demo { background: var(--fg); color: var(--bg); font-size: 13px; text-align: center; padding: 7px 16px; line-height: 1.5 }
.demo a { color: var(--bg); font-weight: 700 }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px }
.dish.out .ph img { filter: grayscale(1); opacity: .55 }
.dish .tag.hh { background: #7C3AED; color: #fff }
.dish .tag.dd { background: var(--basil); color: #fff }
.price s { color: var(--muted); font-weight: 400; font-size: 13px }
.soldout { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--line); border-radius: 99px; padding: 4px 12px }
.dotd { display: flex; gap: 14px; align-items: stretch; background: var(--surface); border: 2px solid var(--saffron); border-radius: 20px; overflow: hidden; margin: 6px 0 14px }
.dotd .ph { position: relative; flex: none; width: 128px; min-height: 128px }
.dotd .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.dotd .bd { flex: 1; min-width: 0; padding: 12px 14px 12px 0; display: flex; flex-direction: column; gap: 4px }
[dir=ltr] .dotd .bd { padding: 12px 0 12px 14px }
.dotd .k { font-size: 12.5px; font-weight: 700; color: var(--saffron-ink) }
.dotd h3 { margin: 0; font-size: 18px }
.dotd p { margin: 0; color: var(--muted); font-size: 13.5px }
.dotd .row { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-inline-end: 12px }
.hhbar { background: linear-gradient(135deg, #6D28D9, #9333EA); color: #fff; border-radius: 16px; padding: 10px 14px; font-weight: 700; font-size: 14.5px; margin: 6px 0 10px; display: flex; align-items: center; gap: 8px }
.callbtns { position: fixed; z-index: 31; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; white-space: nowrap }
.callbtns button[hidden], .callbtns[hidden] { display: none }
.callbtns button { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 99px; padding: 9px 14px; font: inherit; font-weight: 700; font-size: 14px; background: var(--fg); color: var(--bg); box-shadow: 0 8px 20px -8px rgba(0,0,0,.45); cursor: pointer }
.callbtns button.bill { background: var(--saffron); color: #1E2A22 }
.callbtns button.mine { background: var(--basil); color: #fff }
.callbtns button:disabled { opacity: .55 }
.trk { display: grid; gap: 12px }
.trk .o { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px }
.trk .o h4 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px }
.trk .o h4 small { color: var(--muted); font-weight: 400 }
.trk .o ul { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; color: var(--muted) }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px }
.steps i { height: 6px; border-radius: 99px; background: var(--line) }
.steps i.on { background: var(--basil) }
.trk .st { margin-top: 8px; font-weight: 700; font-size: 15px; color: var(--basil) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trk .st, :root:not([data-theme="light"]) .steps i.on { color: #8FD3A5; background: #8FD3A5 } }
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; max-width: 92vw; text-align: center }
.toast.on { opacity: 1; transform: translate(-50%, 0) }
.appc { display: none; align-items: center; gap: 12px; margin: 12px 0 0; padding: 12px 14px; border-radius: 18px; background: var(--basil); color: #fff }
.appc.on { display: flex }
.appc img { width: 44px; height: 44px; border-radius: 12px; flex: none }
.appc div { flex: 1; min-width: 0; line-height: 1.35 }
.appc b { display: block; font-size: 15px }
.appc small { font-size: 12.5px; opacity: .85 }
.appc .get { flex: none; background: #fff; color: var(--basil); font-weight: 700; border-radius: 12px; padding: 9px 14px; font: inherit; font-weight: 700; border: 0; cursor: pointer }
.appc .no { flex: none; width: 30px; height: 30px; border: 0; background: none; color: #fff; opacity: .7; font-size: 18px; cursor: pointer }
.tablebar { background: var(--saffron); color: #1E2A22; text-align: center; font-weight: 700; padding: 10px 16px }

.top { position: sticky; top: 0; z-index: 20; background: var(--basil); color: var(--basil-ink) }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 24px; white-space: nowrap }
.logo svg { color: #9CCB8A }
.nav { display: flex; gap: 4px 16px; align-items: center; font-size: 15px }
.nav a { text-decoration: none; opacity: .9 }
@media (max-width: 560px) { .nav a { display: none } }
.lang { background: transparent; color: var(--basil-ink); border: 1.5px solid rgba(255,255,255,.6); border-radius: 999px; padding: 4px 14px; min-height: 40px; font-weight: 600; cursor: pointer }

.hero { position: relative; color: #FFFFFF; background: #1E2A22; overflow: hidden }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,22,17,.94) 10%, rgba(14,22,17,.5) 60%, rgba(14,22,17,.3)) }
.hero .wrap { position: relative; z-index: 1; min-height: min(72vh, 540px); display: flex; flex-direction: column; justify-content: flex-end; padding-block: 48px 32px; gap: 10px }
.status { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 14px; font-size: 14px; width: fit-content }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9BE29F }
.dot.closed { background: #F1A3A9 }
.hero h1 { font-family: var(--display); font-size: clamp(42px, 10vw, 68px); line-height: 1.2; margin: 6px 0 0 }
.hero p { margin: 0; font-size: 17px; opacity: .92; max-width: 32em }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 700; font-size: 16px; text-decoration: none; border: 0; cursor: pointer }
.btn-saffron { background: var(--saffron); color: #1E2A22 }
.btn-ghost { background: rgba(255,255,255,.12); color: #FFFFFF; border: 1.5px solid rgba(255,255,255,.55) }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; opacity: .9; margin-top: 10px }
.facts span::before { content: "✦"; color: var(--saffron); margin-inline-end: 6px }

section.block { padding-block: 36px 4px; display: flex; flex-direction: column; gap: 12px }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--saffron-ink); margin: 0 }
.block h2 { font-family: var(--display); font-size: 34px; margin: 0; line-height: 1.3 }


.ph { position: relative; overflow: hidden; background: var(--saffron-soft) }
.ph img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover }
.ph .fb { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: var(--saffron-ink) }

.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 60px; z-index: 10; background: var(--bg); padding-block: 10px; margin-inline: -16px; padding-inline: 16px }
.tabs::-webkit-scrollbar { display: none }
.tab { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 0 16px; min-height: 42px; font-weight: 600; cursor: pointer }
.tab[aria-pressed="true"] { background: var(--basil); border-color: var(--basil); color: var(--basil-ink) }
.cat { scroll-margin-top: 126px; padding-top: 6px }
.cat h3.ch { font-family: var(--display); font-size: 26px; margin: 8px 0 10px; display: flex; align-items: baseline; gap: 8px }
.cat h3.ch small { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 500 }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 10px }
.dish { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0 }
.dish .ph { flex: none; width: 104px; min-height: 104px }
.dish .ph .tag { position: absolute; z-index: 2; inset-inline-start: 6px; top: 6px; background: var(--saffron); color: #1E2A22; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px }
.dish .body { flex: 1; min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px }
.dish h4 { margin: 0; font-size: 16px; line-height: 1.4 }
.dish p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5 }
.dish .row { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px }
.price { font-weight: 700; color: var(--saffron-ink); font-variant-numeric: tabular-nums; white-space: nowrap }
.qty { display: flex; align-items: center; gap: 6px }
.qbtn { width: 38px; height: 38px; border-radius: 11px; border: 1.5px solid var(--basil); background: var(--surface); color: var(--fg); font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0 }
.qbtn.add { background: var(--basil); color: var(--basil-ink) }
.qn { min-width: 18px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0 }

.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 14px; font-weight: 600 }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 10px 12px; min-height: 46px; width: 100% }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px }
.wa { background: var(--wa); color: #FFFFFF }
.wa[aria-disabled="true"] { opacity: .5; pointer-events: none }
button.btn { font-family: inherit }
.hint { font-size: 13px; color: var(--muted); margin: 0 }
#qrPanel { border: 2px dashed var(--saffron); background: var(--saffron-soft) }
#qrPanel .eyebrow::before { content: "★ " }
.qrbox { display: flex; flex-wrap: wrap; gap: 16px; align-items: center }
.qr { background: #FFFFFF; padding: 12px; border-radius: 14px; width: 160px; height: 160px; display: grid; place-items: center; flex: none; border: 1px solid var(--line) }
.qr img, .qr canvas { width: 136px !important; height: 136px !important }
.qrtext { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px }
.tables { display: flex; flex-wrap: wrap; gap: 6px }
.tables button { min-width: 42px; min-height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font-weight: 600; cursor: pointer }
.tables button[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: #1E2A22 }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate }

.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px }
@media (min-width: 720px) { .gallery { grid-template-columns: repeat(4, 1fr) } }
.gallery figure { margin: 0; border-radius: 16px; aspect-ratio: 1 }
.gallery figcaption { position: absolute; z-index: 2; inset-inline: 0; bottom: 0; padding: 8px 10px; font-size: 13px; font-weight: 600; color: #FFFFFF; background: linear-gradient(transparent, rgba(0,0,0,.6)) }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.card { background: var(--saffron-soft); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.card b { font-size: 14px; color: var(--saffron-ink) }
.hours { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; font-variant-numeric: tabular-nums }
.foot { color: var(--muted); font-size: 13px; text-align: center; padding-block: 28px 130px }
.foot a { color: var(--saffron-ink); font-weight: 700 }

.order { position: fixed; inset-inline: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.08); z-index: 30 }
.order .wrap { padding-inline: 0; display: flex; align-items: center; gap: 12px }
.order .sum { flex: 1; min-width: 0; font-size: 14px; color: var(--muted) }
.order .sum strong { display: block; color: var(--fg); font-size: 19px; font-variant-numeric: tabular-nums }
.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88vh; border-radius: 22px 22px 0 0; background: var(--surface); color: var(--fg) }
.sheet::backdrop { background: rgba(0,0,0,.45) }
.sheet-in { padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px }
.sheet-head { display: flex; justify-content: space-between; align-items: center }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 28px }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 22px; cursor: pointer }
.revlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 42vh }
.rev { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; padding: 8px }
.rev .ph { width: 52px; height: 52px; border-radius: 10px; flex: none }
.rev .ph .fb { font-size: 20px }
.rev .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 1.4 }
.rev .nm small { display: block; color: var(--saffron-ink); font-weight: 700 }
.revtotal { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 16px }
.revtotal strong { font-size: 22px; font-variant-numeric: tabular-nums }
.back { background: transparent; color: var(--fg); border: 1.5px solid var(--line) }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
</style>
</head>
<body>

<div class="demo" id="demoBar"></div>
<div class="tablebar" id="tableBar" hidden></div>
<div class="callbtns" id="callBtns" hidden><button type="button" class="mine" id="myOrd" hidden></button><button type="button" id="callW"></button><button type="button" class="bill" id="callB"></button></div>

<header class="top">
  <div class="wrap bar">
    <div class="logo">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 29V9"/><path d="M16 21c-5 0-8-3-8-8 5 0 8 3 8 8z"/><path d="M16 16c5 0 8-3 8-8-5 0-8 3-8 8z"/><path d="M16 9c-2-2-2-5 0-7 2 2 2 5 0 7z"/></svg>
      <span id="brand"></span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#menu" id="navMenu"></a><a href="#book" id="navBook"></a><a href="#gallery" id="navGallery"></a>
      <button class="lang" id="langBtn" type="button"></button>
    </nav>
  </div>
</header>

<section class="hero">
  <img class="bg" id="heroImg" alt="" fetchpriority="high" onerror="this.remove()">
  <div class="wrap">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <div class="cta">
      <a class="btn btn-saffron" href="#menu" id="ctaMenu"></a>
      <a class="btn btn-ghost" href="#book" id="ctaBook"></a>
    </div>
    <div class="facts" id="facts"></div>
  </div>
</section>

<main class="wrap">
  <section class="block" id="menu">
    <h2 id="menuTitle"></h2>
    <div class="appc" id="appc"><img src="img/icon-192.png" alt=""><div><b id="appT"></b><small id="appS"></small></div><button type="button" class="get" id="appGo"></button><button type="button" class="no" id="appNo" aria-label="close">×</button></div>
    <div class="hhbar" id="hhbar" hidden></div>
    <div id="dotd" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Menu sections"></nav>
    <div id="cats"></div>
    <p class="note" id="priceNote"></p>
  </section>

  <section class="block" id="book">
    <p class="eyebrow" id="bookEyebrow"></p>
    <h2 id="bookTitle"></h2>
    <div class="split">
      <form class="panel" id="bookForm" novalidate>
        <div class="field"><label for="bName" id="lName"></label><input id="bName" type="text" autocomplete="name"></div>
        <div class="two">
          <div class="field"><label for="bDate" id="lDate"></label><input id="bDate" type="date"></div>
          <div class="field"><label for="bTime" id="lTime"></label><select id="bTime"></select></div>
        </div>
        <div class="two">
          <div class="field"><label for="bPeople" id="lPeople"></label><select id="bPeople"></select></div>
          <div class="field"><label for="bSeat" id="lSeat"></label><select id="bSeat"></select></div>
        </div>
        <div class="field"><label for="bNote" id="lNote"></label><textarea id="bNote" rows="2"></textarea></div>
        <a class="btn wa" id="bookBtn" target="_blank" rel="noopener"></a>
        <p class="hint" id="bookHint"></p>
      </form>
      <div class="panel" id="qrPanel">
        <p class="eyebrow" id="qrEyebrow"></p>
        <h3 style="margin:0; font-size: 20px" id="qrTitle"></h3>
        <div class="qrbox">
          <div class="qr" id="qr" role="img"></div>
          <div class="qrtext">
            <p class="hint" id="qrText"></p>
            <div class="tables" id="tables"></div>
            <span class="mono" id="qrUrl"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="block" id="gallery">
    <p class="eyebrow" id="galEyebrow"></p>
    <h2 id="galTitle"></h2>
    <div class="gallery" id="gal"></div>
    <a class="btn btn-saffron" style="width: fit-content" id="instaBtn" href="https://www.instagram.com/nafetha.web" target="_blank" rel="noopener"></a>
  </section>

  <section class="block" id="visit">
    <h2 id="visitTitle"></h2>
    <div class="info">
      <div class="card"><b id="lblAddr"></b><span id="addr"></span><a id="mapLink" target="_blank" rel="noopener"></a></div>
      <div class="card"><b id="lblHours"></b><div class="hours" id="hours"></div></div>

}

function renderAll() { renderStatic(); renderMenu(); renderOrder() }

$('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('rayhan-lang', lang) } catch (e) {} renderAll() });
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return; activeCat = b.dataset.cat; setTabs();
  const el = $('cat-' + activeCat); if (el) el.scrollIntoView({ block: 'start' });
});
function onQty(e) {
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'); if (!inc && !dec) return;
  const id = inc ? inc.dataset.inc : dec.dataset.dec;
  if (inc) cart[id] = (cart[id] || 0) + 1; else { cart[id] = Math.max(0, (cart[id] || 0) - 1); if (!cart[id]) delete cart[id] }
  const y = window.scrollY; renderMenu(); renderOrder(); window.scrollTo(0, y);
}
$('cats').addEventListener('click', onQty);
$('goBtn').addEventListener('click', openReview);
$('revList').addEventListener('click', (e) => { const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'); if (!inc && !dec) return; const id = inc ? inc.dataset.inc : dec.dataset.dec; if (inc) cart[id] = (cart[id] || 0) + 1; else { cart[id] = Math.max(0, (cart[id] || 0) - 1); if (!cart[id]) delete cart[id] } const y = window.scrollY; renderMenu(); renderOrder(); window.scrollTo(0, y) });
$('revNote').addEventListener('input', renderReview);
$('revClose').addEventListener('click', closeReview); $('revBack').addEventListener('click', closeReview);
$('review').addEventListener('click', (e) => { if (e.target === $('review')) closeReview() });
$('tables').addEventListener('click', (e) => { const b = e.target.closest('[data-table]'); if (!b) return; qrTable = Number(b.dataset.table); document.querySelectorAll('[data-table]').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.table) === qrTable))); renderQR() });
['bName','bDate','bTime','bPeople','bSeat','bNote'].forEach(id => { $(id).addEventListener('input', renderBooking); $(id).addEventListener('change', renderBooking) });
$('bookForm').addEventListener('submit', (e) => e.preventDefault());
(function () { const d = new Date(); d.setDate(d.getDate() + 1); $('bDate').value = d.toISOString().slice(0, 10) })();

/* ===== Pro: live menu state, table ordering, order tracking, app ===== */
const API = 'https://nafetha-api.nafetha-web.workers.dev/rayhan';
const catOf = Object.fromEntries(MENU.flatMap((c) => c.items.map((i) => [i.id, c.id])));
ALL.forEach((i) => { i.bp = i.p });
let liveSt = null, sendingNow = false;
function toast(m) { const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2600) }
function hhActive(st) {
  const h = st && st.hh; if (!h || h.on === false) return false;
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes(), [a, b] = h.from.split(':').map(Number), [c, d] = h.to.split(':').map(Number), f = a * 60 + b, e = c * 60 + d;
  return f <= e ? m >= f && m < e : m >= f || m < e;
}
function applySt(st) {
  liveSt = st || {}; const out = new Set(liveSt.out || []), hh = hhActive(liveSt) ? liveSt.hh : null;
  ALL.forEach((i) => {
    i.p = i.bp; i.old = 0; i.hh = false; i.out = out.has(i.id);
    const o = (liveSt.offers || {})[i.id]; if (o && (!o.until || o.until > Date.now())) { i.p = o.price; if (o.price < i.bp) i.old = i.bp }
    if (hh && (!hh.cats.length || hh.cats.includes(catOf[i.id]))) { const np = Math.round(i.p * (1 - hh.pct / 100) * 2) / 2; if (np < i.p) { i.old = i.old || i.p; i.p = np; i.hh = true } }
    if (i.out) delete cart[i.id];
  });
}
try { const c = JSON.parse(localStorage.getItem('rh_state') || 'null'); if (c) applySt(c) } catch (e) {}
async function loadSt() {
  try { const r = await fetch(API + '/state', { cache: 'no-store' }); if (!r.ok) return; const st = await r.json(); try { localStorage.setItem('rh_state', JSON.stringify(st)) } catch (e) {} applySt(st); const y = scrollY; renderMenu(); renderOrder(); scrollTo(0, y) } catch (e) {}
}
function renderLive() {
  const t = T[lang], st = liveSt || {};
  const hh = hhActive(st) ? st.hh : null;
  $('hhbar').hidden = !hh;
  if (hh) $('hhbar').textContent = t.hhBar(hh.pct, hh.to, hh.cats.length ? hh.cats.map((k) => (MENU.find((c) => c.id === k) || {})[lang]).filter(Boolean).join(lang === 'ar' ? '، ' : ', ') : '');
  const dd = st.dotd && ALL.find((i) => i.id === st.dotd.id);
  $('dotd').hidden = !dd || dd.out;
  if (dd && !dd.out) $('dotd').innerHTML = '<article class="dotd"><div class="ph">' + photo(dd.ph, 256, 256, dd[lang]) + '</div><div class="bd"><span class="k">' + t.dotdK + '</span><h3>' + dd[lang] + '</h3><p>' + (st.dotd.note || dd['d' + lang] || '') + '</p><div class="row">' + priceHTML(dd) + qtyHTML(dd) + '</div></div></article>';
}
$('dotd').addEventListener('click', onQty);

/* my orders at this table */
const MYK = 'rh_my_' + (tableFromHash || 0);
const myOrders = () => { try { return (JSON.parse(localStorage.getItem(MYK) || '[]')).filter((o) => Date.now() - o.ts < 6 * 3600e3) } catch (e) { return [] } };
const saveMine = (l) => { try { localStorage.setItem(MYK, JSON.stringify(l.slice(-10))) } catch (e) {} };
function renderMine() { const l = myOrders(); $('myOrd').hidden = !l.length; $('myOrd').textContent = '📋 ' + T[lang].myOrders + (l.length ? ' (' + l.length + ')' : '') }
async function sendKitchen() {
  const t = T[lang]; if (sendingNow) return;
  const lines = ALL.filter((i) => cart[i.id]); if (!lines.length) return;
  sendingNow = true; renderReview();
  try {
    const r = await fetch(API + '/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ table: tableFromHash, note: $('revNote').value.trim(), items: lines.map((i) => ({ id: i.id, n: i.ar, q: cart[i.id], p: i.p })) }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) throw new Error('busy');
    if (!r.ok || !j.id) throw new Error('net');
    const l = myOrders(); l.push({ id: j.id, ts: Date.now(), items: lines.map((i) => [cart[i.id], i.id]), st: 'new' }); saveMine(l);
    Object.keys(cart).forEach((k) => delete cart[k]); $('revNote').value = ''; sendingNow = false;
    closeReview(); renderMenu(); renderOrder(); renderMine(); openTrack();
  } catch (e) { sendingNow = false; renderReview(); toast(e.message === 'busy' ? t.busy : t.failSend) }
}
$('revSend').addEventListener('click', (e) => { if (tableFromHash) { e.preventDefault(); sendKitchen() } });
const ORDER_ST = ['new', 'prep', 'ready', 'done'];
async function pollMine(show) {
  const l = myOrders(); if (!l.length) return; let changed = false;
  await Promise.all(l.filter((o) => o.st !== 'done' && o.st !== 'cancel').map(async (o) => {
    try { const r = await fetch(API + '/order?id=' + o.id, { cache: 'no-store' }); if (!r.ok) return; const j = await r.json(); if (j.status && j.status !== o.st) { if (j.status === 'ready') toast(T[lang].readyToast); o.st = j.status; changed = true } } catch (e) {}
  }));
  if (changed) saveMine(l);
  if (show || changed) drawTrack();
}
function drawTrack() {
  const t = T[lang], l = myOrders().slice().reverse();
  $('trkTitle').textContent = t.trkTitle;
  $('trkList').innerHTML = l.map((o, k) => { const n = ORDER_ST.indexOf(o.st);
    return '<div class="o"><h4>' + t.orderN(l.length - k) + '<small>' + new Date(o.ts).toLocaleTimeString(lang === 'ar' ? 'ar-LB' : 'en-GB', { hour: '2-digit', minute: '2-digit' }) + '</small></h4><ul>' + o.items.map((x) => { const i = ALL.find((y) => y.id === x[1]); return '<li>' + x[0] + ' × ' + (i ? i[lang] : x[1]) + '</li>' }).join('') + '</ul>' +
      (o.st === 'cancel' ? '' : '<div class="steps">' + ORDER_ST.map((s, q) => '<i class="' + (q <= n ? 'on' : '') + '"></i>').join('') + '</div>') + '<div class="st">' + (t.st[o.st] || '') + '</div></div>' }).join('');
}
let trkTimer = null;
function openTrack() { drawTrack(); const d = $('track'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); pollMine(true); clearInterval(trkTimer); trkTimer = setInterval(() => pollMine(true), 5000) }
function closeTrack() { const d = $('track'); clearInterval(trkTimer); if (d.open) { if (d.close) d.close(); else d.removeAttribute('open') } }
$('trkClose').addEventListener('click', closeTrack);
$('track').addEventListener('click', (e) => { if (e.target === $('track')) closeTrack() });
$('track').addEventListener('close', () => clearInterval(trkTimer));
$('myOrd').addEventListener('click', openTrack);
if (tableFromHash) setInterval(() => { if (!$('track').open) pollMine(false) }, 20000);
async function callStaff(kind, btn) {
  btn.disabled = true; setTimeout(() => { btn.disabled = false }, 45000);
  try { const r = await fetch(API + '/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ table: tableFromHash, kind }) }); if (!r.ok) throw 0; toast(kind === 'bill' ? T[lang].calledB : T[lang].calledW) }
  catch (e) { btn.disabled = false; toast(T[lang].failSend) }
}
$('callW').addEventListener('click', (e) => callStaff('waiter', e.currentTarget));
$('callB').addEventListener('click', (e) => callStaff('bill', e.currentTarget));

/* installable app + offer notifications */
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deferredI = null, pushMode = false;
const VAPID = 'BLIk2-xpY5txJxFpohOpcAkAylEuvz2sWw_k2Heaj-YpJpqsVikbICDxLhsPFLsi7cI7SBsFCC7IuJ8xc_hVof0';
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && Notification.permission !== 'denied' && (!isIOS || standalone());
function appCard() {
  let no = 0, on = false; try { no = +localStorage.getItem('rh_card_no') || 0; on = localStorage.getItem('rh_push') === '1' } catch (e) {}
  const snooze = Date.now() - no < 3 * 864e5;
  const showInstall = !standalone() && !tableFromHash && (deferredI || isIOS || /android/i.test(navigator.userAgent));
  const showPush = !showInstall && canPush() && !(on && Notification.permission === 'granted');
  pushMode = !showInstall && showPush;
  $('appc').classList.toggle('on', !snooze && (showInstall || showPush));
  const t = T[lang]; $('appT').textContent = pushMode ? t.pushT : t.appT; $('appS').textContent = pushMode ? t.pushS : t.appS; $('appGo').textContent = pushMode ? t.pushGo : t.appGo;
}
const u8 = (b) => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map((c) => c.charCodeAt(0))) };
async function subPush(silent) {
  try {
    if (!silent && (await Notification.requestPermission()) !== 'granted') { appCard(); return toast(T[lang].pushNo) }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(VAPID) }));
    await fetch(API + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
    try { localStorage.setItem('rh_push', '1') } catch (e) {}
    $('appc').classList.remove('on'); if (!silent) toast(T[lang].pushOk);
  } catch (e) { if (!silent) toast(T[lang].pushNo) }
}
$('appGo').addEventListener('click', async () => {
  if (pushMode) return subPush(false);
  if (deferredI) { deferredI.prompt(); const r = await deferredI.userChoice; deferredI = null; if (r && r.outcome === 'accepted') { toast(T[lang].appDone); hit('install') } appCard(); return }
  toast(T[lang].iosHelp);
});
$('appNo').addEventListener('click', () => { try { localStorage.setItem('rh_card_no', Date.now()) } catch (e) {} $('appc').classList.remove('on'); toast(T[lang].later) });
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredI = e; appCard() });
addEventListener('appinstalled', () => { hit('install'); appCard() });
function devId() { let d = ''; try { d = localStorage.getItem('rh_dev') || ''; if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); localStorage.setItem('rh_dev', d) } } catch (e) {} return d }
function hit(type) {
  const k = type === 'install' ? 'rh_inst' : 'rh_open_' + new Date().toDateString();
  try { if (localStorage.getItem(k)) return; localStorage.setItem(k, '1') } catch (e) { return }
  const d = devId(); if (d.length >= 8) fetch(API + '/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, dev: d }), keepalive: true }).catch(() => {});
}
if (standalone()) { hit('install'); hit('open') }
try { if (localStorage.getItem('rh_push') === '1' && 'Notification' in window && Notification.permission === 'granted' && 'serviceWorker' in navigator) subPush(true) } catch (e) {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

renderAll();
appCard();
loadSt(); setInterval(loadSt, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) loadSt() });
</script>
