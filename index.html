<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نافذة | Nafetha</title>
<meta name="description" content="نافذة: مواقع للمطاعم والمحلات بلبنان، بالعربي والإنكليزي، باشتراك شهري بسيط.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0E4D4A}a:hover{color:#0A3735}
summary{cursor:pointer}
details>summary::-webkit-details-marker{display:none}
</style>
<style>html{scroll-behavior:smooth}img,svg{max-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="{{dir}}" style="font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1B1B1F; background: #FFFFFF; line-height: 1.7">

  <header style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
    <a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E4D4A">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="#0E4D4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="4"/><path d="M16 4v24M4 16h24"/></svg>
      <span style="font-family: 'El Messiri', serif; font-size: 28px; font-weight: 700">{{t.brand}}</span>
    </a>
    <nav style="display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 16px">
      <a href="#services" style="text-decoration: none; color: #3A3A40">{{t.navServices}}</a>
      <a href="#how" style="text-decoration: none; color: #3A3A40">{{t.navHow}}</a>
      <a href="#pricing" style="text-decoration: none; color: #3A3A40">{{t.navPricing}}</a>
      <a href="#faq" style="text-decoration: none; color: #3A3A40">{{t.navFaq}}</a>
      <button onClick="{{toggleLang}}" style="font-family: inherit; font-size: 15px; font-weight: 600; background: transparent; color: #0E4D4A; border: 2px solid #0E4D4A; border-radius: 999px; padding: 8px 18px; min-height: 44px; cursor: pointer">{{t.langBtn}}</button>
      <a href="#contact" style="text-decoration: none; background: #0E4D4A; color: #FFFFFF; padding: 11px 22px; border-radius: 999px; font-weight: 600">{{t.navContact}}</a>
    </nav>
  </header>

  <section id="top" style="background: #0E4D4A; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 80px 24px 88px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
        <div style="align-self: flex-start; background: {{accent}}; color: #1B1B1F; padding: 6px 16px; border-radius: 999px; font-size: 15px; font-weight: 600">{{t.badge}}</div>
        <h1 style="margin: 0; font-family: 'El Messiri', serif; font-size: clamp(34px, 6vw, 56px); line-height: 1.25; font-weight: 700; white-space: pre-line">{{t.heroTitle}}</h1>
        <p style="margin: 0; font-size: 20px; color: #D5E6E4; max-width: 580px">{{t.heroText}}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px">
          <a href="#contact" style="text-decoration: none; background: {{accent}}; color: #1B1B1F; padding: 16px 32px; border-radius: 999px; font-size: 18px; font-weight: 600">{{t.cta1}}</a>
          <a href="#pricing" style="text-decoration: none; border: 2px solid #FFFFFF; color: #FFFFFF; padding: 14px 30px; border-radius: 999px; font-size: 18px; font-weight: 600">{{t.cta2}}</a>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 12px; font-size: 16px; color: #D5E6E4">
          <span>✓ {{t.trust1}}</span>
          <span>✓ {{t.trust2}}</span>
          <span>✓ {{t.trust3}}</span>
          <span>✓ {{t.trust4}}</span>
        </div>
      </div>
      <div style="flex: 1 1 320px; min-width: 0; display: flex; justify-content: center">
        <div style="width: 290px; height: 540px; background: #FFFFFF; border-radius: 36px; border: 10px solid #1B1B1F; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; color: #1B1B1F">
          <div style="height: 170px; background: #E9E2D6; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; color: #6B6458; font-size: 13px">{{t.mockLabel}}</div>
          <div style="padding: 18px; display: flex; flex-direction: column; gap: 10px">
            <div style="font-family: 'El Messiri', serif; font-size: 22px; font-weight: 700">{{t.mockName}}</div>
            <div style="font-size: 13px; color: #5A5A62">{{t.mockMeta}}</div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
              <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ECECEC; padding-bottom: 8px; font-size: 14px"><span>{{t.d1}}</span><span style="color: #0E4D4A; font-weight: 600">+</span></div>
              <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ECECEC; padding-bottom: 8px; font-size: 14px"><span>{{t.d2}}</span><span style="color: #0E4D4A; font-weight: 600">+</span></div>
              <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ECECEC; padding-bottom: 8px; font-size: 14px"><span>{{t.d3}}</span><span style="color: #0E4D4A; font-weight: 600">+</span></div>
            </div>
            <div style="margin-top: 10px; background: #1F8A4C; color: #FFFFFF; text-align: center; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 15px">{{t.mockOrder}}</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="services" style="max-width: 1200px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 12px; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700">{{t.servicesTitle}}</h2>
    <p style="margin: 0 0 48px; font-size: 18px; color: #55555C; max-width: 640px">{{t.servicesSub}}</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f1t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f1d}}</p>
      </div>
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f2t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f2d}}</p>
      </div>
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f3t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f3d}}</p>
      </div>
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f4t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f4d}}</p>
      </div>
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f5t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f5d}}</p>
      </div>
      <div style="background: #F3F6F5; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/></svg>
        <h3 style="margin: 0; font-size: 21px; font-weight: 600">{{t.f6t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.f6d}}</p>
      </div>
    </div>
  </section>

  <section style="background: #F7F5F0">
    <div style="max-width: 1200px; margin: 0 auto; padding: 88px 24px">
      <h2 style="margin: 0 0 12px; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700">{{t.showTitle}}</h2>
      <p style="margin: 0 0 40px; font-size: 18px; color: #55555C; max-width: 680px">{{t.showSub}}</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden; border: 1px solid #E4E0D6">
          <div style="background: #8A3B2A; color: #FFFFFF; padding: 28px 24px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px">
            <span style="align-self: flex-start; background: rgba(255,255,255,0.18); padding: 2px 12px; border-radius: 999px; font-size: 13px">{{t.demoTag}}</span>
            <span style="font-family: 'El Messiri', serif; font-size: 26px; font-weight: 700">{{t.demo1}}</span>
          </div>
          <div style="padding: 18px 24px; color: #4A4A52; font-size: 15px">{{t.demo1d}}</div>
        </div>
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden; border: 1px solid #E4E0D6">
          <div style="background: #3F5B45; color: #FFFFFF; padding: 28px 24px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px">
            <span style="align-self: flex-start; background: rgba(255,255,255,0.18); padding: 2px 12px; border-radius: 999px; font-size: 13px">{{t.demoTag}}</span>
            <span style="font-family: 'El Messiri', serif; font-size: 26px; font-weight: 700">{{t.demo2}}</span>
          </div>
          <div style="padding: 18px 24px; color: #4A4A52; font-size: 15px">{{t.demo2d}}</div>
        </div>
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden; border: 1px solid #E4E0D6">
          <div style="background: #2F3E5C; color: #FFFFFF; padding: 28px 24px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px">
            <span style="align-self: flex-start; background: rgba(255,255,255,0.18); padding: 2px 12px; border-radius: 999px; font-size: 13px">{{t.demoTag}}</span>
            <span style="font-family: 'El Messiri', serif; font-size: 26px; font-weight: 700">{{t.demo3}}</span>
          </div>
          <div style="padding: 18px 24px; color: #4A4A52; font-size: 15px">{{t.demo3d}}</div>
        </div>
      </div>
    </div>
  </section>

  <section id="how" style="max-width: 1200px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 48px; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700">{{t.howTitle}}</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: #0E4D4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">1</div>
        <h3 style="margin: 0; font-size: 22px; font-weight: 600">{{t.s1t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.s1d}}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: #0E4D4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">2</div>
        <h3 style="margin: 0; font-size: 22px; font-weight: 600">{{t.s2t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.s2d}}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: #0E4D4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">3</div>
        <h3 style="margin: 0; font-size: 22px; font-weight: 600">{{t.s3t}}</h3>
        <p style="margin: 0; color: #4A4A52">{{t.s3d}}</p>
      </div>
    </div>
  </section>

  <section id="pricing" style="background: #F3F6F5">
    <div style="max-width: 1200px; margin: 0 auto; padding: 96px 24px">
      <h2 style="margin: 0 0 12px; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700">{{t.priceTitle}}</h2>
      <p style="margin: 0 0 28px; font-size: 18px; color: #55555C">{{t.priceSub}}</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
        <button onClick="{{setMonthly}}" style="{{monthBtnStyle}}">{{t.monthly}}</button>
        <button onClick="{{setAnnual}}" style="{{yearBtnStyle}}">{{t.annual}}</button>
      </div>
      <div style="background: #FFF4D6; color: #5A4300; border-radius: 14px; padding: 12px 20px; margin-bottom: 32px; font-size: 16px; font-weight: 500">{{t.promo}}</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 24px; align-items: stretch">

        <div style="background: #FFFFFF; border: 1px solid #DCDCDF; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <h3 style="margin: 0; font-size: 24px; font-weight: 600">{{t.p1name}}</h3>
          <div style="color: #55555C; font-size: 15px">{{t.p1for}}</div>
          <div style="font-family: 'El Messiri', serif; font-size: 44px; font-weight: 700; line-height: 1.2">{{p1Price}}<span style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 16px; font-weight: 400; color: #55555C"> {{periodWord}}</span></div>
          <div style="color: #0E4D4A; font-size: 15px; font-weight: 600; min-height: 26px">{{p1Note}}</div>
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ECECEC; padding-top: 16px">
            <sc-for list="{{t.p1feats}}" as="f" hint-placeholder-count="5">
              <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px"><span style="color: #0E4D4A; font-weight: 700">✓</span><span>{{f.x}}</span></div>
            </sc-for>
          </div>
          <a href="https://nafetha-web.github.io/dalieh.html" target="_blank" style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; background: #F3F6F5; border-radius: 14px; padding: 12px 16px; color: #0E4D4A"><span style="font-weight: 600; font-size: 16px">{{t.p1example}}</span><span style="font-size: 14px; color: #55555C">{{t.p1exampleSub}}</span></a>
          <a href="#contact" style="margin-top: auto; text-decoration: none; text-align: center; border: 2px solid #0E4D4A; color: #0E4D4A; padding: 12px; border-radius: 999px; font-weight: 600">{{t.start}}</a>
        </div>

        <div style="background: #FFFFFF; border: 3px solid #0E4D4A; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <div style="align-self: flex-start; background: {{accent}}; color: #1B1B1F; padding: 4px 14px; border-radius: 999px; font-size: 14px; font-weight: 600">{{t.popular}}</div>
          <h3 style="margin: 0; font-size: 24px; font-weight: 600">{{t.p2name}}</h3>
          <div style="color: #55555C; font-size: 15px">{{t.p2for}}</div>
          <div style="font-family: 'El Messiri', serif; font-size: 44px; font-weight: 700; line-height: 1.2">{{p2Price}}<span style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 16px; font-weight: 400; color: #55555C"> {{periodWord}}</span></div>
          <div style="color: #0E4D4A; font-size: 15px; font-weight: 600; min-height: 26px">{{p2Note}}</div>
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ECECEC; padding-top: 16px">
            <sc-for list="{{t.p2feats}}" as="f" hint-placeholder-count="6">
              <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px"><span style="color: #0E4D4A; font-weight: 700">✓</span><span>{{f.x}}</span></div>
            </sc-for>
          </div>
          <a href="https://nafetha-web.github.io/rayhan.html" target="_blank" style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; background: #F3F6F5; border-radius: 14px; padding: 12px 16px; color: #0E4D4A"><span style="font-weight: 600; font-size: 16px">{{t.p1example}}</span><span style="font-size: 14px; color: #55555C">{{t.p2exampleSub}}</span></a>
          <a href="#contact" style="margin-top: auto; text-decoration: none; text-align: center; background: #0E4D4A; color: #FFFFFF; padding: 14px; border-radius: 999px; font-weight: 600">{{t.start}}</a>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #DCDCDF; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <h3 style="margin: 0; font-size: 24px; font-weight: 600">{{t.p3name}}</h3>
          <div style="color: #55555C; font-size: 15px">{{t.p3for}}</div>
          <div style="font-family: 'El Messiri', serif; font-size: 44px; font-weight: 700; line-height: 1.2">{{t.p3price}}</div>
          <div style="min-height: 26px"></div>
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ECECEC; padding-top: 16px">
            <sc-for list="{{t.p3feats}}" as="f" hint-placeholder-count="4">
              <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px"><span style="color: #0E4D4A; font-weight: 700">✓</span><span>{{f.x}}</span></div>
            </sc-for>
          </div>
          <a href="#contact" style="margin-top: auto; text-decoration: none; text-align: center; border: 2px solid #0E4D4A; color: #0E4D4A; padding: 12px; border-radius: 999px; font-weight: 600">{{t.quote}}</a>
        </div>
      </div>
    </div>
  </section>

  <section id="faq" style="max-width: 900px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 32px; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700">{{t.faqTitle}}</h2>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{t.faq}}" as="item" hint-placeholder-count="6">
        <details style="background: #F3F6F5; border-radius: 16px; padding: 4px 22px">
          <summary style="font-size: 18px; font-weight: 600; padding: 14px 0; list-style: none">{{item.q}}</summary>
          <p style="margin: 0 0 16px; color: #4A4A52; font-size: 17px">{{item.a}}</p>
        </details>
      </sc-for>
    </div>
  </section>

  <section style="background: #F7F5F0">
    <div style="max-width: 900px; margin: 0 auto; padding: 80px 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center">
      <h2 style="margin: 0; font-family: 'El Messiri', serif; font-size: 36px; font-weight: 700">{{t.aboutTitle}}</h2>
      <p style="margin: 0; font-size: 19px; color: #3A3A40; max-width: 700px">{{t.aboutText}}</p>
    </div>
  </section>

  <section id="contact" style="background: #0E4D4A; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-family: 'El Messiri', serif; font-size: 40px; font-weight: 700; line-height: 1.3">{{t.contactTitle}}</h2>
        <p style="margin: 0; font-size: 19px; color: #D5E6E4">{{t.contactSub}}</p>
