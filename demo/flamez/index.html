<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F0C0B">
<title>FlameZ | نموذج من نافذة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="preload" as="image" href="img/hero.jpg">
<style>
:root {
  --bg: #0F0C0B;
  --surface: #1A1513;
  --surface-2: #231C19;
  --fg: #F7F0EA;
  --muted: #B8ABA2;
  --line: #2F2623;
  --fire: #F2541B;
  --fire-2: #E0301E;
  --gold: #FFB627;
  --gold-soft: #33240F;
  --wa: #22A35A;
  --display: 'El Messiri', 'IBM Plex Sans Arabic', serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
  --latin: 'Bebas Neue', 'El Messiri', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; margin: 0 }
a { color: inherit }
img { display: block; max-width: 100% }
button { font-family: inherit; font-size: 16px }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance }
.ltr { direction: ltr; unicode-bidi: isolate }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px }

.demo { background: var(--gold); color: #1B1206; font-size: 13px; text-align: center; padding: 7px 16px; line-height: 1.5; font-weight: 600 }
.demo a { color: #1B1206; font-weight: 700 }

.top { position: sticky; top: 0; z-index: 20; background: rgba(15,12,11,.9); border-bottom: 1px solid var(--line) }
@supports (backdrop-filter: blur(8px)) { .top { background: rgba(15,12,11,.72); backdrop-filter: blur(12px) } }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; direction: ltr }
.logo b { font-family: var(--latin); font-weight: 400; font-size: 31px; letter-spacing: .04em; line-height: 1; background: linear-gradient(180deg, #FFD15C, var(--fire) 70%); -webkit-background-clip: text; background-clip: text; color: transparent }
.logo small { display: block; font-size: 9.5px; letter-spacing: .28em; color: var(--muted); font-weight: 600; margin-top: 1px }
.nav { display: flex; gap: 4px 18px; align-items: center; font-size: 15px }
.nav a { text-decoration: none; color: var(--muted) }
.nav a:hover { color: var(--fg) }
@media (max-width: 560px) { .nav a { display: none } }
.lang { background: transparent; color: var(--fg); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 14px; min-height: 40px; font-weight: 600; cursor: pointer }

.hero { position: relative; overflow: hidden; background: #000 }
.hero img.bg { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; opacity: .8 }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 4%, rgba(15,12,11,.7) 45%, rgba(15,12,11,.15)), radial-gradient(70% 60% at 50% 100%, rgba(242,84,27,.35), transparent 70%) }
.hero .wrap { position: relative; z-index: 1; min-height: min(70vh, 540px); display: flex; flex-direction: column; justify-content: flex-end; padding-block: 56px 30px; gap: 10px }
.pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 4px 14px; font-size: 14px; width: fit-content }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--fire); box-shadow: 0 0 0 4px rgba(242,84,27,.3) }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 11vw, 74px); line-height: 1.2; margin: 6px 0 0 }
.hero h1 em { font-style: normal; background: linear-gradient(180deg, #FFD15C, var(--fire) 75%); -webkit-background-clip: text; background-clip: text; color: transparent }
.hero p { margin: 0; font-size: 17px; color: #E8DDD5; max-width: 32em }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 14px; font-weight: 700; font-size: 16px; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap }
.btn-fire { background: linear-gradient(135deg, var(--gold), var(--fire) 60%, var(--fire-2)); color: #1B0B04; box-shadow: 0 10px 26px -10px rgba(242,84,27,.8) }
.btn-ghost { background: rgba(255,255,255,.08); color: #FFFFFF; border: 1.5px solid rgba(255,255,255,.35) }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); margin-top: 12px }
.facts span::before { content: "🔥"; margin-inline-end: 6px; font-size: 12px }

section.block { padding-block: 40px 4px; display: flex; flex-direction: column; gap: 14px }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--gold); margin: 0 }
.block h2 { font-family: var(--display); font-size: 34px; margin: 0; line-height: 1.3 }

/* offers */
.offers { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 80%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 8px }
.offers::-webkit-scrollbar { display: none }
@media (min-width: 820px) { .offers { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0 } }
.offer { scroll-snap-align: start; position: relative; border-radius: 22px; overflow: hidden; background: radial-gradient(90% 80% at 100% 0%, rgba(242,84,27,.28), transparent 60%), var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; padding: 18px 16px 16px; min-width: 0 }
.offer .badge { width: fit-content; background: var(--fire); color: #FFF; font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 2px 12px }
.offer h3 { margin: 0; font-family: var(--display); font-size: 23px; line-height: 1.35 }
.offer ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px }
.offer li { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted) }
.offer .row { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px }
.offer .big { font-family: var(--display); font-weight: 700; font-size: 25px; color: var(--gold); line-height: 1.2; font-variant-numeric: tabular-nums }
.offer .big small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 600 }
.offer .btn { min-height: 44px; padding: 0 16px; font-size: 15px }

/* menu: price list */
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 62px; z-index: 10; background: var(--bg); padding-block: 10px; margin-inline: -16px; padding-inline: 16px }
.tabs::-webkit-scrollbar { display: none }
.tab { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 0 16px; min-height: 42px; font-weight: 600; cursor: pointer }
.tab[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); color: #1B0B04 }
.cats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px }
@media (min-width: 860px) { .cat .items { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px } .cat .items .item:nth-child(2) { border-top: 0 } }
.cat .items .item:first-child { border-top: 0 }
@media (prefers-reduced-motion: no-preference) { .cat.anim { animation: catIn .28s ease } @keyframes catIn { from { opacity: 0; transform: translateY(8px) } } }
.tab .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 99px; background: var(--gold); color: #1B0B04; font-size: 12px; font-weight: 700; margin-inline-start: 6px; padding: 0 5px }
.tab[aria-pressed="true"] .n { background: #1B0B04; color: var(--gold) }
.cat { scroll-margin-top: 128px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 6px }
.cat h3 { font-family: var(--display); font-size: 25px; margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.cat h3 small { font-family: var(--body); font-size: 12.5px; color: var(--muted); font-weight: 400 }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line) }
.cat h3 + .item { border-top: 0 }
.item .nm { font-weight: 600; font-size: 15.5px; line-height: 1.4; min-width: 0 }
.opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end }
.opt { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 8px }
[dir="rtl"] .opt { padding: 4px 8px 4px 4px }
.opt.on { border-color: var(--fire) }
.opt .lb { display: block; font-size: 11px; color: var(--muted); line-height: 1.2 }
.opt .pr { display: block; font-weight: 700; color: var(--gold); font-size: 13.5px; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap }
.qty { display: flex; align-items: center; gap: 4px }
.qbtn { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--fire); background: transparent; color: var(--fg); font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0 }
.qbtn.add { background: var(--fire); color: #1B0B04 }
.qn { min-width: 16px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums }
.extra { color: var(--muted); font-size: 13px; padding: 8px 0 10px; border-top: 1px dashed var(--line) }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0 }

.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px }
.why div { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px }
.why b { font-size: 16px }
.why span { color: var(--muted); font-size: 14px }
.why i { font-style: normal; font-size: 22px }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.card { background: var(--gold-soft); border: 1px solid #4A3415; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.card b { font-size: 14px; color: var(--gold) }
.card a { font-weight: 600 }
.contacts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px }
.contacts a { text-decoration: none }
.foot { color: var(--muted); font-size: 13px; text-align: center; padding-block: 28px 130px }
.foot a { color: var(--gold); font-weight: 700 }

.order { position: fixed; inset-inline: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(26,21,19,.96); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0,0,0,.4); z-index: 30 }
.order .wrap { padding-inline: 0; display: flex; align-items: center; gap: 12px }
.order .sum { flex: 1; min-width: 0; font-size: 14px; color: var(--muted) }
.order .sum strong { display: block; color: var(--fg); font-size: 18px; font-variant-numeric: tabular-nums }
.wa { background: var(--wa); color: #FFFFFF }
.order .sum { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-align: start; padding: 0; cursor: pointer }
.order .sum u { color: var(--gold); text-decoration: none; font-weight: 600; font-size: 13px }
.revb[aria-disabled="true"] { opacity: .45; pointer-events: none }
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s }
.ov.on { opacity: 1; pointer-events: auto }
.rev { position: fixed; z-index: 41; inset-inline: 0; bottom: 0; max-height: 90vh; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1) }
.rev.on { transform: none }
@media (min-width: 700px) { .rev { inset-inline: auto; left: 50%; width: 560px; bottom: 50%; border-radius: 22px; border: 1px solid var(--line); transform: translate(-50%, 60%); opacity: 0; pointer-events: none; transition: transform .3s, opacity .25s } .rev.on { transform: translate(-50%, 50%); opacity: 1; pointer-events: auto } }
.rev header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px }
.rev h2 { font-family: var(--display); font-size: 26px; margin: 0 }
.rev .x { width: 40px; height: 40px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font-size: 22px; cursor: pointer; line-height: 1 }
.rev .bd { overflow: auto; padding: 0 18px 8px; overscroll-behavior: contain }
.rl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line) }
.rl b { font-weight: 600; font-size: 15px }
.rl small { display: block; color: var(--muted); font-size: 13px }
.rl .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
.rl .lt { font-weight: 700; font-variant-numeric: tabular-nums }
.rl .del { background: none; border: 0; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 0; text-decoration: underline; justify-self: start }
.rtot { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; font-family: var(--display); font-size: 20px; font-weight: 700 }
.rtot span:last-child { color: var(--gold); font-family: var(--body) }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; margin: 10px 0 }
.seg button { min-height: 42px; border-radius: 11px; border: 0; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--fire); color: #1B0B04 }
.fld { display: block; font-size: 13.5px; color: var(--muted); margin: 10px 0 0 }
.fld input, .fld textarea { display: block; width: 100%; margin-top: 4px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px }
.fld textarea { min-height: 64px; resize: vertical }
.fld input.err { border-color: var(--fire) }
.rev footer { padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px }
.rev footer .btn { width: 100% }
.rev .more { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 4px }
.cus .hd { color: var(--muted); font-size: 14px; margin: 0 0 6px }
.ings { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px }
.ing { min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--fire); background: rgba(242,84,27,.14); color: var(--fg); font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.ing::before { content: "✓"; color: var(--gold); font-weight: 700 }
.ing[aria-pressed="false"] { border-color: var(--line); background: transparent; color: var(--muted); text-decoration: line-through }
.ing[aria-pressed="false"]::before { content: "−"; color: var(--muted); text-decoration: none }
.addon { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px dashed var(--line); background: transparent; color: var(--fg); font-weight: 600; cursor: pointer; font-size: 15px }
.addon[aria-pressed="true"] { border-style: solid; border-color: var(--gold); background: var(--gold-soft) }
.addon span:last-child { color: var(--gold) }
.cqty { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; color: var(--muted); font-size: 14px }
.cqty .qbtn { width: 40px; height: 40px }
.cqty .qn { font-size: 18px; min-width: 28px }
.rl .mods { color: var(--gold); font-size: 12.5px; margin-top: 2px; display: block }
.cat .tip { color: var(--gold); font-size: 13px; margin: 2px 0 0 }
.rev .empty { color: var(--muted); text-align: center; padding: 30px 0 }
.wa[aria-disabled="true"] { opacity: .45; pointer-events: none }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth }
  .hero img.bg { animation: flicker 6s ease-in-out infinite alternate }
}
@keyframes flicker { 0% { transform: scale(1); filter: brightness(.95) } 50% { filter: brightness(1.1) } 100% { transform: scale(1.06); filter: brightness(1) } }
</style>
</head>
<body>

<div class="demo" id="demoBar"></div>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#" aria-label="FlameZ">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD15C"/><stop offset=".6" stop-color="#F2541B"/><stop offset="1" stop-color="#E0301E"/></linearGradient></defs><path d="M15 1c2 6 9 9 9 18a9 9 0 0 1-18 0c0-4 2-7 4-9 0 3 1 5 3 6-1-6 0-11 2-15z" fill="url(#fl)"/><path d="M15 18c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1 .5 2 1.3 2.4-.3-2.6.2-4.6.7-6.4z" fill="#FFD15C"/></svg>
      <span><b>FLAMEZ</b><small>BAKERY &amp; GRILL</small></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#offers" id="navOffers"></a><a href="#menu" id="navMenu"></a><a href="#visit" id="navVisit"></a>
      <button class="lang" id="langBtn" type="button"></button>
    </nav>
  </div>
</header>

<section class="hero">
  <img class="bg" src="img/hero.jpg" alt="" fetchpriority="high">
  <div class="wrap">
    <span class="pill"><i></i><span id="pill"></span></span>
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <div class="cta">
      <a class="btn btn-fire" href="#menu" id="ctaMenu"></a>
      <a class="btn btn-ghost" href="#offers" id="ctaOffers"></a>
    </div>
    <div class="facts" id="facts"></div>
  </div>
</section>

<main class="wrap">
  <section class="block" id="offers">
    <p class="eyebrow" id="offEyebrow"></p>
    <h2 id="offTitle"></h2>
    <div class="offers" id="offList"></div>
  </section>

  <section class="block" id="menu">
    <h2 id="menuTitle"></h2>
    <nav class="tabs" id="tabs" aria-label="Menu sections"></nav>
    <div class="cats" id="cats"></div>
    <p class="note" id="priceNote"></p>
  </section>

  <section class="block">
    <h2 id="whyTitle"></h2>
    <div class="why" id="why"></div>
  </section>

  <section class="block" id="visit">
    <h2 id="visitTitle"></h2>
    <div class="info">
      <div class="card"><b id="lblAddr"></b><span id="addr"></span><a id="mapLink" target="_blank" rel="noopener"></a></div>
      <div class="card"><b id="lblPhone"></b><div class="contacts" id="contacts"></div></div>
    </div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<div class="order">
  <div class="wrap">
    <button type="button" class="sum" id="sum" data-rev></button>
    <button type="button" class="btn btn-fire revb" id="revBtn" data-rev></button>
  </div>
</div>
<div class="ov" id="ov"></div>
<section class="rev cus" id="cus" role="dialog" aria-modal="true" aria-labelledby="cusH">
  <header><h2 id="cusH"></h2><button type="button" class="x" id="cusX" aria-label="close">×</button></header>
  <div class="bd" id="cusBd"></div>
  <footer><button type="button" class="btn btn-fire" id="cusAdd"></button></footer>
</section>
<section class="rev" id="rev" role="dialog" aria-modal="true" aria-labelledby="revH">
  <header><h2 id="revH"></h2><button type="button" class="x" id="revX" aria-label="close">×</button></header>
  <div class="bd" id="revBd"></div>
  <footer><a class="btn wa" id="goBtn" target="_blank" rel="noopener"></a><button type="button" class="more" id="revMore"></button></footer>
</section>

<script>
const WA = '96181910105';
const IG = 'https://www.instagram.com/flamez_bakery_grill';

const OFFERS = [
  { ar: 'عرض الكعكة المميزة', en: 'Signature ka\'ak deal', badge: { ar: 'عرض', en: 'Deal' },
    inc: { ar: ['3 كعكات على ذوقك'], en: ['Any 3 ka\'ak of your choice'] }, price: '$15' },
  { ar: 'ضاعف الطعمة', en: 'Double the flavor', badge: { ar: 'عرضان', en: '2 deals' },
    inc: { ar: ['برغر: 2 برغر + بطاطا صغيرة', 'بيتزا: 2 بيتزا'], en: ['Burger: 2 burgers + small fries', 'Pizza: 2 pizzas'] }, price: '1,000,000', sub: { ar: 'ل.ل للبرغر · 1,200,000 للبيتزا', en: 'LBP burger · 1,200,000 pizza' } },
  { ar: 'عرض ليالي المباريات', en: 'Match night offer', badge: { ar: 'للمجموعات', en: 'For groups' },

  if ($('rev').classList.contains('on')) renderReview();
}
function waMsg() {
  const t = T[lang], { keys, total } = totals();
  return [t.hello, ...keys.map(k => { const m = modsOf(k); return '- ' + cart[k] + ' × ' + nameOf(LN(k)) + (m ? ' [' + m + ']' : '') + ' (' + t.money(cart[k] * LN(k).p) + ')' }), t.total + ': ' + t.money(total), '',
    t.type + ': ' + t[form.type], form.type === 'deliv' && form.addr.trim() ? t.addr + ': ' + form.addr.trim() : null, form.name.trim() ? t.name.replace(/ \(.*\)/, '') + ': ' + form.name.trim() : null, form.notes.trim() ? t.notes.replace(/ \(.*\)/, '') + ': ' + form.notes.trim() : null].filter(x => x !== null).join('\n');
}
function setGo() {
  const t = T[lang], go = $('goBtn'), { count } = totals();
  go.textContent = t.go;
  if (!count) { go.setAttribute('aria-disabled', 'true'); go.removeAttribute('href'); return }
  go.removeAttribute('aria-disabled'); go.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(waMsg());
}
function renderReview() {
  const t = T[lang], { keys, count, total } = totals();
  $('revH').textContent = t.revH; $('revMore').textContent = t.more;
  if (!count) { $('revBd').innerHTML = '<p class="empty">' + t.empty + '</p>'; setGo(); return }
  $('revBd').innerHTML = keys.map(k => '<div class="rl"><div><b>' + nameOf(LN(k)) + '</b>' + (modsOf(k) ? '<span class="mods">' + modsOf(k) + '</span>' : '') + '<small><span class="ltr">' + t.money(LN(k).p) + '</span> ' + t.each + '</small></div><div class="rt"><span class="lt ltr">' + t.money(cart[k] * LN(k).p) + '</span><div class="qty"><button type="button" class="qbtn" data-dec="' + k + '" aria-label="' + t.remove + '">−</button><span class="qn">' + cart[k] + '</span><button type="button" class="qbtn add" data-inc="' + k + '" aria-label="' + t.add + '">+</button></div></div><button type="button" class="del" data-del="' + k + '">' + t.del + '</button></div>').join('') +
    '<div class="rtot"><span>' + t.total + '</span><span class="ltr">' + t.money(total) + '</span></div>' +
    '<div class="seg" role="group" aria-label="' + t.type + '"><button type="button" data-type="deliv" aria-pressed="' + (form.type === 'deliv') + '">' + t.deliv + '</button><button type="button" data-type="pick" aria-pressed="' + (form.type === 'pick') + '">' + t.pick + '</button></div>' +
    (form.type === 'deliv' ? '<label class="fld">' + t.addr + '<input data-f="addr" autocomplete="street-address" placeholder="' + t.addrPh + '" value="' + esc(form.addr) + '"></label>' : '') +
    '<label class="fld">' + t.name + '<input data-f="name" autocomplete="name" value="' + esc(form.name) + '"></label>' +
    '<label class="fld">' + t.notes + '<textarea data-f="notes" placeholder="' + t.notesPh + '">' + esc(form.notes) + '</textarea></label>' +
    '<p style="text-align:center;margin:12px 0 4px"><button type="button" class="more" data-clear>' + t.clear + '</button></p>';
  setGo();
}
let lastFocus = null;
function openRev() { if (!totals().count) return; lastFocus = document.activeElement; renderReview(); $('ov').classList.add('on'); $('rev').classList.add('on'); document.body.style.overflow = 'hidden'; setTimeout(() => $('revX').focus(), 50) }
function closeRev() { $('ov').classList.remove('on'); $('rev').classList.remove('on'); document.body.style.overflow = ''; lastFocus && lastFocus.focus && lastFocus.focus() }
function changed() { saveCart(); const y = window.scrollY, sl = $('tabs').scrollLeft; renderMenu(); $('tabs').scrollLeft = sl; renderOrder(); window.scrollTo(0, y) }
function renderAll() { renderStatic(); renderMenu(); renderOrder() }

$('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('flamez-lang', lang) } catch (e) {} renderAll() });
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (!b || b.dataset.cat === activeCat) return; const sl = $('tabs').scrollLeft; activeCat = b.dataset.cat; renderMenu(1); $('tabs').scrollLeft = sl; setTabs(); const el = $('cat-' + activeCat); if (el && el.getBoundingClientRect().top < 120) el.scrollIntoView({ block: 'start' }) });
$('cats').addEventListener('click', (e) => {
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'); if (!inc && !dec) return;
  const k = inc ? inc.dataset.inc : dec.dataset.dec;
  if (inc) { if (ING[LINES[k].c.id]) { openCus(k); return } cart[k] = (cart[k] || 0) + 1 }
  else { const v = Object.keys(cart).filter(x => x.split('~')[0] === k).pop(); if (!v) return; cart[v]--; if (!cart[v]) delete cart[v] }
  changed();
});
document.querySelector('.order').addEventListener('click', (e) => { if (e.target.closest('[data-rev]')) openRev() });
let cus = null;
function renderCus() {
  const t = T[lang], l = LINES[cus.k], g = ING[l.c.id], ai = lang === 'ar' ? 0 : 1, price = l.p + (cus.x ? g.addon[1] : 0);
  $('cusH').textContent = nameOf(l);
  $('cusBd').innerHTML = '<p class="hd">' + t.cusHd + '</p><div class="ings">' + g.list.map((x, i) => '<button type="button" class="ing" data-ing="' + i + '" aria-pressed="' + !cus.rm.includes(i) + '">' + (cus.rm.includes(i) ? t.without + ' ' : '') + x[ai] + '</button>').join('') + '</div>' +
    (g.addon ? '<button type="button" class="addon" data-addon aria-pressed="' + cus.x + '"><span>' + (cus.x ? '✓ ' : '+ ') + g.addon[0][ai] + '</span><span class="ltr">+' + (g.addon[1] * 1000).toLocaleString('en-US') + '</span></button>' : '') +
    '<div class="cqty"><span>' + t.qtyL + '</span><div class="qty"><button type="button" class="qbtn" data-cq="-1" aria-label="' + t.remove + '">−</button><span class="qn">' + cus.q + '</span><button type="button" class="qbtn add" data-cq="1" aria-label="' + t.add + '">+</button></div></div>';
  $('cusAdd').innerHTML = t.addTo + ' · <span class="ltr">' + t.money(price * cus.q) + '</span>';
}
function openCus(k) { cus = { k, rm: [], x: false, q: 1 }; renderCus(); $('ov').classList.add('on'); $('cus').classList.add('on'); document.body.style.overflow = 'hidden'; setTimeout(() => $('cusX').focus(), 50) }
function closeCus() { $('cus').classList.remove('on'); if (!$('rev').classList.contains('on')) { $('ov').classList.remove('on'); document.body.style.overflow = '' } cus = null }
$('cusBd').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !cus) return; const d = b.dataset;
  if (d.ing) { const i = +d.ing; cus.rm = cus.rm.includes(i) ? cus.rm.filter(x => x !== i) : [...cus.rm, i].sort((a, b) => a - b) }
  else if ('addon' in d) cus.x = !cus.x;
  else if (d.cq) cus.q = Math.max(1, Math.min(20, cus.q + +d.cq));
  renderCus();
});
$('cusAdd').addEventListener('click', () => { if (!cus) return; const key = cus.k + (cus.rm.length || cus.x ? '~' + cus.rm.join('.') + (cus.x ? '~x' : '') : ''); cart[key] = (cart[key] || 0) + cus.q; closeCus(); changed() });
$('cusX').addEventListener('click', closeCus);
$('ov').addEventListener('click', () => { if ($('cus').classList.contains('on')) closeCus(); else closeRev() }); $('revX').addEventListener('click', closeRev); $('revMore').addEventListener('click', closeRev);
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('cus').classList.contains('on')) closeCus(); else if ($('rev').classList.contains('on')) closeRev() });
$('revBd').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.inc) cart[d.inc]++;
  else if (d.dec) { cart[d.dec]--; if (!cart[d.dec]) delete cart[d.dec] }
  else if (d.del) delete cart[d.del];
  else if ('clear' in d) Object.keys(cart).forEach(k => delete cart[k]);
  else if (d.type) { form.type = d.type; renderReview(); return }
  else return;
  changed();
});
$('revBd').addEventListener('input', (e) => { const f = e.target.dataset.f; if (!f) return; form[f] = e.target.value; e.target.classList.remove('err'); setGo() });
$('goBtn').addEventListener('click', (e) => {
  if (form.type === 'deliv' && !form.addr.trim()) { e.preventDefault(); const a = $('revBd').querySelector('[data-f=addr]'); if (a) { a.classList.add('err'); a.placeholder = T[lang].needAddr; a.focus() } }
});
renderAll();
</script>
