<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Store Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --fg: #111827; --muted: #6B7280; --line: #E5E7EB; --soft: #F1F3F6;
  --ink: #0F2A44; --ink-2: #1D4366; --ink-soft: #E8EEF5;
  --accent: #F59E0B; --sale: #DC2626; --sale-soft: #FEF2F2;
  --wa: #1F7A45;
  --body: 'Inter', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
}
:root[lang="ar"] { --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1319; --surface: #161C24; --fg: #EEF1F5; --muted: #9AA4B2; --line: #252D38; --soft: #1C232D;
  --ink: #3B7BBF; --ink-2: #5A93D0; --ink-soft: #1A2633; --sale: #F05252; --sale-soft: #2A1719; --wa: #2B9A5A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1319; --surface: #161C24; --fg: #EEF1F5; --muted: #9AA4B2; --line: #252D38; --soft: #1C232D;
  --ink: #3B7BBF; --ink-2: #5A93D0; --ink-soft: #1A2633; --sale: #F05252; --sale-soft: #2A1719; --wa: #2B9A5A; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 140px }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; margin: 0 }
a { color: inherit }
button, input, textarea { font-family: inherit; font-size: 16px; color: inherit }
button { -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
.ltr { direction: ltr; unicode-bidi: isolate }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px }
[hidden] { display: none !important }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; gap: 8px; min-height: 64px }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; text-decoration: none; white-space: nowrap; margin-inline-end: auto; color: var(--ink); min-width: 0 }
.logo i { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none }
.lang { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer }
.ibtn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; flex: none }
.ibtn .badge { position: absolute; top: -6px; inset-inline-end: -6px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--sale); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid var(--surface) }
.search { padding-bottom: 12px }
.search label { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 12px; padding: 0 14px; min-height: 46px }
.search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent }
.search svg { color: var(--muted); flex: none }

/* hero */
.hero { margin-top: 16px; border-radius: 20px; background: var(--ink); color: #FFFFFF; padding: 28px 22px; display: grid; gap: 14px; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; inset-inline-end: -60px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,.06) }
.hero small { color: var(--accent); font-weight: 600; font-size: 14px }
.hero h1 { font-size: clamp(26px, 5.5vw, 40px); line-height: 1.25; font-weight: 700; max-width: 15em }
.hero p { margin: 0; color: #C9D6E3; max-width: 30em; font-size: 15.5px }
.hero .row { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px; border: 0; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn-light { background: #FFFFFF; color: var(--ink) }
.btn-outline-light { background: transparent; color: #FFFFFF; border: 1.5px solid rgba(255,255,255,.4) }
.btn-ink { background: var(--ink); color: #FFFFFF }
.btn-ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line) }
.btn-wa { background: var(--wa); color: #FFFFFF }
.btn-block { width: 100% }

/* categories */
.sec { margin-top: 28px }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px }
.sechead h2 { font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px }
.link { background: none; border: 0; color: var(--ink-2); font-weight: 600; cursor: pointer; padding: 6px 0; font-size: 15px }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
@media (min-width: 760px) { .cats { grid-template-columns: repeat(7, minmax(0, 1fr)) } }
.cat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 14px; text-align: center; line-height: 1.3 }
.cat i { width: 46px; height: 46px; border-radius: 14px; background: var(--ink-soft); color: var(--ink-2); display: flex; align-items: center; justify-content: center }
.cat[aria-pressed="true"] { border-color: var(--ink); background: var(--ink-soft) }
.cat.is-sale i { background: var(--sale-soft); color: var(--sale) }
.cat.is-sale[aria-pressed="true"] { border-color: var(--sale); background: var(--sale-soft) }

/* lists */
.saletag { background: var(--sale); color: #FFFFFF; font-size: 13px; font-weight: 700; border-radius: 8px; padding: 2px 10px }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 47%); gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; scroll-snap-type: x mandatory }
.rail > * { scroll-snap-align: start }
.rail::-webkit-scrollbar { display: none }
@media (min-width: 760px) { .rail { grid-auto-columns: 230px } }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px } }
@media (min-width: 1040px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; margin: 0 }

/* product card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column }
.thumb { aspect-ratio: 1 / 1; background: var(--soft); display: flex; align-items: center; justify-content: center; position: relative; color: #94A3B8 }
.thumb svg.ph { width: 42%; height: 42% }
.thumb img { width: 100%; height: 100%; object-fit: cover }
.off { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--sale); color: #FFFFFF; font-weight: 700; font-size: 12.5px; border-radius: 7px; padding: 1px 8px }
.fav { position: absolute; top: 8px; inset-inline-end: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.1) }
.fav[aria-pressed="true"] { color: var(--sale) }
.fav[aria-pressed="true"] path { fill: currentColor }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1 }
.info .cl { font-size: 12.5px; color: var(--muted) }
.info h3 { font-size: 14.5px; font-weight: 500; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em }
.price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px }
.price b { font-size: 18px; font-weight: 700 }
.card.onsale .price b { color: var(--sale) }
.price s { font-size: 13.5px; color: var(--muted) }
.acts { display: flex; gap: 8px; margin-top: auto }
.buy { flex: 1; min-height: 42px; border-radius: 11px; border: 0; background: var(--ink); color: #FFFFFF; font-weight: 600; font-size: 14.5px; cursor: pointer; padding: 0 8px; white-space: nowrap }
.addc { position: relative; flex: none; width: 46px; min-height: 42px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center }
.addc.in { border-color: var(--ink-2); background: var(--ink-soft) }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin: -4px 0 14px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend b { display: inline-flex; align-items: center; justify-content: center; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--ink); color: #FFFFFF; font-size: 11.5px; font-weight: 600 }
.legend b.o { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-2); padding: 0 4px }

/* perks + footer */
.perks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 30px }
@media (min-width: 760px) { .perks { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.perk { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600 }
.perk svg { flex: none; color: var(--ink-2) }
footer { margin-top: 36px; background: var(--surface); border-top: 1px solid var(--line); padding: 26px 0 30px; font-size: 15px; color: var(--muted) }
footer h3 { color: var(--fg); font-size: 16px; margin-bottom: 6px }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px }
@media (min-width: 760px) { .fgrid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
footer p { margin: 0 0 4px }
.credit { margin-top: 20px; font-size: 13px; text-align: center }

/* sheets */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 22px 22px 0 0; background: var(--surface); color: var(--fg) }
@media (min-width: 760px) { dialog.sheet { margin: auto; border-radius: 20px } }
dialog.sheet::backdrop { background: rgba(10,16,24,.55) }
.sh { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); z-index: 2 }
.sh h2 { font-size: 19px; font-weight: 700 }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); cursor: pointer; font-size: 22px; line-height: 1 }
.sb { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px }
.line { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
.line:last-child { border-bottom: 0; padding-bottom: 0 }
.line .mini { width: 56px; height: 56px; border-radius: 12px; flex: none; background: var(--soft); color: #94A3B8; display: flex; align-items: center; justify-content: center; overflow: hidden }
.line .mini svg { width: 55%; height: 55% }
.line .mini img { width: 100%; height: 100%; object-fit: cover }
.line .t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.4 }
.line .t small { display: block; color: var(--muted); margin-top: 2px }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 11px; padding: 3px }
.stepper button { width: 32px; height: 32px; border: 0; border-radius: 9px; background: var(--surface); color: var(--fg); font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1; box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.stepper span { min-width: 22px; text-align: center; font-weight: 700 }
.totals { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 15px }
.totals div { display: flex; justify-content: space-between }
.totals .save { color: var(--sale); font-weight: 600 }
.totals.plain .grand { border-top: 0; padding-top: 0; margin-top: 0 }
.totals .grand { font-size: 18px; font-weight: 700; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px }
.field { display: flex; flex-direction: column; gap: 6px }
.field label, .flabel { font-weight: 600; font-size: 14.5px }
.field input, .field textarea { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; min-height: 48px; width: 100%; min-width: 0 }
.field input:focus, .field textarea:focus { border-color: var(--ink-2); outline: none }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.seg button { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer }
.seg button[aria-pressed="true"] { border-color: var(--ink-2); background: var(--ink-soft); color: var(--ink-2) }
.hint { background: var(--ink-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between }
.hint button { background: none; border: 0; color: var(--ink-2); font-weight: 700; cursor: pointer; white-space: nowrap; padding: 6px 0 }
.muted { color: var(--muted); font-size: 14px; margin: 0 }
.err { color: var(--sale); font-size: 14px; font-weight: 600; margin: 0 }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px }
.tabs button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.08) }
.order { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px }
.order b { display: flex; justify-content: space-between }
.hello { display: flex; align-items: center; gap: 12px }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 21px; flex: none }

/* quiet notification */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 50; transform: translate(-50%, 8px); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,.08); white-space: nowrap }
.toast.show { opacity: 1; transform: translate(-50%, 0) }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="9" rx="2.2" ry="2.8"/><ellipse cx="10" cy="5.5" rx="2.2" ry="2.8"/><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="9" rx="2.2" ry="2.8"/><path d="M12 11c-3 0-6.5 3.6-6.5 6.4 0 2 1.6 2.9 3.4 2.9 1.2 0 2.1-.6 3.1-.6s1.9.6 3.1.6c1.8 0 3.4-.9 3.4-2.9 0-2.8-3.5-6.4-6.5-6.4z"/></svg></i><span data-t="shop"></span></a>
      <button class="lang" id="langBtn" type="button"></button>
      <button class="ibtn" id="accBtn" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
      <button class="ibtn" id="cartBtn" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="badge" id="cartCount" hidden>0</span></button>
    </div>
    <div class="search"><label><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search"></label></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <small data-t="heroTag"></small>
    <h1 data-t="heroTitle"></h1>
    <p data-t="heroText"></p>
    <div class="row"><a class="btn btn-light" href="#sales" data-t="heroSale"></a><a class="btn btn-outline-light" href="#cats" data-t="heroCats"></a></div>
  </section>

  <section class="sec" id="cats">
    <div class="sechead"><h2 data-t="cats"></h2></div>
    <div class="cats" id="catList"></div>
  </section>

  <section class="sec" id="sales">
    <div class="sechead"><h2><span data-t="sales"></span> <span class="saletag" data-t="saleTag"></span></h2><button class="link" type="button" id="seeSales" data-t="seeAll"></button></div>
    <div class="rail" id="saleRail"></div>
  </section>

  <section class="sec" id="all">
    <div class="sechead"><h2 id="listTitle"></h2><span class="muted" id="listCount"></span></div>
    <div class="legend"><span><b data-t="orderNow"></b><span data-t="legBuy"></span></span><span><b class="o"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><path d="M13 9.5v4M11 11.5h4"/></svg></b><span data-t="legAdd"></span></span></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden data-t="noMatch"></p>
  </section>

  <section class="perks">
    <div class="perk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg><span data-t="perk1"></span></div>
    <div class="perk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg><span data-t="perk2"></span></div>
    <div class="perk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span data-t="perk3"></span></div>
    <div class="perk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3.6-7.2L21 4v5h-5"/></svg><span data-t="perk4"></span></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div><h3 data-t="shop"></h3><p data-t="footAbout"></p></div>
      <div><h3 data-t="contact"></h3><p>WhatsApp: <span class="ltr" id="waShow"></span></p><p>Instagram: <span class="ltr">@shop</span></p></div>
      <div><h3 data-t="hoursT"></h3><p data-t="hours"></p></div>
    </div>
    <p class="credit"><span data-t="by"></span> <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">Nafetha</a></p>
  </div>
</footer>

<!-- order sheet (cart and "order now") -->
<dialog class="sheet" id="orderSheet" aria-labelledby="oTitle">
  <div class="sh"><h2 id="oTitle"></h2><button class="x" type="button" data-close>×</button></div>
  <div class="sb">
    <div id="oLines" class="sb" style="padding:0;gap:12px"></div>
    <p class="empty" id="oEmpty" hidden data-t="cartEmpty"></p>
    <div id="checkout" class="sb" style="padding:0">
      <div class="totals" id="totals">
        <div id="tSubRow"><span data-t="subtotal"></span><span id="tSub"></span></div>
        <div class="save" id="tSaveRow"><span data-t="saved"></span><span id="tSave"></span></div>
        <div class="grand"><span data-t="total"></span><span id="tTotal"></span></div>
      </div>
      <div class="hint" id="guestHint"><span data-t="hint"></span><button type="button" id="hintAcc" data-t="signIn"></button></div>
      <div class="field"><span class="flabel" data-t="method"></span>
        <div class="seg" id="mode"><button type="button" data-m="delivery" aria-pressed="true" data-t="delivery"></button><button type="button" data-m="pickup" aria-pressed="false" data-t="pickup"></button></div>
      </div>
      <div class="field"><label for="cName" data-t="name"></label><input id="cName" autocomplete="name"></div>

  const saving = sub - tot > 0;
  $('tSub').textContent = money(sub); $('tSave').textContent = money(sub - tot); $('tTotal').textContent = money(tot);
  $('tSaveRow').hidden = $('tSubRow').hidden = !saving; $('totals').classList.toggle('plain', !saving);
  $('guestHint').hidden = !!user;
}
function openOrder(id) {
  quick = id ? { id, q: 1 } : null;
  if (user) for (const [f, k] of [['cName', 'name'], ['cPhone', 'phone'], ['cAddr', 'addr']]) if (!$(f).value) $(f).value = user[k] || '';
  $('cErr').hidden = true; renderOrder(); $('orderSheet').showModal();
}
$('orderSheet').addEventListener('close', () => { quick = null });

document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if (!b) return;
  const d = b.dataset;
  if (d.add) { cart[d.add] = (cart[d.add] || 0) + 1; render(); toast(t().tAdded) }
  else if (d.buy) { if (b.closest('dialog')) b.closest('dialog').close(); openOrder(+d.buy) }
  else if (d.inc || d.dec) {
    const id = d.inc || d.dec, step = d.inc ? 1 : -1;
    if (quick) { quick.q = Math.max(1, quick.q + step); renderOrder() }
    else { cart[id] = (cart[id] || 0) + step; if (cart[id] <= 0) delete cart[id]; render() }
  }
  else if (d.fav) { const id = +d.fav; favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; store.set('favs', favs); render(); toast(favs.includes(id) ? t().tFav : t().tUnfav) }
  else if (d.cat) { filter = d.cat; query = ''; $('q').value = ''; render(); $('all').scrollIntoView({ behavior: 'smooth' }) }
  else if (b.hasAttribute('data-close')) b.closest('dialog').close();
});
$('langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'ar' : 'en'; store.set('lang', lang); applyLang() });
$('q').addEventListener('input', e => { query = e.target.value; render() });
$('seeSales').addEventListener('click', () => { filter = 'sale'; render(); $('all').scrollIntoView({ behavior: 'smooth' }) });
$('cartBtn').addEventListener('click', () => openOrder());
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; [...$('mode').children].forEach(x => x.setAttribute('aria-pressed', x === b)); $('addrField').hidden = mode === 'pickup' });
$('hintAcc').addEventListener('click', () => { $('orderSheet').close(); openAcc() });

$('sendWa').addEventListener('click', () => {
  const name = $('cName').value.trim(), phone = $('cPhone').value.trim(), addr = $('cAddr').value.trim(), note = $('cNote').value.trim();
  const err = !name ? t().errName : !phone ? t().errPhone : (mode === 'delivery' && !addr) ? t().errAddr : '';
  $('cErr').textContent = err; $('cErr').hidden = !err; if (err) return;
  const L = curLines(), tot = L.reduce((s, l) => s + l.q * l.p.p, 0), x = t();
  const msg = [x.waHead, '', ...L.map(({ p, q }) => `• ${nm(p)} × ${q} = ${money(p.p * q)}`), '', `${x.waTotal}: ${money(tot)}`,
    `${x.waMethod}: ${mode === 'delivery' ? x.delivery : x.pickup}`, `${x.waName}: ${name}`, `${x.waPhone}: ${phone}`,
    mode === 'delivery' ? `${x.waAddr}: ${addr}` : '', note ? `${x.waNote}: ${note}` : ''].filter(Boolean).join('\n');
  if (user) { orders.unshift({ d: new Date().toISOString().slice(0, 10), items: L.map(({ p, q }) => ({ id: p.id, q })), t: tot }); orders = orders.slice(0, 20); store.set('orders', orders) }
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
  if (!quick) cart = {};
  $('cNote').value = ''; $('orderSheet').close(); render(); toast(x.tSent);
});

// account (saved on this device only)
$('accBtn').addEventListener('click', openAcc);
function openAcc() { renderAcc(); $('accSheet').showModal() }
function renderAcc() {
  $('accOut').hidden = !!user; $('accIn').hidden = !user; if (!user) return;
  $('avatar').textContent = user.name.trim()[0] || '?'; $('helloName').textContent = t().hello + user.name; $('helloPhone').textContent = user.phone;
  [...$('accTabs').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === accTab));
  $('tabFav').hidden = accTab !== 'fav'; $('tabOrders').hidden = accTab !== 'orders'; $('tabInfo').hidden = accTab !== 'info';
  const F = P.filter(p => favs.includes(p.id)); $('favGrid').innerHTML = F.map(cardHTML).join(''); $('favEmpty').hidden = F.length > 0;
  $('orderList').innerHTML = orders.map(o => `<div class="order"><b><span class="ltr">${o.d}</span><span>${money(o.t)}</span></b><div class="muted">${o.items.map(i => { const p = P.find(x => x.id === i.id); return (p ? nm(p) : '') + ' × ' + i.q }).join(lang === 'ar' ? '، ' : ', ')}</div></div>`).join('');
  $('ordEmpty').hidden = orders.length > 0;
  $('eName').value = user.name; $('ePhone').value = user.phone; $('eAddr').value = user.addr || ''; $('eMail').value = user.mail || '';
}
$('accTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { accTab = b.dataset.tab; renderAcc() } });
$('signUp').addEventListener('click', () => {
  const name = $('aName').value.trim(), phone = $('aPhone').value.trim();
  const err = !name ? t().errName : !phone ? t().errPhone : '';
  $('aErr').textContent = err; $('aErr').hidden = !err; if (err) return;
  user = { name, phone, addr: $('aAddr').value.trim(), mail: $('aMail').value.trim() }; store.set('user', user); accTab = 'fav'; render(); renderAcc(); toast(t().tCreated);
});
$('saveInfo').addEventListener('click', () => { user = { name: $('eName').value.trim() || user.name, phone: $('ePhone').value.trim() || user.phone, addr: $('eAddr').value.trim(), mail: $('eMail').value.trim() }; store.set('user', user); renderAcc(); toast(t().tSaved) });
$('logout').addEventListener('click', () => { user = null; orders = []; store.set('user', null); store.set('orders', []); $('cName').value = $('cPhone').value = $('cAddr').value = ''; render(); renderAcc(); toast(t().tOut) });

$('waShow').textContent = '+' + WA.replace(/^(\d{3})(\d{2})(\d{3})(\d{3})$/, '$1 $2 $3 $4');
applyLang();
</script>
</body>
</html>
