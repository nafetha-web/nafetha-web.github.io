<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pit Stop | كاراج وصيانة سيارات</title>
<meta name="description" content="كاراج صيانة سيارات: احسب كلفة الصيانة ووقت التسليم، احجز موعدك، وتابع حالة سيارتك أونلاين.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#16181B;--ink2:#565C64;--steel:#EEF0F2;--paper:#FFFFFF;--red:#E63A2E;--red2:#C92D22;--line:#D9DDE1;--ok:#1E9E5A;--wrap:1220px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--ink);background:var(--steel);font-size:17px;line-height:1.65}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
h1,h2,h3{font-weight:900;line-height:1.15}
h2{font-size:clamp(34px,4.6vw,56px)}
.lead{color:var(--ink2);font-size:18px;max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:8px;font-weight:800;font-size:17px;transition:background .15s,transform .15s}
.btn:active{transform:scale(.97)}
.b-red{background:var(--red);color:#fff}.b-red:hover{background:var(--red2)}
.b-out{border:2px solid rgba(255,255,255,.6);color:#fff}
.b-ink{background:var(--ink);color:#fff}
.b-wa{background:#25D366;color:#073B22}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
section{scroll-margin-top:70px}
.sec{padding:100px 0}
@media (max-width:700px){.sec{padding:68px 0}}
.check{height:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 12px,#fff 12px 24px),repeating-linear-gradient(90deg,#fff 0 12px,var(--ink) 12px 24px);background-size:24px 6px;background-repeat:repeat-x;background-position:0 0,0 6px}
.ribbon{background:#000;color:#CCC;font-size:13px;text-align:center;padding:8px 16px}
.ribbon a{color:#fff;text-decoration:underline;text-underline-offset:3px}
header{position:sticky;top:0;z-index:40;background:rgba(22,24,27,.96);backdrop-filter:blur(8px);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;font-style:italic;letter-spacing:.01em}
.links{display:flex;gap:24px;font-size:15px;font-weight:700;color:#C9CDD2}.links a:hover{color:#fff}
.nav-end{display:flex;gap:10px;align-items:center}
.lang{height:40px;padding:0 14px;border-radius:8px;border:1px solid #3A3F45;font-size:14px;font-weight:700}
.nav .btn{height:42px;padding:0 18px;font-size:15px}
@media (max-width:920px){.links{display:none}.nav .btn{display:none}}

/* hero */
.hero{position:relative;color:#fff;background:#0E0F11;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,17,.2),rgba(14,15,17,.92) 70%)}
[dir=ltr] .hero::after{background:linear-gradient(270deg,rgba(14,15,17,.2),rgba(14,15,17,.92) 70%)}
.hero .wrap{position:relative;z-index:2;padding-top:120px;padding-bottom:100px}
.hero h1{font-size:clamp(46px,7vw,96px);max-width:12ch;letter-spacing:-.02em}
.hero h1 span+span{color:var(--red)}
.hero p{color:#C9CDD2;font-size:20px;max-width:44ch;margin:20px 0 32px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.badges{display:flex;gap:28px;margin-top:46px;flex-wrap:wrap}
.badges div{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;color:#E4E6E9}
.badges svg{color:var(--red);flex:none}
@media (max-width:760px){.hero::after{background:linear-gradient(0deg,rgba(14,15,17,.95) 45%,rgba(14,15,17,.3))}.hero .wrap{padding-top:200px;padding-bottom:60px}}

/* estimator */
.est{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;margin-top:40px;align-items:start}
.card{min-width:0;background:var(--paper);border-radius:14px;border:1px solid var(--line);padding:28px}
.card h4{font-size:16px;font-weight:800;margin-bottom:12px}
.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:26px}
.car{padding:12px 6px;border-radius:10px;border:2px solid var(--line);text-align:center;font-weight:800;font-size:15px}
.car svg{display:block;margin:0 auto 4px;color:var(--ink2)}
.car[aria-pressed=true]{border-color:var(--red);background:#FFF3F2}
.car[aria-pressed=true] svg{color:var(--red)}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:flex;gap:12px;align-items:center;text-align:start;padding:12px;border-radius:10px;border:2px solid var(--line);background:#fff}
.svc .ic{width:40px;height:40px;border-radius:8px;background:var(--steel);display:grid;place-items:center;flex:none;color:var(--ink)}
.svc b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.svc small{font-size:13px;color:var(--ink2)}
.svc[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.svc[aria-pressed=true] small{color:#C9CDD2}
.svc[aria-pressed=true] .ic{background:var(--red);color:#fff}
.sum{position:sticky;top:90px;background:var(--ink);color:#fff;border:0}
.sum .lbl{color:#9EA4AB;font-size:14px;font-weight:700}
.sum .big{font-size:58px;font-weight:900;line-height:1.1;direction:ltr;text-align:start;margin:4px 0 16px}
[dir=rtl] .sum .big{text-align:right}
.sum ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#D5D8DC;margin-bottom:18px;min-height:30px}
.sum li{display:flex;justify-content:space-between;gap:10px}
.sum .row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #2C3036;font-size:15px}
.sum .row b{font-weight:800}
.sum .days{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px}
.sum .day{flex:none;padding:8px 12px;border-radius:8px;border:1.5px solid #3A3F45;font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.sum .day[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.sum .day[disabled]{opacity:.3;cursor:not-allowed}
.sum select,.sum input{width:100%;height:50px;border-radius:8px;border:1.5px solid #3A3F45;background:#202328;color:#fff;padding:0 12px;font-size:16px;margin-top:8px}
.sum .err{color:#FF9C94;font-size:14px;min-height:20px;margin:8px 0}
.sum .btn{width:100%}
.empty{color:#9EA4AB}
@media (max-width:900px){.est{grid-template-columns:minmax(0,1fr)}.sum{position:static}.cars{grid-template-columns:repeat(2,1fr)}.svcs{grid-template-columns:1fr}}

/* tracker */
#track{background:var(--ink);color:#fff}
#track .lead{color:#C9CDD2}
.trk{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;margin-top:40px;align-items:start}
.trk form{display:flex;gap:10px}
.trk input{flex:1;min-width:0;height:56px;border-radius:8px;border:2px solid #3A3F45;background:#202328;color:#fff;padding:0 16px;font-size:20px;font-weight:800;letter-spacing:.1em;direction:ltr;text-transform:uppercase}
.trk .hint{font-size:14px;color:#9EA4AB;margin-top:10px}
.trk .hint button{color:#fff;text-decoration:underline;font-weight:800}
.tl{list-style:none;position:relative;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding-bottom:22px;position:relative}
.tl li::before{content:'';position:absolute;inset-inline-start:21px;top:40px;bottom:0;width:2px;background:#3A3F45}
.tl li:last-child::before{display:none}
.tl .dot{width:44px;height:44px;border-radius:50%;border:2px solid #3A3F45;display:grid;place-items:center;font-weight:900;color:#9EA4AB;background:var(--ink);position:relative;z-index:1}
.tl li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.done::before{background:var(--ok)}
.tl li.now .dot{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 6px rgba(230,58,46,.25)}
.tl b{display:block;font-size:17px;font-weight:800;margin-top:8px}
.tl small{color:#9EA4AB;font-size:14px}
.tl time{color:#9EA4AB;font-size:14px;margin-top:10px;direction:ltr}
.tcar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#202328;border-radius:12px;padding:16px 18px;margin-bottom:22px;flex-wrap:wrap}
.tcar b{font-size:18px}
.tcar span{font-size:14px;color:#9EA4AB}
.tcar .eta{color:#fff;font-weight:800;background:var(--red);padding:6px 12px;border-radius:999px;font-size:14px}
.nf{color:#FF9C94;font-weight:700}
@media (max-width:900px){.trk{grid-template-columns:minmax(0,1fr)}}

/* reminder */
.rem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:40px}
.rem label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px;margin-bottom:14px}
.rem input,.rem select{height:52px;border-radius:8px;border:2px solid var(--line);padding:0 14px;font-size:17px;background:#fff}
.gauge{position:relative;width:min(300px,100%);aspect-ratio:2/1.15;margin:0 auto}
.gauge svg{width:100%;height:100%}
.gauge .val{position:absolute;inset-inline:0;bottom:4px;text-align:center}
.gauge .val b{display:block;font-size:40px;font-weight:900;direction:ltr;line-height:1}
.gauge .val span{font-size:14px;color:var(--ink2);font-weight:700}
.rmsg{text-align:center;font-weight:800;margin-top:16px;font-size:17px}
.rmsg.warn{color:var(--red)}.rmsg.ok{color:var(--ok)}
@media (max-width:800px){.rem{grid-template-columns:minmax(0,1fr)}}

/* team + space */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.mem{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mem img{width:100%;aspect-ratio:4/4.4;object-fit:cover;object-position:50% 20%}
.mem div{padding:16px 18px}
.mem h3{font-size:20px}
.mem p{color:var(--ink2);font-size:14px}
.space{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.space img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.info div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.info h3{font-size:16px;margin-bottom:4px}
.info p{color:var(--ink2);font-size:15px}
.info a{color:var(--red2);font-weight:800;text-decoration:underline;text-underline-offset:4px}
@media (max-width:800px){.team{grid-template-columns:1fr 1fr}.team .mem:last-child{display:none}.info{grid-template-columns:1fr}.space{grid-template-columns:1fr}}
footer{background:#000;color:#9EA4AB;font-size:14px;padding:28px 0}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>

</div></header>

<main id="top">
<section class="hero">
  <img class="bg" src="img/hero.webp" alt="" fetchpriority="high">

    <p data-i="heroP"></p>

<section class="sec" id="estimate">

        <select id="drop" aria-label="drop-off"></select>
        <input id="name" data-ph="phName" autocomplete="name">
        <p class="err" id="err" role="alert"></p>
        <button class="btn b-red" type="button" id="send" data-i="eSend"></button>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="track">
  <div class="wrap">
    <h2 data-i="tH"></h2><p class="lead" style="margin-top:10px" data-i="tP"></p>
    <div class="trk">
      <div>
        <form id="tForm"><input id="code" maxlength="10" aria-label="code" placeholder="PS-0000"><button class="btn b-red" type="submit" data-i="tBtn"></button></form>
        <p class="hint"><span data-i="tHint"></span> <button type="button" id="demoCode">PS-2048</button></p>
      </div>
      <div id="tOut"></div>
    </div>
  </div>
</section>

<section class="sec" id="reminder">
  <div class="wrap">
    <h2 data-i="rH"></h2><p class="lead" style="margin-top:10px" data-i="rP"></p>
    <div class="rem">
      <div class="card">
        <label><span data-i="rLast"></span><input id="last" type="number" inputmode="numeric" value="85000" dir="ltr"></label>
        <label><span data-i="rNow"></span><input id="now" type="number" inputmode="numeric" value="91200" dir="ltr"></label>
        <label><span data-i="rOil"></span><select id="oil"></select></label>
      </div>
      <div class="card">
        <div class="gauge"><svg viewBox="0 0 200 115" aria-hidden="true"><path d="M15 105 A85 85 0 0 1 185 105" fill="none" stroke="#E4E7EA" stroke-width="18" stroke-linecap="round"/><path id="arc" d="M15 105 A85 85 0 0 1 185 105" fill="none" stroke="#1E9E5A" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
          <div class="val"><b id="kmLeft">0</b><span data-i="kmLeft"></span></div></div>
        <p class="rmsg" id="rmsg"></p>
        <div style="text-align:center;margin-top:14px"><a class="btn b-ink" href="#estimate" id="rBook" data-i="rBook"></a></div>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="team" style="padding-top:0">
  <div class="wrap"><h2 data-i="mH"></h2><div class="team" id="teamGrid"></div></div>
</section>

<section class="sec" id="visit" style="padding-top:0">
  <div class="wrap"><h2 data-i="vH"></h2>
    <div class="space"><img src="img/space1.webp" alt="" loading="lazy"><img src="img/space2.webp" alt="" loading="lazy"></div>
    <div class="info"><div><h3 data-i="iHours"></h3><p data-i="iHoursV"></p></div><div><h3 data-i="iWhere"></h3><p data-i="iWhereV"></p><a href="https://maps.google.com/?q=car+service" target="_blank" rel="noopener" data-i="map"></a></div><div><h3 data-i="iWarr"></h3><p data-i="iWarrV"></p></div></div>
  </div>
</section>
</main>
<footer><div class="wrap foot"><span data-i="foot"></span><span><span data-i="madeBy"></span> <a href="https://nafetha-web.github.io" style="text-decoration:underline;color:#fff">Nafetha</a></span></div></footer>

let lang='ar';try{const s=localStorage.getItem('pit-lang');if(s==='ar'||s==='en')lang=s}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],t=k=>T[lang][k];
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{const h=Math.floor(m/60),mm=m%60;return lang==='en'?`${((h+11)%12)+1}:${pad(mm)} ${h<12?'AM':'PM'}`:`${h}:${pad(mm)}`};
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const B={car:'sedan',svc:['oil','diag'],day:null,drop:480};
const OPEN=480,CLOSE=1080;
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=t('dir');
  $$('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(typeof v==='string')el.textContent=v});
  $$('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));
  $('#langBtn').textContent=t('lang');
  $('#badges').innerHTML=t('badges').map((b,i)=>`<div>${svg(['check','diag','shield'][i])}${b}</div>`).join('');
  $('#cars').innerHTML=Object.keys(CARS).map(k=>`<button class="car" type="button" data-c="${k}" aria-pressed="${B.car===k}">${svg('car',30)}${t('cars')[k]}</button>`).join('');
  $$('#cars .car').forEach(b=>b.onclick=()=>{B.car=b.dataset.c;render()});
  $('#svcs').innerHTML=Object.keys(SV).map(k=>`<button class="svc" type="button" data-s="${k}" aria-pressed="${B.svc.includes(k)}"><span class="ic">${svg(k==='tire'||k==='align'?k:k)}</span><span><b>${t('svc')[k]}</b><small><span class="ltr">$${Math.round(SV[k][0]*CARS[B.car])}</span> · ${SV[k][1]} ${t('min')}</small></span></button>`).join('');
  $$('#svcs .svc').forEach(b=>b.onclick=()=>{const k=b.dataset.s,i=B.svc.indexOf(k);i>-1?B.svc.splice(i,1):B.svc.push(k);render()});
  $('#oil').innerHTML=t('oils').map(([n,v],i)=>`<option value="${v}" ${i===1?'selected':''}>${n} (${v.toLocaleString('en')} km)</option>`).join('');
  $('#teamGrid').innerHTML=t('team').map(([n,r],i)=>`<article class="mem"><img src="img/tm-${i+1}.webp" alt="${n}" loading="lazy"><div><h3>${n}</h3><p>${r}</p></div></article>`).join('');
  calc();rem();if(lastCode)track(lastCode);
}
function calc(){
  const items=B.svc.map(k=>({k,p:Math.round(SV[k][0]*CARS[B.car]),m:SV[k][1]}));
  const tot=items.reduce((a,b)=>a+b.p,0),mins=items.reduce((a,b)=>a+b.m,0);
  $('#total').textContent='$'+tot;
  $('#lines').innerHTML=items.length?items.map(i=>`<li><span>${t('svc')[i.k]}</span><span class="ltr">$${i.p}</span></li>`).join(''):`<li class="empty">${t('empty')}</li>`;
  $('#time').textContent=mins?`${mins} ${t('min')}`:'—';
  // days
  const base=dayStart(new Date());let html='';
  for(let i=0;i<8;i++){const d=new Date(base);d.setDate(base.getDate()+i);const closed=d.getDay()===0||(i===0&&nowMin()>CLOSE-90);html+=`<button class="day" type="button" data-d="${i}" ${closed?'disabled':''} aria-pressed="${B.day===i}">${i===0?t('today'):i===1?t('tomorrow'):t('days')[d.getDay()]}<br>${d.getDate()}/${d.getMonth()+1}</button>`}
  $('#days').innerHTML=html;$$('#days .day').forEach(b=>b.onclick=()=>{B.day=+b.dataset.d;calc()});
  let opts='';for(let m=OPEN;m<=CLOSE-60;m+=30){const past=B.day===0&&m<=nowMin()+30;if(!past)opts+=`<option value="${m}" ${B.drop===m?'selected':''}>${t('dropL')}: ${fmt(m)}</option>`}
  $('#drop').innerHTML=opts;B.drop=+$('#drop').value||OPEN;
  let ready='—';if(mins&&B.day!==null){const end=B.drop+mins+30;ready=end<=CLOSE?fmt(Math.ceil(end/15)*15):`${t('nextDay')} ${fmt(OPEN+(end-CLOSE)+30)}`}
  $('#ready').textContent=ready;B.tot=tot;B.mins=mins;B.ready=ready;
}
$('#drop').onchange=()=>{B.drop=+$('#drop').value;calc()};
$('#send').onclick=()=>{
  if(!B.svc.length){$('#err').textContent=t('needSvc');return}
  if(B.day===null){$('#err').textContent=t('needDay');return}
  const n=$('#name').value.trim();if(!n){$('#err').textContent=t('needName');$('#name').focus();return}
  $('#err').textContent='';const d=new Date();d.setDate(d.getDate()+B.day);
  const dl=(B.day===0?t('today'):B.day===1?t('tomorrow'):t('days')[d.getDay()])+` ${d.getDate()}/${d.getMonth()+1} - ${fmt(B.drop)}`;
  const L=[t('waHead'),'',`• ${t('waCar')}: ${t('cars')[B.car]}`,`• ${t('waSvc')}: ${B.svc.map(k=>t('svc')[k]).join(' + ')}`,`• ${t('waWhen')}: ${dl}`,`• ${t('waReady')}: ${B.ready}`,`• ${t('waTot')}: $${B.tot}`,`• ${t('waName')}: ${n}`,'',t('waFoot')];
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(L.join('\n'))}`,'_blank','noopener')};
// tracker
let lastCode='';
function track(code){
  lastCode=code;code=code.trim().toUpperCase();const out=$('#tOut');
  if(code!=='PS-2048'){out.innerHTML=`<p class="nf">${t('notFound')}</p>`;return}
  const now=3,times=['9:10','9:40','10:25','',' ',''];
  out.innerHTML=`<div class="tcar"><div><b>${t('tCar')}</b><br><span class="ltr">PS-2048</span></div><span class="eta">${t('tEta')}</span></div><ol class="tl">${t('steps').map(([h,d],i)=>`<li class="${i<now?'done':i===now?'now':''}"><span class="dot">${i<now?'✓':i+1}</span><span><b>${h}</b><small>${d}</small></span><time>${i<now?times[i]:''}</time></li>`).join('')}</ol>`;
}
$('#tForm').onsubmit=e=>{e.preventDefault();track($('#code').value)};
$('#demoCode').onclick=()=>{$('#code').value='PS-2048';track('PS-2048')};
// reminder
function rem(){
  const last=+$('#last').value||0,now=+$('#now').value||0,iv=+$('#oil').value||7500;
  const used=Math.max(0,now-last),left=iv-used,pct=Math.min(100,used/iv*100);
  const arc=$('#arc');arc.setAttribute('stroke-dasharray',`${pct} 100`);arc.setAttribute('stroke',pct>=100?'#E63A2E':pct>=80?'#F2A900':'#1E9E5A');
  $('#kmLeft').textContent=(left>0?left:0).toLocaleString('en');
  const m=$('#rmsg');m.className='rmsg '+(pct>=80?'warn':'ok');m.textContent=pct>=100?t('rLate'):pct>=80?t('rSoon'):t('rOk');
}
['#last','#now','#oil'].forEach(s=>$(s).addEventListener('input',rem));
$('#rBook').onclick=()=>{if(!B.svc.includes('oil'))B.svc.push('oil');calc();render()};
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('pit-lang',lang)}catch(e){};render()};
render();
</script>
