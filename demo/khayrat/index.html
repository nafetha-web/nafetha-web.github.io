<style>
:root {
  --bg: #F5F3EC; --card: #FFFFFF; --ink: #16211A; --mute: #67716A; --line: #E4E0D5;
  --brand: #1E6B45; --brand-2: #14512F; --mint: #E5F1E9; --tomato: #E5482D; --sun: #F3B53A; --sun-soft: #FDF3DC;
  --hf: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif; --bf: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif;
  --r: 18px; --sh: 0 10px 30px -18px rgba(22,33,26,.35);
  --navh: 64px;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px }
body { margin: 0; font-family: var(--bf); background: var(--bg); color: var(--ink); line-height: 1.55; font-size: 15px; overflow-x: hidden }
img { display: block; max-width: 100% }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer; border: 0; background: none; padding: 0 }
a { color: inherit; text-decoration: none }
h1, h2, h3 { font-family: var(--hf); margin: 0; line-height: 1.25 }
.num { font-variant-numeric: tabular-nums }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px }
[hidden] { display: none !important }

.demo { background: var(--ink); color: #E9EFEA; font-size: 12.5px; text-align: center; padding: 6px 12px }
.demo a { color: var(--sun); font-weight: 600; text-decoration: underline; text-underline-offset: 2px }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: rgba(245,243,236,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line) }
.hrow { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0 }
.logo svg { flex: none }
.logo b { font-family: var(--hf); font-size: 18px; display: block; line-height: 1.1; white-space: nowrap }
.logo small { display: flex; align-items: center; gap: 6px; color: var(--mute); font-size: 12px; white-space: nowrap }
.open { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--brand); background: var(--mint); border-radius: 99px; padding: 1px 8px; font-size: 11.5px }
.open i { width: 6px; height: 6px; border-radius: 50%; background: #2DB36B }
.open.closed { color: #A33A27; background: #FBE7E2 } .open.closed i { background: var(--tomato) }
.hx { margin-inline-start: auto; display: flex; gap: 8px; align-items: center }
.ib { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px }
.ib.wa { background: #25D366; border-color: #25D366; color: #fff }
.area { display: none }
@media (min-width: 760px) { .area { display: inline-flex } }

/* layout */
.app { max-width: 1320px; margin: 0 auto; padding: 0 16px calc(var(--navh) + 30px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px }
.side, .cartp { display: none }
@media (min-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr) 360px; padding-bottom: 40px }
  .cartp { display: block; position: sticky; top: 76px; align-self: start; margin-top: 16px; max-height: calc(100vh - 92px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh) }
  .bnav { display: none !important }
}
@media (min-width: 1240px) {
  .app { grid-template-columns: 210px minmax(0, 1fr) 360px }
  .side { display: block; position: sticky; top: 76px; align-self: start; margin-top: 16px }
}
.side h3 { font-size: 13px; color: var(--mute); font-weight: 600; margin: 0 8px 8px }
.side button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 12px; text-align: start; font-weight: 500; font-size: 14px }
.side button img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover }
.side button:hover { background: var(--card) }
.side button.on { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--brand); color: var(--brand-2); font-weight: 600 }
main { min-width: 0; padding-top: 16px; display: flex; flex-direction: column; gap: 22px }

/* search */
.srch { display: flex; gap: 8px }
.sbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 0 14px; height: 50px }
.sbox:focus-within { border-color: var(--brand) }
.sbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px }
.sbox svg { color: var(--mute); flex: none }

function tick() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); let s = Math.floor((m - n) / 1000); const h = String(Math.floor(s / 3600)).padStart(2, '0'), mi = String(Math.floor(s % 3600 / 60)).padStart(2, '0'), se = String(s % 60).padStart(2, '0'); $$('[data-cd]').forEach((e) => e.textContent = '⏱ ' + h + ':' + mi + ':' + se) }

/* cart + checkout */
function slotList() {
  const now = new Date(), h = now.getHours(), out = [['asap', t('asap'), t('asapS')]];
  for (let s = Math.max(10, h + 2); s <= 20; s += 2) out.push(['t' + s, t('today'), s + ':00 – ' + (s + 2) + ':00']);
  for (let s = 10; s <= 18; s += 4) out.push(['m' + s, t('tomorrow'), s + ':00 – ' + (s + 2) + ':00']);
  return out;
}
let form = { name: '', phone: '', addr: '', notes: '' };
function cartHTML() {
  const ids = Object.keys(cart);
  if (!ids.length) return '<div class="cempty"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg>' + t('emptyCart') + '</div>';
  const items = ids.map((id) => { const p = byId[id], o = opts[id] || 'swap';
    return '<div class="ci"><img src="' + p.img + '" alt=""><div><b>' + L(p.ar, p.en) + '</b><div class="sub">' + (p.kg ? fmt(p.p) + ' ' + t('perKg') : L(p.uar, p.uen)) + '</div><label class="sub" style="display:block;margin-top:4px">' + t('ifOut') + '<br><select data-opt="' + id + '">' + ['swap', 'call', 'drop'].map((k) => '<option value="' + k + '"' + (o === k ? ' selected' : '') + '>' + t(k) + '</option>').join('') + '</select></label></div>' +
      '<div class="rt"><span class="pr num">' + fmt(lineTotal(id)) + '</span><span class="mini"><button type="button" data-dec="' + id + '">−</button><span class="num">' + qtyTxt(p, cart[id]) + '</span><button type="button" data-inc="' + id + '">+</button></span></div></div>' }).join('');
  const st = subtotal(), fe = fee();
  const sl = slotList();
  return '<div>' + items + '</div>' +
    '<div class="tot num"><div><span>' + t('sub') + '</span><span>' + fmt(st) + '</span></div><div><span>' + t('delivery') + ' (' + L(AREAS[area][0], AREAS[area][1]) + ')</span><span>' + (fe ? fmt(fe) : '<b style="color:var(--brand)">' + t('free') + '</b>') + '</span></div><div class="big"><span>' + t('total') + '</span><span>' + fmt(st + fe) + '</span></div><div class="alt">≈ ' + fmt(st + fe, cur === 'usd' ? 'lbp' : 'usd') + '</div></div>' +
    '<div class="fld"><label>' + t('where') + '</label><select class="in" data-area>' + AREAS.map((a, i) => '<option value="' + i + '"' + (i === area ? ' selected' : '') + '>' + L(a[0], a[1]) + ' · ' + t('areaFee') + ' ' + fmt(a[2]) + '</option>').join('') + '</select></div>' +
    '<div class="fld"><label>' + t('when') + '</label><div class="slots">' + sl.map((s) => '<button type="button" data-slot="' + s[0] + '" class="' + (slot === s[0] ? 'on' : '') + '">' + s[1] + '<small class="num">' + s[2] + '</small></button>').join('') + '</div></div>' +
    '<div class="two"><div class="fld"><label>' + t('nameL') + '</label><input class="in" data-f="name" value="' + esc(form.name) + '" autocomplete="name"></div><div class="fld"><label>' + t('phoneL') + '</label><input class="in" data-f="phone" value="' + esc(form.phone) + '" inputmode="tel" autocomplete="tel"></div></div>' +
    '<div class="fld"><label>' + t('addrL') + '</label><input class="in" data-f="addr" value="' + esc(form.addr) + '" placeholder="' + t('addrPh') + '" autocomplete="street-address"></div>' +
    '<div class="fld"><label>' + t('payL') + '</label><div class="pay"><button type="button" data-pay="cash" class="' + (pay === 'cash' ? 'on' : '') + '">' + t('cash') + '</button><button type="button" data-pay="whish" class="' + (pay === 'whish' ? 'on' : '') + '">' + t('whish') + '</button></div></div>' +
    '<div class="fld"><label>' + t('notesL') + '</label><input class="in" data-f="notes" value="' + esc(form.notes) + '" placeholder="' + t('notesPh') + '"></div>' +
    (missNotes.length ? '<div class="miss">' + t('miss') + missNotes.join('، ') + t('missNote') + '</div>' : '') +
    '<button class="send" type="button" data-send><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>' + t('send') + '</button><p class="note">' + L('ما بيوصل شي قبل ما تكبس إرسال جوّا الواتساب.', 'Nothing is sent until you press send inside WhatsApp.') + '</p>';
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderCart() {
  const head = '<h3>' + t('cart') + ' <span class="count num">' + count() + ' ' + t('items') + '</span></h3>';
  const html = cartHTML();
  const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f;
  $('#cartp').innerHTML = '<div class="cart">' + head + html + '</div>';
  $('#cartSB').innerHTML = '<div class="cart" style="padding:0">' + html + '</div>';
  if (keep) { const el = (window.innerWidth >= 1000 ? $('#cartp') : $('#cartSB')).querySelector('[data-f="' + keep + '"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length) } }
}

function sendOrder() {
  if (!form.name.trim() || !form.addr.trim()) { toast(t('fill')); const el = document.querySelector((window.innerWidth >= 1000 ? '#cartp' : '#cartSB') + ' [data-f="' + (!form.name.trim() ? 'name' : 'addr') + '"]'); el && el.focus(); return }
  const sl = slotList().find((s) => s[0] === slot) || slotList()[0];
  const lines = Object.keys(cart).map((id) => { const p = byId[id]; return '• ' + L(p.ar, p.en) + ' × ' + qtyTxt(p, cart[id]) + ' = ' + fmt(lineTotal(id), 'usd') + ' (' + t('ifOut') + ' ' + t(opts[id] || 'swap') + ')' });
  const st = subtotal(), fe = fee();
  const msg = [L('طلب جديد من موقع خيرات ماركت', 'New order from Khayrat Market website'), '',
    ...lines, '',
    t('sub') + ': ' + fmt(st, 'usd'), t('delivery') + ': ' + (fe ? fmt(fe, 'usd') : t('free')), t('total') + ': ' + fmt(st + fe, 'usd') + ' (≈ ' + fmt(st + fe, 'lbp') + ')', '',
    t('nameL') + ': ' + form.name, form.phone ? t('phoneL') + ': ' + form.phone : null, t('where') + ': ' + L(AREAS[area][0], AREAS[area][1]) + ' - ' + form.addr,
    t('when') + ': ' + sl[1] + ' ' + sl[2], L('الدفع', 'Payment') + ': ' + t(pay), form.notes ? t('notesL') + ': ' + form.notes : null,
    missNotes.length ? L('أغراض ما لقيناها بالموقع: ', 'Items not found on the site: ') + missNotes.join('، ') : null].filter((x) => x !== null).join('\n');
  try { localStorage.setItem('kh_last', JSON.stringify({ cart, total: st, d: Date.now() })) } catch (e) {}
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
  toast(t('sent'));
}
function renderReo() {
  let last = null; try { last = JSON.parse(localStorage.getItem('kh_last') || 'null') } catch (e) {}
  const el = $('#reo'); if (!last || !last.cart || !Object.keys(last.cart).length) { el.hidden = true; return }
  const n = Object.keys(last.cart).filter((id) => byId[id]).length; el.hidden = false;
  el.innerHTML = '<span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></span><div><b>' + t('reoT') + '</b><small class="num">' + n + ' ' + t('items') + ' · ' + fmt(last.total) + '</small></div><button type="button" data-reo>' + t('reoBtn') + '</button>';
}

/* paste list */
const NUMW = { 'نص': .5, 'نصف': .5, 'ربع': .5, 'كيلوين': 2, 'حبتين': 2, 'علبتين': 2, 'ربطتين': 2, 'كيسين': 2, 'قنينتين': 2, 'تنين': 2, 'اتنين': 2, 'ثلاث': 3, 'تلات': 3, 'تلاته': 3, 'اربع': 4, 'اربعه': 4, 'خمس': 5, 'خمسه': 5 };
function parseList(txt) {
  const parts = txt.split(/\n|،|,|;|\s+و\s+|\s+(?=و[^\sاي])/).map((s) => s.trim()).filter(Boolean);
  const found = [], miss = [];
  parts.forEach((raw) => {
    let s = norm(raw).replace(/^[-•*]+\s*/, '').replace(/^\d+[.)]\s+/, '').replace(/^و(?=\S{3,})/, '');
    let qn = null; const m = s.match(/(\d+(?:\.\d+)?)/); if (m) { qn = parseFloat(m[1]); s = s.replace(m[1], ' ') }
    Object.keys(NUMW).forEach((w) => { const re = new RegExp('(^|\\s)' + norm(w) + '(?=\\s|$)'); if (re.test(s)) { qn = qn ? qn * NUMW[w] : NUMW[w]; s = s.replace(re, ' ') } });
    s = s.replace(/(كيلو|كغ|kg|غرام|حبه|حبات|علبه|علب|ربطه|كيس|قنينه|قناني|ليتر|x|×)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return;
    let best = null, bs = 0;
    P.forEach((p) => { const keys = norm(p.ar + ' ' + p.en + ' ' + p.kw).split(/\s+/).filter((k) => k.length > 1);
      s.split(' ').forEach((w) => { if (w.length < 2) return; keys.forEach((k) => { let sc = 0; if (k === w) sc = 10 + k.length; else if (k.startsWith(w) || w.startsWith(k)) sc = 5 + Math.min(k.length, w.length); else if (k.includes(w) && w.length > 3) sc = 3; if (sc > bs) { bs = sc; best = p } }) }) });
    if (best && bs >= 7) { let qq = qn || (best.kg ? 1 : 1); if (best.kg) qq = Math.max(.5, Math.round(qq * 2) / 2); else qq = Math.max(1, Math.round(qq)); const ex = found.find((f) => f.p.id === best.id); if (ex) ex.q += qq; else found.push({ p: best, q: qq, raw }) }
    else miss.push(raw);
  });
  return { found, miss };
}
let lastParse = null;
function runList() {
  const r = parseList($('#lstT').value); lastParse = r;
  $('#lres').innerHTML = (r.found.length ? '<b style="font-size:14px">' + t('found') + '</b>' + r.found.map((f, i) => '<label class="lr"><input type="checkbox" checked data-li="' + i + '"><img src="' + f.p.img + '" alt=""><div><b>' + L(f.p.ar, f.p.en) + '</b><small>«' + esc(f.raw) + '»</small></div><span class="mini"><button type="button" data-lq="' + i + '" data-d="-1">−</button><span class="num" id="lq' + i + '">' + qtyTxt(f.p, f.q) + '</span><button type="button" data-lq="' + i + '" data-d="1">+</button></span></label>').join('') : '') +
    (r.miss.length ? '<div class="miss">' + t('miss') + r.miss.map(esc).join('، ') + t('missNote') + '</div>' : '') +
    (r.found.length || r.miss.length ? '<button class="pbtn" type="button" data-ladd>' + t('addSel') + '</button>' : '');
}

/* sheets */
function openS(id) { $('#ov').classList.add('on'); $(id).classList.add('on'); document.body.style.overflow = 'hidden' }
function closeS() { $('#ov').classList.remove('on'); $$('.sheet').forEach((s) => s.classList.remove('on')); document.body.style.overflow = '' }
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2200) }

/* events */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a'); if (!b) { if (e.target.id === 'ov') closeS(); return }
  if (b.dataset.inc) { const had = cart[b.dataset.inc]; addP(b.dataset.inc); if (!had) toast(t('added')); return }
  if (b.dataset.dec) { const p = byId[b.dataset.dec]; setQty(p.id, cart[p.id] - step(p)); return }
  if (b.dataset.cat) { e.preventDefault(); catF = b.dataset.cat; q = ''; $('#q').value = ''; refresh(); document.getElementById('all').scrollIntoView({ behavior: 'smooth' }); return }
  if (b.dataset.slot) { slot = b.dataset.slot; renderCart(); return }
  if (b.dataset.pay) { pay = b.dataset.pay; renderCart(); return }
  if ('send' in b.dataset) { sendOrder(); return }
  if ('reo' in b.dataset) { let last = null; try { last = JSON.parse(localStorage.getItem('kh_last')) } catch (x) {} if (last) { Object.entries(last.cart).forEach(([id, v]) => { if (byId[id]) cart[id] = v }); save(); refresh(); toast(T.addedN(Object.keys(last.cart).length)[lang === 'ar' ? 0 : 1]); if (window.innerWidth < 1000) openS('#cartS') } return }
  if ('close' in b.dataset) { closeS(); return }
  if (b.dataset.go) { $$('#bnav button').forEach((x) => x.classList.toggle('on', x === b)); const g = b.dataset.go;
    if (g === 'top') window.scrollTo({ top: 0, behavior: 'smooth' }); else if (g === 'all') document.getElementById('all').scrollIntoView({ behavior: 'smooth' }); else if (g === 'list') { openS('#listS'); setTimeout(() => $('#lstT').focus(), 300) } else openS('#cartS'); return }
  if (b.parentNode && b.parentNode.id === 'ex') { const ta = $('#lstT'); ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + b.textContent; return }
  if (b.dataset.lq) { const f = lastParse.found[+b.dataset.lq], st = f.p.kg ? .5 : 1; f.q = Math.max(st, f.q + st * +b.dataset.d); $('#lq' + b.dataset.lq).textContent = qtyTxt(f.p, f.q); e.preventDefault(); return }
  if ('ladd' in b.dataset) { let n = 0; lastParse.found.forEach((f, i) => { const cb = document.querySelector('[data-li="' + i + '"]'); if (cb && cb.checked) { cart[f.p.id] = (cart[f.p.id] || 0) + f.q; n++ } }); missNotes = [...new Set([...missNotes, ...lastParse.miss])]; save(); refresh(); closeS(); toast(T.addedN(n)[lang === 'ar' ? 0 : 1]); setTimeout(() => { if (window.innerWidth < 1000) openS('#cartS') }, 400); return }
  if (b.id === 'listBtn') { openS('#listS'); setTimeout(() => $('#lstT').focus(), 300); return }
  if (b.id === 'lstGo') { runList(); return }
  if (b.id === 'areaBtn') { $('#areaSB').innerHTML = '<div style="display:grid;gap:8px">' + AREAS.map((a, i) => '<button type="button" class="in" style="text-align:start;display:flex;justify-content:space-between" data-ar="' + i + '"><span>' + L(a[0], a[1]) + '</span><span class="num" style="color:var(--mute)">' + fmt(a[2]) + '</span></button>').join('') + '</div>'; openS('#areaS'); return }
  if (b.dataset.ar) { area = +b.dataset.ar; save(); refresh(); closeS(); return }
  if (b.id === 'langBtn') { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('kh_lang', lang) } catch (x) {} renderStatic(); refresh(); return }
  if (b.id === 'curBtn') { cur = cur === 'usd' ? 'lbp' : 'usd'; try { localStorage.setItem('kh_cur', cur) } catch (x) {} renderStatic(); refresh(); return }
});
$('#ov').addEventListener('click', closeS);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeS() });
document.addEventListener('input', (e) => { const el = e.target;
  if (el.id === 'q') { q = el.value; if (q) catF = 'all'; clearTimeout(el._t); el._t = setTimeout(() => { refresh(); if (q.trim()) document.getElementById('all').scrollIntoView({ behavior: 'smooth' }) }, 220) }
  if (el.dataset.f) form[el.dataset.f] = el.value;
});
document.addEventListener('change', (e) => { const el = e.target;
  if (el.dataset.opt) { opts[el.dataset.opt] = el.value; renderCart() }
  if ('area' in el.dataset) { area = +el.value; save(); refresh() }
});
renderStatic(); refresh();
