:root{--bg:#14100d;--bg2:#1c1612;--card:#231b16;--line:#33271f;--or:#ff8a00;--or2:#ffb347;--gr:#6fcf4a;--tx:#fff6ee;--mu:#b9a493}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding-bottom:110px;-webkit-font-smoothing:antialiased}
.ltr{direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hero{position:relative;text-align:center;padding:20px 18px 26px;background:radial-gradient(90% 70% at 50% 0,#4a2a12 0,transparent 72%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,138,0,.035) 22px 44px)}
.lang{position:absolute;top:14px;inset-inline-start:14px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px}

.hero h1{font-family:Lalezar,Cairo;font-weight:400;font-size:27px;margin-top:6px;letter-spacing:.2px}
.hero p{color:var(--mu);font-size:14px;margin-top:2px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--tx);text-decoration:none}

nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;gap:6px;color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);transition:.2s}
nav a.on{background:var(--or);color:#1b1006;border-color:var(--or)}
main{max-width:680px;margin:0 auto;padding:0 14px}
section{padding-top:26px;scroll-margin-top:60px}
h2{font-family:Lalezar,Cairo;font-weight:400;font-size:26px;color:var(--or2);margin-bottom:14px;display:flex;align-items:center;gap:10px}
h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
[dir=ltr] h2:after{background:linear-gradient(270deg,var(--line),transparent)}
.it{display:flex;gap:14px;align-items:stretch;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:11px}
.em{flex:none;width:68px;border-radius:14px;background:radial-gradient(circle at 30% 25%,#5a3414,#2a1a0e);display:grid;place-items:center;font-size:34px;border:1px solid #4a3020}
.bd{flex:1;min-width:0;display:flex;flex-direction:column}

.pr{font-weight:800;color:var(--gr);font-size:16.5px}
.pr i{font-style:normal;font-size:11.5px;color:var(--mu);font-weight:600;margin-inline-start:4px}
.add{background:var(--or);color:#1b1006;font-weight:800;border-radius:12px;padding:8px 18px;font-size:14.5px;box-shadow:0 4px 14px rgba(255,138,0,.28)}

.st{display:inline-flex;align-items:center;background:#2c2018;border:1px solid var(--or);border-radius:12px;overflow:hidden}
.st button{width:36px;height:34px;font-size:20px;font-weight:800;color:var(--or2)}
.st span{min-width:24px;text-align:center;font-weight:800}
footer{text-align:center;color:var(--mu);font-size:13px;padding:34px 16px 20px;line-height:1.9}

.bar{position:fixed;inset-inline:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:656px;margin:auto;z-index:30;background:var(--or);color:#1b1006;border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16.5px;box-shadow:0 10px 30px rgba(0,0,0,.55);transform:translateY(140%);transition:.3s}
.bar.on{transform:none}
.bar .n{background:#1b1006;color:var(--or2);border-radius:99px;min-width:28px;height:28px;display:inline-grid;place-items:center;font-size:14px;margin-inline-end:10px;padding:0 8px}
dialog{border:0;background:var(--bg2);color:var(--tx);width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;padding:0;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sh{padding:18px 18px 22px;overflow:auto;max-height:92vh}
.sh h3{font-family:Lalezar,Cairo;font-weight:400;font-size:24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:18px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.rl b{font-weight:700}
.rl span{color:var(--mu);white-space:nowrap}
label{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px;color:var(--or2)}
select,textarea,input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:inherit;font-size:15px}
textarea{resize:none;height:64px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:16px;padding-top:12px;font-weight:700}
.tot strong{font-size:23px;color:var(--gr)}
.send{display:block;text-align:center;text-decoration:none;background:#25d366;color:#052e16;font-weight:800;font-size:17px;padding:15px;border-radius:16px;margin-top:14px}
.loc{display:block;width:100%;margin-top:10px;background:var(--card);border:1px solid var(--or);color:var(--or2);font-weight:800;border-radius:12px;padding:11px}
.ls{font-size:12.5px;color:var(--mu);text-align:center;margin-top:6px;min-height:16px}
.back{display:block;width:100%;text-align:center;padding:12px;color:var(--mu);font-weight:700}
.note{color:var(--mu);font-size:12.5px;text-align:center;margin-top:6px}

const T={ar:{addr:'حي السلّم · حدّ مدرسة الغزالة، قبالة صيدلية بازي',del:'🛵 توصيل واستلام',add:'أضف',cart:'شوف الطلب',cur:'ل.ل',rTitle:'طلبك',lWhere:'كيف بدك تستلم؟',where:['توصيل','استلام من المطعم'],lAddr:'العنوان (للتوصيل)',lNote:'ملاحظة (اختياري)',lTot:'المجموع',loc:'📍 شارك موقعي',locOk:'✅ تم تحديد موقعك',locBad:'ما قدرنا نحدد موقعك، اكتب العنوان',locWait:'عم نحدد موقعك…',lc:'الموقع',send:'ابعت الطلب عالواتساب',back:'أضف المزيد',nt:'رسوم التوصيل بتتحدد عالواتساب',foot:'للطلب والاستفسار',hello:'مرحبا سناك قدوح 👋 بدي اطلب:',fs:'📲 طلب من الموقع',w:'الاستلام',a:'العنوان',n:'ملاحظة',tot:'المجموع',lang:'EN'},
