<style>
:root {
  --y: #FBCE00;
  --y2: #FFE45C;
  --red: #E21F26;
  --red-d: #B5121A;
  --ink: #1A1410;
  --paper: #FFFDF5;
  --muted: #6B6052;
  --line: #EFE6CC;
  --wa: #1F9D55;
  --display: 'Lalezar', 'Cairo', sans-serif;
  --body: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  --latin: 'Luckiest Guy', 'Lalezar', sans-serif;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6 }
a { color: inherit }
img { display: block; max-width: 100% }
button, input, select, textarea { font-family: inherit; font-size: 16px }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
.ltr { direction: ltr; unicode-bidi: isolate }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px }

.demo { background: var(--ink); color: #FFF; font-size: 13px; text-align: center; padding: 7px 16px; line-height: 1.5 }
.demo a { color: var(--y); font-weight: 700 }

.top { position: sticky; top: 0; z-index: 20; background: var(--y); border-bottom: 3px solid var(--ink) }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; direction: ltr }
.logo .badge { width: 42px; height: 42px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 20px }
.logo b { font-family: var(--latin); font-weight: 400; font-size: 27px; line-height: .95; color: var(--red); text-shadow: 2px 2px 0 var(--ink); letter-spacing: .02em }
.logo b span { display: block; font-size: 17px; color: var(--ink); text-shadow: none }
.nav { display: flex; gap: 6px 16px; align-items: center; font-weight: 700 }
.nav a { text-decoration: none }
@media (max-width: 560px) { .nav a { display: none } }
.lang { background: var(--ink); color: var(--y); border: 0; border-radius: 999px; padding: 0 16px; min-height: 40px; font-weight: 700; cursor: pointer }

.hero { background: var(--y); position: relative; overflow: hidden; border-bottom: 3px solid var(--ink) }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 110%, rgba(255,255,255,.18) 0 6deg, transparent 6deg 14deg); pointer-events: none }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; padding-block: 34px 40px }
@media (max-width: 760px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 22px 30px; gap: 6px } }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--y); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 700; width: fit-content }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 12vw, 80px); line-height: 1.15; margin-top: 12px }
.hero h1 em { font-style: normal; color: var(--red); -webkit-text-stroke: 1px var(--ink) }
.hero p { margin: 10px 0 0; font-size: 18px; font-weight: 600; max-width: 30em }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; font-weight: 800; font-size: 17px; text-decoration: none; border: 3px solid var(--ink); cursor: pointer; white-space: nowrap; box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink) }
.btn-red { background: var(--red); color: #FFF }
.btn-white { background: #FFF; color: var(--ink) }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14.5px; font-weight: 700; margin-top: 16px }
.plate { position: relative; justify-self: center; width: min(100%, 460px) }
.plate img { width: 100%; height: auto; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); transition: opacity .5s, transform .5s }
.plate .tag { position: absolute; bottom: 8%; inset-inline-start: 4%; background: #FFF; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-4deg) }
.plate .tag b { color: var(--red) }
@media (prefers-reduced-motion: no-preference) { .plate img.swap { opacity: 0; transform: scale(.92) rotate(-6deg) } }

section.block { padding-block: 40px 6px; display: flex; flex-direction: column; gap: 14px }
.block h2 { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.25 }
.eyebrow { font-weight: 800; color: var(--red); font-size: 14px; margin: 0 }

/* game */
.game { background: var(--red); color: #FFF; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); padding: 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; position: relative; overflow: hidden }
@media (max-width: 760px) { .game { grid-template-columns: minmax(0, 1fr) } .reel { order: -1; height: 170px } }
.game h2 { color: var(--y); -webkit-text-stroke: 1px var(--ink) }
.game p { margin: 6px 0 0; font-weight: 600 }
.reel { position: relative; height: 210px; background: var(--y); border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: inset 0 0 0 6px rgba(255,255,255,.35) }
.reel::before, .reel::after { content: ""; position: absolute; inset-inline: 0; height: 36px; z-index: 2; pointer-events: none }
.reel::before { top: 0; background: linear-gradient(var(--y), transparent) }
.reel::after { bottom: 0; background: linear-gradient(transparent, var(--y)) }
.strip { position: absolute; inset-inline: 0; top: 0; will-change: transform }
.cell { height: var(--cell, 204px); display: grid; place-items: center; padding: 10px }
.cell img { max-height: 150px; width: auto }
.cell .pz { font-family: var(--display); font-size: 34px; color: var(--ink); text-align: center; line-height: 1.2 }
.cell .pz small { display: block; font-family: var(--body); font-size: 15px; font-weight: 700; color: var(--red) }
.marker { position: absolute; top: 50%; inset-inline: -2px; height: 0; z-index: 3 }
.marker::before, .marker::after { content: ""; position: absolute; top: -12px; border: 12px solid transparent }
.marker::before { left: 0; border-left-color: var(--ink) }
.marker::after { right: 0; border-right-color: var(--ink) }
.gbtns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px }
.gbtns .btn { width: 100% }
.btn-y { background: var(--y); color: var(--ink) }
.win { display: none; background: #FFF; color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; font-weight: 700 }
.win.on { display: block; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) }
.win b { color: var(--red); font-size: 20px }
.win code { background: var(--y); border-radius: 6px; padding: 1px 8px; font-family: ui-monospace, monospace; font-weight: 800 }
.gnote { font-size: 12.5px; opacity: .85; margin-top: 8px !important }
@keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }

/* menu */
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 65px; z-index: 10; background: var(--paper); padding-block: 10px; margin-inline: -16px; padding-inline: 16px }
.tabs::-webkit-scrollbar { display: none }
.tab { flex: none; border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); border-radius: 999px; padding: 0 16px; min-height: 42px; font-weight: 800; cursor: pointer }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--y) }
.cat { scroll-margin-top: 130px; padding-top: 6px }
.cat h3 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 6px 0 10px }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 760px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.dish { display: flex; flex-direction: column; background: #FFF; border: 2.5px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: 4px 4px 0 var(--ink); min-width: 0 }
.dish .ph { position: relative; background: var(--y); aspect-ratio: 602 / 440; overflow: hidden; border-bottom: 2.5px solid var(--ink) }
.dish .ph img { width: 100%; height: 100%; object-fit: cover }
.dish .ph.empty { display: grid; place-items: center; font-size: 46px; aspect-ratio: auto; height: 96px }
.dish .tag { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--red); color: #FFF; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 10px; border: 2px solid var(--ink) }
.dish .body { flex: 1; padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 2px }
.dish h4 { margin: 0; font-size: 15.5px; font-weight: 800; line-height: 1.35 }
.dish p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.dish .row { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px }
.price { font-weight: 800; color: var(--red); font-size: 16px; white-space: nowrap }
.qty { display: flex; align-items: center; gap: 5px }
.qbtn { width: 36px; height: 36px; border-radius: 11px; border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); font-size: 19px; font-weight: 800; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0 }
.qbtn.add { background: var(--y) }
.qn { min-width: 16px; text-align: center; font-weight: 800 }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0 }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px }
.card { background: var(--y); border: 2.5px solid var(--ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 4px 4px 0 var(--ink) }
.card b { font-family: var(--display); font-weight: 400; font-size: 22px }
.card a { font-weight: 800 }
.foot { color: var(--muted); font-size: 13px; text-align: center; padding-block: 30px 130px }
.foot a { color: var(--red); font-weight: 800 }

.order { position: fixed; inset-inline: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #FFF; z-index: 30 }
.order .wrap { padding-inline: 0; display: flex; align-items: center; gap: 12px }
.order .sum { flex: 1; min-width: 0; font-size: 14px; opacity: .85 }
.order .sum strong { display: block; font-size: 19px; color: var(--y) }
.order .prize { color: var(--y); font-weight: 700; font-size: 12.5px; display: block }
.wa { background: var(--wa); color: #FFF; border-color: #FFF; box-shadow: none }
.wa[aria-disabled="true"] { opacity: .45; pointer-events: none }
.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88vh; border-radius: 24px 24px 0 0; background: var(--paper); color: var(--ink) }
.sheet::backdrop { background: rgba(0,0,0,.5) }
.sheet-in { padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px }
.sheet-head { display: flex; justify-content: space-between; align-items: center }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 30px }
.x { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFF; font-size: 22px; cursor: pointer }
.revlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 36vh }
.rev { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #FFF; border-radius: 14px; padding: 8px }
.rev .ph { width: 54px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--y); flex: none }
.rev .ph img { width: 100%; height: 100%; object-fit: cover }
.rev .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.4 }
.rev .nm small { display: block; color: var(--red); font-weight: 800 }
.revprize { background: var(--y); border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px }
.revtotal { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--line); padding-top: 10px }
.revtotal strong { font-size: 22px }
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 14px; font-weight: 800 }
.field input, .field select, .field textarea { border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100% }
.back { background: #FFF; color: var(--ink) }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
.was { color: var(--muted); font-weight: 600; font-size: 13px; text-decoration: line-through; margin-inline-end: 4px }
.soldout { background: #EEE; color: #777; font-weight: 800; border-radius: 999px; padding: 4px 14px; font-size: 13px }
.dish.out { opacity: .6 }
.dish.out .ph img { filter: grayscale(1) }
[hidden] { display: none !important }
/* preview additions */
.demo { background: var(--red); font-weight: 700 }
.search { position: relative }
.search input { width: 100%; border: 2.5px solid var(--ink); border-radius: 14px; padding: 12px 44px 12px 14px; background: #FFF; min-height: 50px; font-weight: 600; box-shadow: 3px 3px 0 var(--ink) }
[dir="ltr"] .search input { padding: 12px 14px 12px 44px }
.search svg { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 14px; width: 20px; height: 20px; pointer-events: none }
.search input { padding-inline-start: 44px !important; padding-inline-end: 14px !important }
.tab small { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 999px; background: var(--y); color: var(--ink); font-size: 12px; margin-inline-start: 6px; padding: 0 6px }
.tab[aria-pressed="true"] small { background: var(--y); color: var(--ink) }
.dish { cursor: pointer; transition: transform .12s }
.dish:active { transform: scale(.985) }
.dish .ph.empty { aspect-ratio: 602 / 440; height: auto; font-size: 54px; background: repeating-linear-gradient(135deg, var(--y) 0 18px, var(--y2) 18px 36px) }
.dish .ph.empty span { width: 84px; height: 84px; border-radius: 50%; background: #FFF; border: 2.5px solid var(--ink); display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink) }
.empty-q { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px 0; font-weight: 700 }
.open-now { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: #FFF; border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 14px; box-shadow: 3px 3px 0 var(--ink) }
.open-now i { width: 10px; height: 10px; border-radius: 50%; background: #1F9D55; box-shadow: 0 0 0 3px rgba(31,157,85,.25) }
.open-now.closed i { background: var(--red); box-shadow: 0 0 0 3px rgba(226,31,38,.25) }
.closed-note { background: #FFF1F1; border: 2px solid var(--red); color: var(--red-d); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px }
.again { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #FFF; border-radius: 18px; padding: 12px 14px; margin-bottom: 4px; box-shadow: 4px 4px 0 var(--red) }
.again div { flex: 1; min-width: 0 }
.again b { display: block; color: var(--y); font-size: 15px }
.again small { display: block; opacity: .85; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.again .btn { min-height: 42px; padding: 0 14px; font-size: 15px; box-shadow: 2px 2px 0 #FFF; border-color: #FFF }
.locbtn { background: #FFF; border: 2.5px dashed var(--ink); border-radius: 12px; min-height: 46px; font-weight: 800; cursor: pointer }
.locbtn.ok { border-style: solid; background: #E9F8EF; color: #157A41 }
.dsheet .dimg { border: 2.5px solid var(--ink); border-radius: 18px; overflow: hidden; background: #FFF; display: grid; place-items: center; font-size: 70px; min-height: 160px }
.dsheet .dimg img { width: 100%; height: auto; max-height: 62vh; object-fit: contain }
.dsheet .dimg span { padding: 30px }
.dsheet { max-height: 94vh }
.dsheet h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.25 }
.dsheet p { margin: 0; color: var(--muted); font-weight: 600 }
.dsheet .drow { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 2px dashed var(--line); padding-top: 12px }
.dsheet .price { font-size: 22px }
.dsheet .qbtn { width: 46px; height: 46px; font-size: 22px }
.dsheet .qn { font-size: 20px; min-width: 26px }

/* ===== Theme 1: warm cream ===== */
html[data-t="1"] { --paper: #FFF9F0; --line: #EFE5D3; --muted: #7A6E62 }
html[data-t="1"] body { background: var(--paper) }
html[data-t="1"] .top { background: #FFF; border-bottom: 1px solid var(--line); box-shadow: 0 2px 14px rgba(40,25,0,.06) }
html[data-t="1"] .lang { background: var(--paper); color: var(--ink); border: 1px solid var(--line) }
html[data-t="1"] .hero { background: linear-gradient(180deg, #FFF1BF 0%, #FFF6DD 55%, var(--paper) 100%); border-bottom: 0 }
html[data-t="1"] .hero::before { display: none }
html[data-t="1"] .hero h1 em { -webkit-text-stroke: 0 }
html[data-t="1"] .pill { background: #FFF; color: var(--ink); box-shadow: 0 3px 12px rgba(40,25,0,.08) }
html[data-t="1"] .btn { border: 0; box-shadow: 0 8px 20px rgba(226,31,38,.22); border-radius: 14px }
html[data-t="1"] .btn:active { transform: scale(.98); box-shadow: 0 4px 10px rgba(226,31,38,.2) }
html[data-t="1"] .btn-white, html[data-t="1"] .back { box-shadow: 0 4px 14px rgba(40,25,0,.08); border: 1px solid var(--line) }
html[data-t="1"] .plate img { border: 0; border-radius: 26px; box-shadow: 0 20px 44px rgba(40,25,0,.18) }
html[data-t="1"] .plate .tag { border: 0; box-shadow: 0 8px 20px rgba(40,25,0,.14); transform: none; border-radius: 12px }
html[data-t="1"] .open-now { border: 0; box-shadow: 0 3px 12px rgba(40,25,0,.08) }
html[data-t="1"] .search input { border: 1px solid var(--line); box-shadow: 0 3px 12px rgba(40,25,0,.05) }
html[data-t="1"] .tabs { background: var(--paper) }
html[data-t="1"] .tab { border: 1px solid var(--line); background: #FFF; font-weight: 700 }
html[data-t="1"] .tab[aria-pressed="true"] { background: var(--ink); color: #FFF; border-color: var(--ink) }
html[data-t="1"] .tab small { background: #F5EEE2 }
html[data-t="1"] .tab[aria-pressed="true"] small { background: var(--y); color: var(--ink) }
html[data-t="1"] .cat h3 { font-size: 26px }
html[data-t="1"] .list { grid-template-columns: minmax(0, 1fr); gap: 10px }
@media (min-width: 760px) { html[data-t="1"] .list { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
html[data-t="1"] .dish { flex-direction: row; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 4px 16px rgba(40,25,0,.05); align-items: stretch }
html[data-t="1"] .dish .ph { flex: none; width: 124px; height: 124px; aspect-ratio: auto; margin: 10px; border: 0; border-radius: 14px; background: #FFF4D2 }
html[data-t="1"] .dish .ph.empty { font-size: 34px; background: #FFF4D2 }
html[data-t="1"] .dish .ph.empty span { width: 62px; height: 62px; border: 0; box-shadow: 0 4px 12px rgba(40,25,0,.1) }
html[data-t="1"] .dish .tag { border: 0; top: 6px; inset-inline-start: 6px; font-size: 10.5px }
html[data-t="1"] .dish .body { padding: 12px 12px 12px 4px; gap: 3px }
html[dir="ltr"][data-t="1"] .dish .body { padding: 12px 4px 12px 12px }
html[data-t="1"] .dish h4 { font-size: 16px }
html[data-t="1"] .dish p { font-size: 13px }
html[data-t="1"] .qbtn { border: 0; background: #F5EEE2; border-radius: 12px }
html[data-t="1"] .qbtn.add { background: var(--y); box-shadow: 0 4px 10px rgba(251,206,0,.35) }
html[data-t="1"] .card { background: #FFF; border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(40,25,0,.05) }

/* ---- live settings from the owner's control panel (falls back to the built-in menu) ---- */
const mix = (h, t, a) => { const n = (x) => parseInt(h.slice(x, x + 2), 16), m = (x) => Math.round(n(x) + (t - n(x)) * a); return '#' + [1, 3, 5].map(x => m(x).toString(16).padStart(2, '0')).join('') };
let curUpdated = null;
function applyCfg(c) {
  const rs = document.documentElement.style, k = c.colors, now = Date.now();
  rs.setProperty('--y', k.y); rs.setProperty('--y2', mix(k.y, 255, .35)); rs.setProperty('--red', k.red); rs.setProperty('--red-d', mix(k.red, 0, .25)); if (!document.documentElement.dataset.t) { rs.setProperty('--ink', k.ink); rs.setProperty('--paper', k.paper) }
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = document.documentElement.dataset.t === '2' ? '#12100E' : k.y;
  MENU.length = 0;
  c.menu.filter(g => !g.hid).forEach(g => { const items = g.items.filter(i => !i.hid).map(i => { const o = Object.assign({}, i); if (o.off != null && (!o.until || o.until > now)) { o.old = o.p; o.p = o.off } return o }); if (items.length) MENU.push({ id: g.id, ar: g.ar, en: g.en, items }) });
  ALL.length = 0; MENU.forEach(g => g.items.forEach(i => ALL.push(i)));
  if (!MENU.some(g => g.id === activeCat)) activeCat = MENU.length ? MENU[0].id : '';
  if (!c.game.on) { T.ar.heroText = 'اختار طبقك من المنيو، راجع طلبك، وابعتو عالواتساب بكبسة.'; T.en.heroText = 'Pick your dish, review your order and send it on WhatsApp in one tap.' }
  PRIZES.length = 0; if (c.game.on) c.game.prizes.forEach(p => PRIZES.push({ em: p.em, ar: p.ar, en: p.en, s: { ar: p.sa, en: p.se } })); N = PRIZES.length;
  ['play', 'navPlay', 'ctaPlay'].forEach(id => { const e = $(id) || document.getElementById(id); if (e) e.hidden = !N });
  if (c.brand.wa) WA = c.brand.wa;
  const b = c.brand; CUR = b.cur === 'LBP' ? 'LBP' : 'USD';
  T.ar.priceNote = CUR === 'LBP' ? 'الأسعار بالليرة اللبنانية.' : 'الأسعار بالدولار.'; T.en.priceNote = CUR === 'LBP' ? 'Prices are in Lebanese pounds (LBP).' : 'Prices are in US dollars.';
  T.ar.hello = 'مرحبا ' + b.ar + ' 👋 بدي اطلب:'; T.en.hello = 'Hi ' + b.en + ' 👋 I would like to order:';
  T.ar.foot = '© 2026 ' + b.ar + ' · موقع من تصميم <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">نافذة</a>';
  T.en.foot = '© 2026 ' + b.en + ' · Website by <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">Nafetha</a>';
  T.ar.demo = 'نموذج مقترح من <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">نافذة</a> لموقع ' + b.ar + '، وليس الموقع الرسمي.';
  T.en.demo = 'A proposed site for ' + b.en + ' by <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">Nafetha</a>, not the official site.';
  if (b.addr.ar) T.ar.addr = b.addr.ar; if (b.addr.en) T.en.addr = b.addr.en;
  { const h = b.hrs || {}; T.ar.hrs = h.ar || ''; T.en.hrs = h.en || h.ar || '' }
  if (b.del.ar) T.ar.del = b.del.ar; if (b.del.en) T.en.del = b.del.en;
  T.ar.mapQ = b.ar + ' ' + (b.addr.ar || ''); T.en.mapQ = b.en + ' ' + (b.addr.en || '');
  const w = b.en.split(' '), lg = document.querySelector('.logo b'); if (lg) lg.innerHTML = w[0].toUpperCase() + (w.length > 1 ? '<span>' + w.slice(1).join(' ').toUpperCase() + '</span>' : '');
  const lk = document.querySelector('.logo'); if (lk) lk.setAttribute('aria-label', b.en);
  document.title = b.en + ' | ' + b.ar;
  Object.keys(cart).forEach(k => { if (!ALL.some(i => i.id === k)) delete cart[k] });
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function fetchCfg() { try { const c = new AbortController(); setTimeout(() => c.abort(), 5000); const r = await fetch(API + '/config', { signal: c.signal, cache: 'no-store' }); return r.ok ? await r.json() : null } catch (e) { return null } }
function useCfg(j) { if (!j || !j.config || j.updated === curUpdated) return false; curUpdated = j.updated; applyCfg(j.config); try { localStorage.setItem('cp-cfg', JSON.stringify(j)) } catch (e) {} renderAll(); return true }
(async function boot() {
  let cached = null; try { cached = JSON.parse(localStorage.getItem('cp-cfg') || 'null') } catch (e) {}
  if (cached && cached.config) { try { useCfg(cached) } catch (e) { renderAll() } } 
  const p = fetchCfg();
  if (!cached) { const j = await Promise.race([p, sleep(900).then(() => null)]); let ok = false; try { ok = useCfg(j) } catch (e) {} if (!ok) renderAll() }
  try { useCfg(await p) } catch (e) {}
})();


/* WhatsApp order counter, shown in Nafetha's internal report */
(function(){
  const NAPI = 'https://nafetha-api.nafetha-web.workers.dev/crazypasta';
  function devId() { let d = ''; try { d = localStorage.getItem('cp_dev') || ''; if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); localStorage.setItem('cp_dev', d) } } catch (e) {} return d }
  /* one visit per device per day (counted on the server) */
  try { const d0 = devId(); if (d0.length >= 8 && !/[?&]noping/.test(location.search)) fetch(NAPI + '/hit', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ type: 'open', dev: d0 }), keepalive: true }).catch(() => {}) } catch (e) {}
  document.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('#revSend')) return;
    try { if (Date.now() - (+localStorage.getItem('cp_wa_t') || 0) < 3 * 60e3) return; localStorage.setItem('cp_wa_t', Date.now()) } catch (er) { return }
    const d = devId(); if (d.length < 8) return;
    fetch(NAPI + '/hit', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ type: 'wa', dev: d, total: totals().total, cur: CUR }), keepalive: true }).catch(() => {});
  });
})();
