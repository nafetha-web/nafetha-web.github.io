<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBCE00">
<title>Crazy Pasta | نموذج من نافذة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&family=Luckiest+Guy&display=swap">

<style>
:root {
  --y: #FBCE00;
  --y2: #FFE45C;
  --red: #E21F26;
  --red-d: #B5121A;
  --ink: #1A1410;
  --paper: #FFFDF5;
  --muted: #6B6052;
  --line: #EFE6CC;
  --wa: #1F9D55;
  --display: 'Lalezar', 'Cairo', sans-serif;
  --body: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  --latin: 'Luckiest Guy', 'Lalezar', sans-serif;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6 }
a { color: inherit }
img { display: block; max-width: 100% }
button, input, select, textarea { font-family: inherit; font-size: 16px }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
.ltr { direction: ltr; unicode-bidi: isolate }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px }

.demo { background: var(--ink); color: #FFF; font-size: 13px; text-align: center; padding: 7px 16px; line-height: 1.5 }
.demo a { color: var(--y); font-weight: 700 }

.top { position: sticky; top: 0; z-index: 20; background: var(--y); border-bottom: 3px solid var(--ink) }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; direction: ltr }
.logo .badge { width: 42px; height: 42px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 20px }
.logo b { font-family: var(--latin); font-weight: 400; font-size: 27px; line-height: .95; color: var(--red); text-shadow: 2px 2px 0 var(--ink); letter-spacing: .02em }
.logo b span { display: block; font-size: 17px; color: var(--ink); text-shadow: none }
.nav { display: flex; gap: 6px 16px; align-items: center; font-weight: 700 }
.nav a { text-decoration: none }
@media (max-width: 560px) { .nav a { display: none } }
.lang { background: var(--ink); color: var(--y); border: 0; border-radius: 999px; padding: 0 16px; min-height: 40px; font-weight: 700; cursor: pointer }

.hero { background: var(--y); position: relative; overflow: hidden; border-bottom: 3px solid var(--ink) }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 110%, rgba(255,255,255,.18) 0 6deg, transparent 6deg 14deg); pointer-events: none }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; padding-block: 34px 40px }
@media (max-width: 760px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 22px 30px; gap: 6px } }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--y); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 700; width: fit-content }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 12vw, 80px); line-height: 1.15; margin-top: 12px }
.hero h1 em { font-style: normal; color: var(--red); -webkit-text-stroke: 1px var(--ink) }
.hero p { margin: 10px 0 0; font-size: 18px; font-weight: 600; max-width: 30em }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; font-weight: 800; font-size: 17px; text-decoration: none; border: 3px solid var(--ink); cursor: pointer; white-space: nowrap; box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink) }
.btn-red { background: var(--red); color: #FFF }
.btn-white { background: #FFF; color: var(--ink) }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14.5px; font-weight: 700; margin-top: 16px }
.plate { position: relative; justify-self: center; width: min(100%, 460px) }
.plate img { width: 100%; height: auto; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); transition: opacity .5s, transform .5s }
.plate .tag { position: absolute; bottom: 8%; inset-inline-start: 4%; background: #FFF; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-4deg) }
.plate .tag b { color: var(--red) }
@media (prefers-reduced-motion: no-preference) { .plate img.swap { opacity: 0; transform: scale(.92) rotate(-6deg) } }

section.block { padding-block: 40px 6px; display: flex; flex-direction: column; gap: 14px }
.block h2 { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.25 }
.eyebrow { font-weight: 800; color: var(--red); font-size: 14px; margin: 0 }

/* game */
.game { background: var(--red); color: #FFF; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); padding: 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; position: relative; overflow: hidden }
@media (max-width: 760px) { .game { grid-template-columns: minmax(0, 1fr) } .reel { order: -1; height: 170px } }
.game h2 { color: var(--y); -webkit-text-stroke: 1px var(--ink) }
.game p { margin: 6px 0 0; font-weight: 600 }
.reel { position: relative; height: 210px; background: var(--y); border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: inset 0 0 0 6px rgba(255,255,255,.35) }
.reel::before, .reel::after { content: ""; position: absolute; inset-inline: 0; height: 36px; z-index: 2; pointer-events: none }
.reel::before { top: 0; background: linear-gradient(var(--y), transparent) }
.reel::after { bottom: 0; background: linear-gradient(transparent, var(--y)) }
.strip { position: absolute; inset-inline: 0; top: 0; will-change: transform }
.cell { height: var(--cell, 204px); display: grid; place-items: center; padding: 10px }
.cell img { max-height: 150px; width: auto }
.cell .pz { font-family: var(--display); font-size: 34px; color: var(--ink); text-align: center; line-height: 1.2 }
.cell .pz small { display: block; font-family: var(--body); font-size: 15px; font-weight: 700; color: var(--red) }
.marker { position: absolute; top: 50%; inset-inline: -2px; height: 0; z-index: 3 }
.marker::before, .marker::after { content: ""; position: absolute; top: -12px; border: 12px solid transparent }
.marker::before { left: 0; border-left-color: var(--ink) }
.marker::after { right: 0; border-right-color: var(--ink) }
.gbtns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px }
.gbtns .btn { width: 100% }
.btn-y { background: var(--y); color: var(--ink) }
.win { display: none; background: #FFF; color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; font-weight: 700 }
.win.on { display: block; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) }
.win b { color: var(--red); font-size: 20px }
.win code { background: var(--y); border-radius: 6px; padding: 1px 8px; font-family: ui-monospace, monospace; font-weight: 800 }
.gnote { font-size: 12.5px; opacity: .85; margin-top: 8px !important }
@keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }

/* menu */
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 65px; z-index: 10; background: var(--paper); padding-block: 10px; margin-inline: -16px; padding-inline: 16px }
.tabs::-webkit-scrollbar { display: none }
.tab { flex: none; border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); border-radius: 999px; padding: 0 16px; min-height: 42px; font-weight: 800; cursor: pointer }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--y) }
.cat { scroll-margin-top: 130px; padding-top: 6px }
.cat h3 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 6px 0 10px }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 760px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.dish { display: flex; flex-direction: column; background: #FFF; border: 2.5px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: 4px 4px 0 var(--ink); min-width: 0 }
.dish .ph { position: relative; background: var(--y); aspect-ratio: 602 / 440; overflow: hidden; border-bottom: 2.5px solid var(--ink) }
.dish .ph img { width: 100%; height: 100%; object-fit: cover }
.dish .ph.empty { display: grid; place-items: center; font-size: 46px; aspect-ratio: auto; height: 96px }
.dish .tag { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--red); color: #FFF; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 10px; border: 2px solid var(--ink) }
.dish .body { flex: 1; padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 2px }
.dish h4 { margin: 0; font-size: 15.5px; font-weight: 800; line-height: 1.35 }
.dish p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.dish .row { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px }
.price { font-weight: 800; color: var(--red); font-size: 16px; white-space: nowrap }
.qty { display: flex; align-items: center; gap: 5px }
.qbtn { width: 36px; height: 36px; border-radius: 11px; border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); font-size: 19px; font-weight: 800; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0 }
.qbtn.add { background: var(--y) }
.qn { min-width: 16px; text-align: center; font-weight: 800 }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0 }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px }
.card { background: var(--y); border: 2.5px solid var(--ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 4px 4px 0 var(--ink) }
.card b { font-family: var(--display); font-weight: 400; font-size: 22px }
.card a { font-weight: 800 }
.foot { color: var(--muted); font-size: 13px; text-align: center; padding-block: 30px 130px }
.foot a { color: var(--red); font-weight: 800 }

.order { position: fixed; inset-inline: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #FFF; z-index: 30 }
.order .wrap { padding-inline: 0; display: flex; align-items: center; gap: 12px }
.order .sum { flex: 1; min-width: 0; font-size: 14px; opacity: .85 }
.order .sum strong { display: block; font-size: 19px; color: var(--y) }
.order .prize { color: var(--y); font-weight: 700; font-size: 12.5px; display: block }
.wa { background: var(--wa); color: #FFF; border-color: #FFF; box-shadow: none }
.wa[aria-disabled="true"] { opacity: .45; pointer-events: none }
.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88vh; border-radius: 24px 24px 0 0; background: var(--paper); color: var(--ink) }
.sheet::backdrop { background: rgba(0,0,0,.5) }
.sheet-in { padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px }
.sheet-head { display: flex; justify-content: space-between; align-items: center }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 30px }
.x { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFF; font-size: 22px; cursor: pointer }
.revlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 36vh }
.rev { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #FFF; border-radius: 14px; padding: 8px }
.rev .ph { width: 54px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--y); flex: none }
.rev .ph img { width: 100%; height: 100%; object-fit: cover }
.rev .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.4 }
.rev .nm small { display: block; color: var(--red); font-weight: 800 }
.revprize { background: var(--y); border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px }
.revtotal { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--line); padding-top: 10px }
.revtotal strong { font-size: 22px }
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 14px; font-weight: 800 }
.field input, .field select, .field textarea { border: 2.5px solid var(--ink); background: #FFF; color: var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100% }
.back { background: #FFF; color: var(--ink) }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
</style>
</head>

    gEyebrow: 'متل الريل… بس حقيقي', gTitle: 'وقّف وشوف شو طلعلك!', gText: 'كبسة وحدة بتوقّف الدولاب، واللي بيطلعلك بينضاف عطلبك عالواتساب.',
    gStart: 'لفّ 🎡', gStop: 'وقّف! ✋', gDone: 'جرّبت حظك اليوم ✔', gNote: 'محاولة وحدة بالنهار. الجوائز هون مثال، وصاحب المطعم بيحدّدها.',
    gWin: (p, c) => '🎉 طلعلك: <b>' + p + '</b><br>الكود: <code>' + c + '</code> · بينضاف عطلبك لحالو.',
    menuTitle: 'المنيو', priceNote: 'الأسعار بهالنموذج تقريبية، ومنعدّلها حسب منيو المطعم.',
    pop: 'الأكثر طلبًا', hot: 'حار 🌶️',
    visitTitle: 'تفضّلوا لعنّا', lblAddr: 'العنوان', addr: 'شارع عزمي، طرابلس', map: 'افتح عالخريطة', lblDel: 'التوصيل', del: 'منوصّل لعندك، اطلب عالواتساب وبيوصلك سخن.', lblPhone: 'للطلب',
    foot: '© 2026 Crazy Pasta · نموذج من تصميم <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">نافذة</a>',
    items: (n) => n === 0 ? 'ما اخترت شي بعد' : n === 1 ? 'صنف واحد' : n + ' أصناف', go: 'كمّل الطلب',
    add: 'زيد', remove: 'شيل', money: (n) => '$' + (Math.round(n * 100) / 100),
    revTitle: 'طلبك', revNote: 'ملاحظة (اختياري)', revAddr: 'العنوان (للتوصيل)', revSend: 'ابعت الطلب عالواتساب', revBack: 'زيد أكل',
    lblWhere: 'كيف بدك ياه؟', where: ['توصيل', 'استلام من المطعم'],
    hello: 'مرحبا Crazy Pasta 👋 بدي اطلب:', total: 'المجموع', fromSite: '📲 طلب من الموقع', prizeLine: (p, c) => '🎁 الجائزة: ' + p + ' (كود ' + c + ')', addrLine: 'العنوان', noteLine: 'ملاحظة' },
  en: { dir: 'ltr', lang: 'عربي',
    demo: 'A proposed site for Crazy Pasta by <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">Nafetha</a>, not the official site.',
    navPlay: 'Try your luck', navMenu: 'Menu', navVisit: 'Contact',
    pill: '🍝 Pasta & more · Tripoli',
    heroTitle: 'Pasta that\'s <em>crazy</em> good,<br>to your door',
    heroText: 'Pick your dish, review your order and send it on WhatsApp in one tap. And just like our reels: stop it and see what you win!',
    ctaMenu: 'Order now', ctaPlay: '🎁 Try your luck', facts: ['🛵 Delivery', '💸 Fair prices', '📲 One-tap ordering'],
    gEyebrow: 'Like the reel… but real', gTitle: 'Stop it and see what you win!', gText: 'One tap stops the reel, and your prize is added to your WhatsApp order.',
    gStart: 'Spin 🎡', gStop: 'Stop! ✋', gDone: 'You played today ✔', gNote: 'One try per day. Prizes here are examples; the restaurant sets them.',
    gWin: (p, c) => '🎉 You got: <b>' + p + '</b><br>Code: <code>' + c + '</code> · added to your order automatically.',
    menuTitle: 'Menu', priceNote: 'Prices in this demo are indicative; we update them from the restaurant menu.',
    pop: 'Popular', hot: 'Spicy 🌶️',
    visitTitle: 'Visit us', lblAddr: 'Address', addr: 'Azmi Street, Tripoli', map: 'Open in Maps', lblDel: 'Delivery', del: 'We deliver. Order on WhatsApp and get it hot.', lblPhone: 'Order',
    foot: '© 2026 Crazy Pasta · Demo designed by <a href="https://nafetha-web.github.io" target="_blank" rel="noopener">Nafetha</a>',
    items: (n) => n === 0 ? 'Nothing added yet' : n + (n === 1 ? ' item' : ' items'), go: 'Checkout',
    add: 'Add', remove: 'Remove', money: (n) => '$' + (Math.round(n * 100) / 100),
    revTitle: 'Your order', revNote: 'Note (optional)', revAddr: 'Address (for delivery)', revSend: 'Send order on WhatsApp', revBack: 'Add more',
    lblWhere: 'How would you like it?', where: ['Delivery', 'Pick up'],
    hello: 'Hi Crazy Pasta 👋 I would like to order:', total: 'Total', fromSite: '📲 Order from the website', prizeLine: (p, c) => '🎁 Prize: ' + p + ' (code ' + c + ')', addrLine: 'Address', noteLine: 'Note' }
};

let lang = 'ar', activeCat = MENU[0].id, prize = null;
const cart = {};
const ALL = MENU.flatMap(c => c.items);
const $ = (id) => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
try { const s = localStorage.getItem('crazy-lang'); if (s === 'en' || s === 'ar') lang = s } catch (e) {}
try { const p = JSON.parse(localStorage.getItem('crazy-prize') || 'null'); if (p && p.day === new Date().toDateString()) prize = p } catch (e) {}

function thumb(i) { return i.ph ? '<div class="ph"><img src="' + img(i.ph) + '" alt="' + i[lang] + '" loading="lazy" width="602" height="440">' : '<div class="ph empty"><span aria-hidden="true">' + i.em + '</span>' }
function qtyHTML(i) {
  const t = T[lang], q = cart[i.id] || 0;
  return '<div class="qty">' + (q ? '<button type="button" class="qbtn" data-dec="' + i.id + '" aria-label="' + t.remove + '">−</button><span class="qn">' + q + '</span>' : '') +
    '<button type="button" class="qbtn add" data-inc="' + i.id + '" aria-label="' + t.add + ' ' + i[lang] + '">+</button></div>';
}
function renderStatic() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  $('demoBar').innerHTML = t.demo; $('langBtn').textContent = t.lang; $('heroTitle').innerHTML = t.heroTitle; $('foot').innerHTML = t.foot;
  ['navPlay','navMenu','navVisit','pill','heroText','ctaMenu','ctaPlay','gEyebrow','gTitle','gText','gNote','menuTitle','priceNote','visitTitle','lblAddr','addr','lblDel','del','lblPhone'].forEach(k => { $(k).textContent = t[k] });
  $('facts').innerHTML = t.facts.map(f => '<span>' + f + '</span>').join('');
  $('mapLink').textContent = t.map; $('mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Crazy Pasta Azmi Street Tripoli');
  heroTag(); renderGame();
}
let io = null;
function renderMenu() {
  const t = T[lang];
  $('tabs').innerHTML = MENU.map(c => '<button type="button" class="tab" data-cat="' + c.id + '" aria-pressed="' + (c.id === activeCat) + '">' + c[lang] + '</button>').join('');
  $('cats').innerHTML = MENU.map(c => '<div class="cat" id="cat-' + c.id + '"><h3>' + c[lang] + '</h3><div class="list">' + c.items.map(i => {
    const d = i['d' + lang], tag = i.pop ? t.pop : i.hot ? t.hot : '';
    return '<article class="dish">' + thumb(i) + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</div><div class="body"><h4>' + i[lang] + '</h4>' + (d ? '<p>' + d + '</p>' : '') + '<div class="row"><span class="price ltr">' + t.money(i.p) + '</span>' + qtyHTML(i) + '</div></div></article>';
  }).join('') + '</div></div>').join('');
  if ('IntersectionObserver' in window) {
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { activeCat = e.target.id.slice(4); document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cat === activeCat))) } }), { rootMargin: '-140px 0px -60% 0px' });
    document.querySelectorAll('.cat').forEach(c => io.observe(c));
  }
}
function totals() { const lines = ALL.filter(i => cart[i.id]); return { lines, count: lines.reduce((a, i) => a + cart[i.id], 0), total: lines.reduce((a, i) => a + cart[i.id] * i.p, 0) } }
function renderOrder() {
  const t = T[lang], o = totals();
  $('sum').innerHTML = t.items(o.count) + (o.count ? '<strong class="ltr">' + t.money(o.total) + '</strong>' : '') + (prize ? '<span class="prize">🎁 ' + PRIZES[prize.i][lang] + '</span>' : '');
  const go = $('goBtn'); go.textContent = t.go;
  if (o.count) go.removeAttribute('aria-disabled'); else go.setAttribute('aria-disabled', 'true');
  if ($('review').open) renderReview();
}
function renderReview() {
  const t = T[lang], o = totals();
  if (!o.lines.length) { closeReview(); return }
  $('revTitle').textContent = t.revTitle; $('revTotalLbl').textContent = t.total; $('revTotal').textContent = t.money(o.total);
  $('revWhereLbl').textContent = t.lblWhere; const w = $('revWhere').selectedIndex; $('revWhere').innerHTML = t.where.map(x => '<option>' + x + '</option>').join(''); $('revWhere').selectedIndex = Math.max(0, w);
  $('revAddrLbl').textContent = t.revAddr; $('revAddr').parentElement.hidden = $('revWhere').selectedIndex !== 0;
  $('revNoteLbl').textContent = t.revNote; $('revBack').textContent = t.revBack; $('revSend').textContent = t.revSend;
  $('revList').innerHTML = o.lines.map(i => '<div class="rev">' + (i.ph ? '<div class="ph"><img src="' + img(i.ph) + '" alt=""></div>' : '<div class="ph" style="display:grid;place-items:center;font-size:22px">' + i.em + '</div>') + '<div class="nm">' + i[lang] + '<small class="ltr">' + t.money(cart[i.id] * i.p) + '</small></div>' + qtyHTML(i) + '</div>').join('');
  const pz = prize ? PRIZES[prize.i][lang] : '';
  $('revPrize').hidden = !prize; if (prize) $('revPrize').textContent = t.prizeLine(pz, prize.c);
  const addr = $('revAddr').value.trim(), note = $('revNote').value.trim(), del = $('revWhere').selectedIndex === 0;
  const msg = t.hello + '\n' + o.lines.map(i => '- ' + cart[i.id] + ' × ' + i[lang] + ' (' + t.money(cart[i.id] * i.p) + ')').join('\n') + '\n' + t.total + ': ' + t.money(o.total) +
    (prize ? '\n' + t.prizeLine(pz, prize.c) : '') + '\n' + t.lblWhere + ' ' + t.where[$('revWhere').selectedIndex] + (del && addr ? '\n' + t.addrLine + ': ' + addr : '') + (note ? '\n' + t.noteLine + ': ' + note : '') + '\n\n' + t.fromSite;
  $('revSend').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
}
function openReview() { if (!totals().count) return; renderReview(); const d = $('review'); if (d.showModal) d.showModal(); else d.setAttribute('open', '') }
function closeReview() { const d = $('review'); if (d.open) { if (d.close) d.close(); else d.removeAttribute('open') } }

/* hero: rotate the dishes */
const HERO = ['alfredo', 'arrabbiata', 'steak', 'pesto', 'caesar'];
let hi = 0;
function heroTag() { const i = ALL.find(x => x.ph === HERO[hi]); $('heroTag').innerHTML = i[lang] + ' · <b class="ltr">' + T[lang].money(i.p) + '</b>' }
if (!RM) setInterval(() => { const im = $('heroImg'); im.classList.add('swap'); setTimeout(() => { hi = (hi + 1) % HERO.length; im.src = img(HERO[hi]); heroTag(); im.classList.remove('swap') }, 450) }, 3200);
HERO.forEach(h => { const p = new Image(); p.src = img(h) });

/* game: "stop it and see what you win" */
let CELL = 210; const N = PRIZES.length, LOOPS = 30;
let spinning = false, pos = 0, speed = 0, raf = 0, stopAt = null;
function cellHTML(k) { const p = PRIZES[k]; return '<div class="cell"><div class="pz">' + p.em + ' ' + p[lang] + '<small>' + p.s[lang] + '</small></div></div>' }
function renderGame() {
  CELL = $('reel').clientHeight || 204; $('strip').style.setProperty('--cell', CELL + 'px');
  const t = T[lang];
  $('strip').innerHTML = Array.from({ length: N * LOOPS }, (_, i) => cellHTML(i % N)).join('');
  setStrip();
  const b = $('gBtn'); b.disabled = !!prize && !spinning;
  b.textContent = prize && !spinning ? t.gDone : spinning ? t.gStop : t.gStart;
  if (prize) { $('gWin').innerHTML = t.gWin(PRIZES[prize.i][lang], prize.c); $('gWin').classList.add('on') }
}
function setStrip() { $('strip').style.transform = 'translateY(' + (-(pos % (CELL * N * (LOOPS - 4)))) + 'px)' }
function loop() {
  if (stopAt !== null) {
    const d = stopAt - pos; if (d < .6) { pos = stopAt; setStrip(); finish(); return }
    pos += Math.max(.6, d * .06);
  } else pos += speed;
  setStrip(); raf = requestAnimationFrame(loop);
}
function finish() {
  spinning = false; stopAt = null;
  const i = Math.round(pos / CELL) % N, c = 'CRZ-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  prize = { i, c, day: new Date().toDateString() };
  try { localStorage.setItem('crazy-prize', JSON.stringify(prize)) } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  renderGame(); renderOrder();
}
$('gBtn').addEventListener('click', () => {
  if (prize && !spinning) return;
  if (!spinning) { spinning = true; speed = 26; pos = pos % (CELL * N); renderGame(); raf = requestAnimationFrame(loop); return }
  const target = (Math.ceil(pos / CELL) + 3 + Math.floor(Math.random() * N)) * CELL; stopAt = target; $('gBtn').disabled = true;
});

function renderAll() { renderStatic(); renderMenu(); renderOrder() }
function bump(e) {
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'); if (!inc && !dec) return;
  const id = inc ? inc.dataset.inc : dec.dataset.dec;
  if (inc) cart[id] = (cart[id] || 0) + 1; else { cart[id] = Math.max(0, (cart[id] || 0) - 1); if (!cart[id]) delete cart[id] }
  const y = scrollY; renderMenu(); renderOrder(); scrollTo(0, y);
}
$('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('crazy-lang', lang) } catch (e) {} renderAll() });
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; activeCat = b.dataset.cat; $('cat-' + activeCat).scrollIntoView({ block: 'start' }) });
$('cats').addEventListener('click', bump); $('revList').addEventListener('click', bump);
$('goBtn').addEventListener('click', openReview);
['revNote', 'revAddr'].forEach(id => $(id).addEventListener('input', renderReview)); $('revWhere').addEventListener('change', renderReview);
$('revClose').addEventListener('click', closeReview); $('revBack').addEventListener('click', closeReview);
$('review').addEventListener('click', (e) => { if (e.target === $('review')) closeReview() });
renderAll();
</script>
