<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #1B1512; --bg2: #241C18; --card: #FBF7F1; --ink: #211915; --mute: #7A6C61; --line: #E7DDD0;
  --gold: #C9A35B; --gold2: #E3C27F; --cream: #F4EDE3; --wa: #1F8A4C;
  --hf: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif; --bf: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif;
  --brand: 'Playfair Display', Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: var(--bf); overflow: hidden; overscroll-behavior: none }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer; border: 0; background: none; padding: 0 }
[hidden] { display: none !important }
canvas { display: block; touch-action: none }
#stage { position: fixed; inset: 0 }
.demo { position: fixed; top: 0; inset-inline: 0; z-index: 50; background: #0F0B09; color: #D9CCBD; font-size: 12px; text-align: center; padding: 5px 12px; padding-top: max(5px, env(safe-area-inset-top)) }
.demo a { color: var(--gold2); font-weight: 600; text-decoration: underline; text-underline-offset: 2px }
.top { position: fixed; z-index: 20; top: calc(28px + env(safe-area-inset-top)); inset-inline: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none }
.top > * { pointer-events: auto }
.logo { display: flex; flex-direction: column; line-height: 1; padding: 8px 14px; border-radius: 14px; background: rgba(20,15,12,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(201,163,91,.25) }
.logo b { font-family: var(--brand); font-weight: 500; font-size: 19px; letter-spacing: .5px; color: var(--gold2); direction: ltr }
.logo small { font-size: 11px; color: #CDBFAF; margin-top: 3px }
.sp { flex: 1 }
.ib { height: 42px; min-width: 42px; padding: 0 12px; border-radius: 14px; background: rgba(20,15,12,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(201,163,91,.25); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; position: relative }
.ib .n { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 19px; height: 19px; border-radius: 99px; background: var(--gold); color: #1B1512; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px }
.zones { position: fixed; z-index: 20; bottom: calc(14px + env(safe-area-inset-bottom)); inset-inline: 0; display: flex; gap: 8px; justify-content: center; padding: 0 10px; flex-wrap: wrap }
.zones button { padding: 10px 15px; border-radius: 99px; background: rgba(20,15,12,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(201,163,91,.3); font-size: 14px; font-weight: 600; white-space: nowrap }
.zones button.fitb { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #1B1512; border-color: transparent }
.hint { position: fixed; z-index: 19; top: calc(92px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(20,15,12,.8); border: 1px solid rgba(201,163,91,.25); border-radius: 99px; padding: 8px 16px; font-size: 13px; white-space: nowrap; transition: opacity .5s; pointer-events: none }
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--cream); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 99px; opacity: 0; transition: .3s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); white-space: nowrap }
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* sheets */
.ov { position: fixed; inset: 0; z-index: 60; background: rgba(10,7,5,.5); opacity: 0; pointer-events: none; transition: opacity .25s }
.ov.on { opacity: 1; pointer-events: auto }
.sheet { position: fixed; z-index: 61; inset-inline: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--card); color: var(--ink); border-radius: 24px 24px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; box-shadow: 0 -20px 60px rgba(0,0,0,.4) }
.sheet.on { transform: none }
.sheet .grab { width: 42px; height: 4px; border-radius: 9px; background: var(--line); margin: -6px auto 12px }
.sheet h2 { font-family: var(--hf); font-size: 21px; margin: 0 }
.sheet .x { position: absolute; top: 14px; inset-inline-end: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; color: var(--mute) }
.tag { display: inline-block; font-size: 12px; color: var(--mute); margin-bottom: 4px }
.price { font-family: var(--hf); font-size: 20px; font-weight: 700; color: #8A6A2E; margin-top: 4px }
.desc { color: var(--mute); font-size: 14px; margin: 8px 0 0; line-height: 1.6 }
.lbl { font-size: 13px; font-weight: 600; margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: baseline }
.lbl small { font-weight: 400; color: var(--mute) }
.sw { display: flex; gap: 10px; flex-wrap: wrap }
.sw button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); position: relative }
.sw button.on { box-shadow: 0 0 0 2px var(--gold) }
.sz { display: flex; gap: 8px; flex-wrap: wrap }
.sz button { min-width: 46px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; padding: 0 10px; position: relative }
.sz button.on { border-color: var(--ink); background: var(--ink); color: #fff }
.sz button.sug::after { content: ''; position: absolute; top: -4px; inset-inline-end: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold) }
.row { display: flex; gap: 10px; margin-top: 18px }
.btn { flex: 1; height: 50px; border-radius: 15px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--hf) }
.btn.dark { background: var(--ink); color: #fff }
.btn.gold { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #1B1512 }
.btn.line { border: 1.5px solid var(--line); color: var(--ink) }
.btn.wa { background: var(--wa); color: #fff }
.note { font-size: 12px; color: var(--mute); text-align: center; margin: 10px 0 0 }
.fld { display: grid; gap: 6px; margin-top: 12px }
.fld label { font-size: 13px; font-weight: 600 }
.in { width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 0 12px; font-size: 15px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.seg { display: flex; gap: 6px; background: #F1E9DE; padding: 4px; border-radius: 14px }
.seg button { flex: 1; height: 40px; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--mute) }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08) }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chips button { padding: 9px 13px; border-radius: 99px; border: 1.5px solid var(--line); font-size: 13.5px; font-weight: 600 }
.chips button.on { border-color: var(--ink); background: var(--ink); color: #fff }
details.more { margin-top: 14px; border: 1px dashed var(--line); border-radius: 14px; padding: 4px 12px 12px }
details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 8px 0; list-style: none }
.rangev { font-weight: 700; font-family: var(--hf) }
input[type=range] { width: 100%; accent-color: #8A6A2E }
.ci { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line) }
.ci .dot { width: 40px; height: 40px; border-radius: 12px; flex: none; border: 1px solid rgba(0,0,0,.08) }
.ci div { flex: 1; min-width: 0 }
.ci b { display: block; font-size: 14.5px }
.ci small { color: var(--mute); font-size: 12.5px }
.ci .p { font-weight: 700; font-family: var(--hf) }
.ci .rm { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); color: var(--mute) }
.tot { display: flex; justify-content: space-between; font-family: var(--hf); font-size: 18px; font-weight: 700; padding: 14px 0 4px }

/* intro */
.intro { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; background: radial-gradient(80% 60% at 50% 35%, rgba(201,163,91,.18), transparent 70%), rgba(15,11,9,.92); text-align: center; transition: opacity .6s }
.intro.off { opacity: 0; pointer-events: none }
.intro .m { font-family: var(--brand); font-size: clamp(40px, 11vw, 64px); font-weight: 500; color: var(--gold2); direction: ltr; line-height: 1 }
.intro .m i { font-style: italic }
.intro .ar { font-family: var(--hf); font-size: 18px; letter-spacing: 2px; color: #CDBFAF; margin-top: 8px }
.intro p { color: #CDBFAF; max-width: 30em; margin: 18px auto 0; line-height: 1.7; font-size: 15px }
.intro ul { list-style: none; padding: 0; margin: 20px auto 0; display: grid; gap: 10px; max-width: 320px; text-align: start; font-size: 14px; color: var(--cream) }
.intro li { display: flex; gap: 10px; align-items: center }
.intro li i { font-style: normal; width: 32px; height: 32px; border-radius: 10px; background: rgba(201,163,91,.15); display: grid; place-items: center; flex: none }
.intro .go { margin-top: 26px; height: 54px; padding: 0 34px; border-radius: 99px; background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #1B1512; font-weight: 700; font-size: 16px; font-family: var(--hf); box-shadow: 0 12px 34px rgba(201,163,91,.35) }
.intro .go:disabled { opacity: .5 }
.intro .ld { font-size: 12px; color: #9C8E80; margin-top: 12px }

/* fitting room */
.fit { position: fixed; inset: 0; z-index: 40; display: none; pointer-events: none }
.fit > * { pointer-events: auto }
.fit.on { display: block }
.fit .fbar { position: absolute; top: calc(28px + env(safe-area-inset-top)); inset-inline: 10px; display: flex; gap: 8px; align-items: center; z-index: 2 }
.fit .ftitle { font-family: var(--hf); font-weight: 600; font-size: 15px; padding: 0 6px; flex: 1; text-shadow: 0 1px 6px rgba(0,0,0,.5) }
.fpanel { position: absolute; inset-inline: 0; bottom: 0; z-index: 2; background: linear-gradient(to top, rgba(18,13,10,.97) 70%, rgba(18,13,10,0)); padding: 34px 12px calc(12px + env(safe-area-inset-bottom)) }
.pieces { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.pieces::-webkit-scrollbar { display: none }
.pc { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.08); font-size: 13px; font-weight: 600; max-width: 210px }
[dir=rtl] .pc { padding: 6px 6px 6px 8px }
.pc.on { border-color: var(--gold) }
.pc i { width: 26px; height: 26px; border-radius: 8px; flex: none; border: 1px solid rgba(255,255,255,.2) }
.pc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pc .rm { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 13px; line-height: 22px; flex: none; text-align: center }
.pc.add { border-style: dashed; color: var(--gold2) }
.fsw { display: flex; gap: 10px; margin: 12px 2px 0; overflow-x: auto; scrollbar-width: none; align-items: center }
.fsw button { width: 34px; height: 34px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,.6) }
.fsw button.on { box-shadow: 0 0 0 2px var(--gold); border-color: #fff }
.fsw small { color: #B8A999; font-size: 12px; white-space: nowrap }
.ffoot { display: flex; align-items: center; gap: 10px; margin-top: 12px }
.ffoot .t { font-family: var(--hf); font-weight: 700; font-size: 18px; color: var(--gold2) }
.ffoot .t small { display: block; font-weight: 400; font-size: 11.5px; color: #B8A999 }
.ffoot .btn { height: 46px }
.fhelp { position: absolute; z-index: 2; top: 50%; inset-inline-end: 12px; display: grid; gap: 8px }
.fhelp button { width: 42px; height: 42px; border-radius: 50%; background: rgba(20,15,12,.7); border: 1px solid rgba(201,163,91,.3); font-size: 17px }
.sizeb { font-size: 12.5px; color: #D9CCBD; line-height: 1.5; margin: 0 2px 10px }
.sizeb b { color: var(--gold2) }
.cat-list { display: grid; gap: 4px; margin-top: 6px }
.cat-h { font-size: 12px; color: var(--mute); font-weight: 600; margin: 14px 0 2px }
.it { display: flex; gap: 12px; align-items: center; padding: 9px 4px; border-radius: 12px; text-align: start; width: 100% }
.it:active { background: #F3ECE2 }
.it i { width: 38px; height: 38px; border-radius: 10px; flex: none }
.it div { flex: 1 } .it b { display: block; font-size: 14.5px } .it small { color: var(--mute) }
.it .p { font-weight: 700; font-family: var(--hf); font-size: 14px }
@media (min-width: 900px) { .fpanel { max-width: 560px; margin: 0 auto; border-radius: 20px 20px 0 0 } }
</style>
</head>

}
function sendWA(lines, tot) {
  const msg = [L('طلب جديد من موقع ميزون ليال', 'New order from Maison Layal'), '', ...lines, '', t('total') + ': ' + fmt(tot), form.name ? t('name') + ': ' + form.name : null, form.addr ? t('addr') + ': ' + form.addr : null].filter((x) => x !== null).join('\n');
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a, [data-close]'); if (!b) { if (e.target.id === 'ov') closeSheet(); return }
  const d = b.dataset;
  if ('close' in d) return closeSheet();
  if (d.zone) { goZone(d.zone); hideHint(); return }
  if ('openfit' in d) return openFit();
  if (d.col) { cur.c = d.col; return drawItem() }
  if (d.size) { cur.s = d.size; return drawItem() }
  if ('me' in d) { e.preventDefault(); return openMe('item') }
  if ('try' in d) { const c = { id: cur.id, c: cur.c }; return openFit(c) }
  if ('add' in d) { if (!cur.s) { toast(t('pickSize')); return } bag.push({ id: cur.id, c: cur.c, s: cur.s }); saveSt(); updBag(); toast(t('added')); return closeSheet() }
  if (d.g) { draft.g = d.g; draft.s = SHAPES[d.g][0][0]; if (!profile) { draft.h = d.g === 'w' ? 165 : 178; draft.w = d.g === 'w' ? 60 : 78 } return drawMe() }
  if (d.s) { draft.s = d.s; return drawMe() }
  if (d.skin) { draft.skin = d.skin; return drawMe() }
  if ('saveme' in d || 'skipme' in d) {
    if ('saveme' in d) { const { after, ...p } = draft; ['ch', 'wa', 'hi'].forEach((k) => { p[k] = +p[k] || 0; if (p[k] && (p[k] < 50 || p[k] > 180)) p[k] = 0 }); profile = p; saveSt() }
    const after = draft.after; draft = null;
    if (after === 'item' && cur) return drawItem();
    return openFit();
  }
  if (b.id === 'bagB') return openBag();
  if (b.id === 'langB') { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('ly_lang', lang) } catch (x) {} applyLang(); relabel(); if (fitOn) drawFit(); return }
  if (b.id === 'fitBack') return closeFit();
  if (b.id === 'meB') return openMe('fit');
  if (b.id === 'rotL') { fit.rotY -= .6; return } if (b.id === 'rotR') { fit.rotY += .6; return }
  if (b.id === 'zoomB') { fit.dist = fit.dist > 2.4 ? 1.8 : 3.1; return }
  if (d.unwear) { e.stopPropagation(); delete look[d.unwear]; saveSt(); rebuildAvatar(); return drawFit() }
  if (d.slot && b.classList.contains('pc')) { activeSlot = d.slot; return drawFit() }
  if ('addpiece' in d) return openAddPiece();
  if (d.wear) { wear(d.wear); closeSheet(); rebuildAvatar(); return drawFit() }
  if (d.fcol) { look[activeSlot].c = d.fcol; saveSt(); rebuildAvatar(); return drawFit() }
  if (b.id === 'lookBag' || b.id === 'lookWa') {
    const ks = ORDER.filter((k) => look[k]); if (!ks.length) { toast(t('emptyLook')); return }
    const items = ks.map((k) => ({ id: look[k].id, c: look[k].c, s: sizeFor(byId[look[k].id]) }));
    if (b.id === 'lookBag') { bag.push(...items); saveSt(); updBag(); toast(t('lookAdded')); return }
    const lines = items.map((x) => '• ' + nm(byId[x.id]) + ' (' + cn(x.c) + ', ' + t('sizeQ') + x.s + ') ' + fmt(byId[x.id].p));
    if (profile) lines.push('', L('مقاسات الزبون: ', 'Customer: ') + profile.h + 'cm · ' + profile.w + 'kg');
    return sendWA([L('إطلالة من غرفة القياس:', 'Look from the fitting room:'), ...lines], items.reduce((s, x) => s + byId[x.id].p, 0));
  }
  if (d.rmbag) { bag.splice(+d.rmbag, 1); saveSt(); updBag(); return openBag() }
  if ('send' in d) { if (!form.name.trim() || !form.addr.trim()) { toast(t('fill')); return } const tot = bag.reduce((s, x) => s + byId[x.id].p, 0); return sendWA(bag.map((x) => '• ' + nm(byId[x.id]) + ' (' + cn(x.c) + ', ' + t('sizeQ') + x.s + ') ' + fmt(byId[x.id].p)), tot) }
});
$('#ov').addEventListener('click', closeSheet);
document.addEventListener('input', (e) => {
  const d = e.target.dataset;
  if (d.r) { draft[d.r] = +e.target.value; const v = $(d.r === 'h' ? '#hv' : '#wv'); if (v) v.textContent = draft[d.r] + (d.r === 'h' ? ' cm' : ' kg') }
  if (d.m) draft[d.m] = e.target.value.replace(/[^\d.]/g, '');
  if (d.ff) { form[d.ff] = e.target.value; try { localStorage.setItem('ly_form', JSON.stringify(form)) } catch (x) {} }
});
function relabel() { labels.forEach(([m, it]) => { m.material.map.dispose(); m.material.map = labelTex(nm(it) + ' · ' + fmt(it.p)); m.material.needsUpdate = true }) }

/* ---------------- loop ---------------- */
function onResize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = fcam.aspect = w / h; cam.fov = w < h ? 70 : 60; cam.updateProjectionMatrix(); fcam.updateProjectionMatrix() }
addEventListener('resize', onResize); onResize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(.05, clock.getDelta());
  if (fitOn) {
    const b = body(), cy = b.H * .5 + .1, portrait = innerWidth < innerHeight;
    if (fit.group) fit.group.rotation.y += (fit.rotY - fit.group.rotation.y) * Math.min(1, dt * 8);
    const near = fit.dist < 2.4, dist = (near ? 2.2 : portrait ? 4.7 : 3.6) * (b.H / 1.7);
    const zoomY = near ? b.H * .74 : cy - (portrait ? .2 : .12);
    fcam.position.lerp(new THREE.Vector3(0, zoomY + .15, dist), Math.min(1, dt * 5)); fcam.lookAt(0, zoomY, 0);
    renderer.render(fscene, fcam);
  } else { updateWalk(dt); renderer.render(scene, cam) }
});

/* ---------------- start ---------------- */
applyLang(); updBag();
$('#ld').textContent = t('loading');
document.fonts && document.fonts.ready.then(() => relabel());
requestAnimationFrame(() => { $('#goB').disabled = false; $('#ld').textContent = '' });
$('#goB').addEventListener('click', () => { $('#intro').classList.add('off'); setTimeout(() => $('#intro').remove(), 700); setTimeout(hideHint, 7000) });
window.__ly = { openItem, openFit, closeSheet, wear, look: () => look, goZone, body, setProfile: (p) => { profile = p; saveSt() } };
</script>
</body>
