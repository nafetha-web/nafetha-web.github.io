<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ميزان للمحاسبة والاستشارات</title>
<meta name="description" content="محاسبة، رواتب، ضرائب وتدقيق للشركات. احسب عرض سعرك الشهري خلال دقيقة.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315191F'/%3E%3Cpath d='M32 14v34M18 22h28M18 22l-6 14h12zM46 22l-6 14h12zM24 48h16' stroke='%23C9A46A' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#15191F;--ink2:#4A535E;--stone:#EEF0F2;--paper:#FFFFFF;--brass:#B08D57;--brass2:#C9A46A;--green:#1F6B4F;--line:#DADFE4;--wrap:1200px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:var(--stone);font-size:17px;line-height:1.7;font-variant-numeric:tabular-nums}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brass2);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
h1,h2,h3{font-weight:600;line-height:1.2;letter-spacing:-.01em}
h2{font-size:clamp(30px,4vw,46px)}
.lead{color:var(--ink2);font-size:18px;max-width:58ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:6px;font-weight:600;font-size:16px;transition:background .15s,color .15s}
.b-brass{background:var(--brass2);color:var(--ink)}.b-brass:hover{background:#D8B57C}
.b-ink{background:var(--ink);color:#fff}.b-ink:hover{background:#262C35}
.b-out{border:1.5px solid rgba(255,255,255,.4);color:#fff}.b-out:hover{background:rgba(255,255,255,.1)}
.b-wa{background:#25D366;color:#073B22}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
section{scroll-margin-top:72px}
.sec{padding:100px 0}
@media (max-width:700px){.sec{padding:68px 0}}

.ribbon{background:#0B0E12;color:#C8CFD6;font-size:13px;text-align:center;padding:8px 16px}
.ribbon a{color:#fff;text-decoration:underline;text-underline-offset:3px}
header{position:sticky;top:0;z-index:40;background:rgba(21,25,31,.96);backdrop-filter:blur(8px);color:#fff;border-bottom:1px solid #262C35}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.brand small{display:block;font-size:12px;font-weight:400;color:#9AA4AE;margin-top:-3px}
.links{display:flex;gap:26px;font-size:15px;color:#B8C0C8}.links a:hover{color:#fff}
.nav-end{display:flex;gap:10px;align-items:center}
.lang{height:40px;padding:0 14px;border-radius:6px;border:1px solid #3A424C;font-size:14px}
.nav .btn{height:42px;padding:0 18px;font-size:15px}
@media (max-width:920px){.links{display:none}.nav .btn{display:none}}

/* hero */
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url(img/hero.webp) center/cover;opacity:.32}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,25,31,.2),rgba(21,25,31,.95));}
.grid-lines{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(201,164,106,.08) 1px,transparent 1px);background-size:100% 44px;pointer-events:none}
.hero .wrap{position:relative;z-index:2;padding-top:110px;padding-bottom:60px}
.hero h1{font-size:clamp(40px,6vw,78px);max-width:16ch;font-weight:600;letter-spacing:-.02em}
.hero p{color:#C3CBD3;font-size:19px;max-width:52ch;margin:22px 0 34px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);margin-top:80px;border-top:1px solid rgba(255,255,255,.18)}
.ledger div{padding:22px 0 0;border-inline-start:1px solid rgba(255,255,255,.12);padding-inline-start:20px}
.ledger div:first-child{border-inline-start:0;padding-inline-start:0}
.ledger b{display:block;font-size:clamp(30px,3.6vw,46px);font-weight:500;color:var(--brass2);direction:ltr;text-align:start}
[dir=rtl] .ledger b{text-align:right}
.ledger span{font-size:14px;color:#AEB7C0}
@media (max-width:760px){.ledger{grid-template-columns:1fr 1fr;row-gap:24px}.ledger div:nth-child(3){border-inline-start:0;padding-inline-start:0}.hero .wrap{padding-top:64px}}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:44px;border-top:1px solid var(--line)}
.svc article{padding:30px 26px 30px 0;border-bottom:1px solid var(--line)}
[dir=rtl] .svc article{padding:30px 0 30px 26px}
.svc article:not(:nth-child(3n)){border-inline-end:1px solid var(--line)}
.svc article:not(:nth-child(3n+1)){padding-inline-start:26px}
.svc h3{font-size:20px;margin:14px 0 8px}
.svc p{color:var(--ink2);font-size:15px}
.svc .ic{width:44px;height:44px;border-radius:8px;background:var(--ink);color:var(--brass2);display:grid;place-items:center}
@media (max-width:900px){.svc{grid-template-columns:1fr 1fr}.svc article{border-inline-end:0!important;padding-inline-start:0!important}.svc article:nth-child(odd){border-inline-end:1px solid var(--line)!important;padding-inline-end:20px!important}.svc article:nth-child(even){padding-inline-start:20px!important}}
@media (max-width:560px){.svc{grid-template-columns:1fr}.svc article{border-inline-end:0!important;border-left:0!important;border-right:0!important;padding:24px 0!important}}

/* calculator */
#calc{background:var(--paper)}
.calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;margin-top:44px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cin{padding:36px;display:flex;flex-direction:column;gap:30px;position:relative}
.cin h4{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.cin h4 output{color:var(--green);font-weight:700;direction:ltr}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{height:48px;border-radius:6px;border:1.5px solid var(--line);font-size:15px;font-weight:500;background:#fff}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=range]{direction:ltr;width:100%;accent-color:var(--green);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);direction:ltr}
.checks{display:flex;flex-direction:column;gap:10px}
.ck{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.ck input{width:20px;height:20px;accent-color:var(--green);flex:none}
.ck span{flex:1}
.ck small{display:block;color:var(--ink2);font-size:13px}
.ck:has(input:checked){border-color:var(--green);background:#F2F8F5}
.mtot{display:none}
@media (max-width:900px){.mtot{display:flex;position:sticky;top:76px;z-index:5;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;font-size:14px;box-shadow:0 10px 30px rgba(21,25,31,.25)}.mtot b{font-size:22px;font-weight:600;color:var(--brass2)}}
.cout{background:var(--ink);color:#fff;padding:36px;display:flex;flex-direction:column;position:relative}
.cout .lbl{color:#9AA4AE;font-size:14px}
.amount{font-size:clamp(46px,6vw,72px);font-weight:500;line-height:1.1;margin:6px 0 2px;direction:ltr;text-align:start;color:#fff}
[dir=rtl] .amount{text-align:right}
.amount small{font-size:.38em;color:#9AA4AE;font-weight:400}
.range{color:#AEB7C0;font-size:15px}
.bars{list-style:none;margin:30px 0;display:flex;flex-direction:column;gap:14px;flex:1}
.bars li{font-size:14px}
.bars .row{display:flex;justify-content:space-between;margin-bottom:6px;color:#D5DBE1}
.bars .row b{direction:ltr;font-weight:500}
.bars .bar{height:8px;border-radius:4px;background:#262C35;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--brass2);border-radius:4px;transition:width .35s ease}
.bars .off{opacity:.35}
.cout .meta{display:flex;gap:24px;font-size:14px;color:#AEB7C0;padding-top:18px;border-top:1px solid #2B323B;margin-bottom:22px}
.cout .meta b{color:#fff;font-weight:600}
.cout .disc{font-size:12px;color:#7F8994;margin-top:12px}
.cout .fld{display:flex;gap:10px;margin-bottom:12px}
.cout .fld input{flex:1;min-width:0;height:50px;border-radius:6px;border:1px solid #3A424C;background:#1D232B;color:#fff;padding:0 14px}
.cout .err{color:#F3A3A3;font-size:13px;min-height:18px;margin-bottom:6px}
@media (max-width:900px){.calc{grid-template-columns:minmax(0,1fr)}.cin,.cout{padding:24px 20px}.seg{grid-template-columns:1fr 1fr}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px;counter-reset:s;list-style:none}
.steps li{position:relative;padding-top:56px;border-top:2px solid var(--ink)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:16px;inset-inline-start:0;font-weight:600;font-size:15px;color:var(--brass)}
.steps h3{font-size:19px;margin-bottom:6px}
.steps p{color:var(--ink2);font-size:15px}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr;row-gap:36px}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* cases */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.case{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.case img{aspect-ratio:16/10;object-fit:cover;width:100%}
.case div{padding:24px;display:flex;flex-direction:column;gap:8px;flex:1}
.case .sector{font-size:13px;color:var(--brass);font-weight:600}
.case h3{font-size:19px}
.case p{color:var(--ink2);font-size:15px;flex:1}
.case .num{display:flex;align-items:baseline;gap:10px;padding-top:14px;border-top:1px solid var(--line);margin-top:8px}
.case .num b{font-size:34px;font-weight:600;color:var(--green);direction:ltr}
.case .num span{font-size:14px;color:var(--ink2)}
@media (max-width:900px){.cases{grid-template-columns:1fr}}

/* sectors */
.sectors{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.sectors span{padding:10px 18px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:15px}

/* team */
#team{background:var(--ink);color:#fff}
#team .lead{color:#AEB7C0}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.mem img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;filter:contrast(1.05)}
.mem h3{font-size:20px;margin-top:16px}
.mem p{color:#AEB7C0;font-size:15px}
.mem .cred{font-size:13px;color:var(--brass2);margin-top:4px}
@media (max-width:760px){.team{grid-template-columns:1fr 1fr}.team .mem:last-child{grid-column:1/3;max-width:50%;justify-self:center}}

/* careers + contact */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px}
.panel h3{font-size:22px;margin-bottom:10px}
.panel p{color:var(--ink2);font-size:15px;margin-bottom:18px}
.jobs{list-style:none;border-top:1px solid var(--line)}
.jobs li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.jobs small{display:block;color:var(--ink2);font-size:13px}
.jobs a{font-weight:600;color:var(--green);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.contact-list{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px}
.contact-list li{display:flex;gap:12px;align-items:flex-start}
.contact-list svg{flex:none;margin-top:4px;color:var(--brass)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.faq{max-width:820px;margin-top:30px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:600;font-size:18px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--brass);font-size:24px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--ink2);padding-bottom:20px;max-width:66ch}
footer{background:var(--ink);color:#9AA4AE;font-size:14px;padding:36px 0}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="ribbon"><span data-i="ribbon"></span> <a href="https://nafetha-web.github.io" data-i="ribbonLink"></a></div>
<header><div class="wrap nav">
  <a class="brand" href="#top"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#262C35"/><path d="M32 14v34M18 22h28M18 22l-6 14h12zM46 22l-6 14h12zM24 48h16" stroke="#C9A46A" stroke-width="3" fill="none" stroke-linejoin="round"/></svg><span><span data-i="brand"></span><small data-i="brandSub"></small></span></a>
  <nav class="links"><a href="#services" data-i="nSvc"></a><a href="#calc" data-i="nCalc"></a><a href="#how" data-i="nHow"></a><a href="#cases" data-i="nCases"></a><a href="#team" data-i="nTeam"></a><a href="#contact" data-i="nContact"></a></nav>
  <div class="nav-end"><button class="lang" id="langBtn" type="button"></button><a class="btn b-brass" href="#calc" data-i="ctaCalc"></a></div>
</div></header>

<main id="top">
<section class="hero">
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="wrap">
    <h1 data-i="h1"></h1>
    <p data-i="heroP"></p>
    <div class="hero-ctas"><a class="btn b-brass" href="#calc" data-i="ctaCalc"></a><a class="btn b-out" href="#contact" data-i="ctaTalk"></a></div>
    <div class="ledger" id="ledger">
      <div><b data-to="18">0</b><span data-i="l1"></span></div>
      <div><b data-to="240" data-plus>0</b><span data-i="l2"></span></div>
      <div><b data-to="1200" data-plus>0</b><span data-i="l3"></span></div>
      <div><b data-to="24" data-suffix="h">0</b><span data-i="l4"></span></div>
    </div>
  </div>
</section>

<section class="sec" id="services">
  <div class="wrap"><h2 data-i="sH"></h2><p class="lead" style="margin-top:12px" data-i="sP"></p><div class="svc" id="svcGrid"></div>
  <div class="sectors" id="sectors"></div></div>
</section>

<section class="sec" id="calc">
  <div class="wrap">
    <h2 data-i="cH"></h2><p class="lead" style="margin-top:12px" data-i="cP"></p>
    <div class="calc">
      <div class="cin">
        <a class="mtot" href="#cOut"><span data-i="cEst"></span><b id="mAmt" class="ltr">$0</b></a>
        <div><h4 data-i="cType"></h4><div class="seg" id="types"></div></div>
        <div><h4><span data-i="cEmp"></span><output id="oEmp"></output></h4><input type="range" id="emp" min="1" max="200" value="12"><div class="ticks"><span>1</span><span>50</span><span>100</span><span>200</span></div></div>
        <div><h4><span data-i="cInv"></span><output id="oInv"></output></h4><input type="range" id="inv" min="0" max="2000" step="10" value="150"><div class="ticks"><span>0</span><span>500</span><span>1000</span><span>2000</span></div></div>
        <div><h4 data-i="cSvc"></h4><div class="checks" id="checks"></div></div>
      </div>
      <div class="cout" id="cOut" aria-live="polite">
        <span class="lbl" data-i="cEst"></span>
        <div class="amount"><span id="amt">$0</span> <small data-i="perMonth"></small></div>
        <span class="range" id="rng"></span>
        <ul class="bars" id="bars"></ul>
        <div class="meta"><span><b id="hrs">0</b> <span data-i="hrsM"></span></span><span><b id="team1"></b></span></div>
        <div class="fld"><input id="cName" data-ph="phCo" autocomplete="organization"></div>
        <p class="err" id="cErr" role="alert"></p>
        <button class="btn b-wa" id="cSend" type="button" data-i="cSend"></button>
        <p class="disc" data-i="disc"></p>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="how">
  <div class="wrap"><h2 data-i="hH"></h2><ol class="steps" id="steps"></ol></div>
</section>

<section class="sec" id="cases" style="padding-top:0">
  <div class="wrap"><h2 data-i="kH"></h2><p class="lead" style="margin-top:12px" data-i="kP"></p><div class="cases" id="caseGrid"></div></div>
</section>

<section class="sec" id="team">
  <div class="wrap"><h2 data-i="tH"></h2><p class="lead" style="margin-top:12px" data-i="tP"></p><div class="team" id="teamGrid"></div></div>
</section>

<section class="sec" id="contact">
  <div class="wrap">
    <h2 data-i="ctH"></h2>
    <div class="two">
      <div class="panel">
        <h3 data-i="ctTalk"></h3><p data-i="ctP"></p>
        <ul class="contact-list">
          <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i="addr"></span></li>
          <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span class="ltr">+961 1 000 000</span></li>
          <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="ltr">hello@mizan.example</span></li>
          <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i="hours"></span></li>
        </ul>
      </div>
      <div class="panel">
        <h3 data-i="jH"></h3><p data-i="jP"></p>
        <ul class="jobs" id="jobs"></ul>
      </div>
    </div>
    <h2 style="margin-top:90px" data-i="fH"></h2>
    <div class="faq" id="faqList"></div>
  </div>
</section>
</main>
<footer><div class="wrap foot"><span data-i="foot"></span><span><span data-i="madeBy"></span> <a href="https://nafetha-web.github.io" style="text-decoration:underline;color:#fff">Nafetha</a></span></div></footer>

<script>
const WA='96171163991';
const IC={book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',pay:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>',tax:'<path d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"/><path d="M10 8h4M10 12h4"/>',audit:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3M9 11l1.5 1.5L13 10"/>',adv:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',setup:'<path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/>'};
const svg=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const TYPES={trade:1,services:.85,industry:1.35,food:1.1};
const SV=[
 {id:'book',ic:'book',on:true,f:(e,i,t)=>(120+i*.22+e*2)*t},

let shown=0,anim;
function calc(){
  C.emp=+$('#emp').value;C.inv=+$('#inv').value;
  $('#oEmp').textContent=C.emp;$('#oInv').textContent=C.inv.toLocaleString('en');
  const tf=TYPES[C.type];const parts=SV.map(s=>({id:s.id,v:C.on[s.id]?r10(s.f(C.emp,C.inv,tf)):0}));
  const total=parts.reduce((a,b)=>a+b.v,0),max=Math.max(...parts.map(p=>p.v),1);
  $('#bars').innerHTML=parts.map(p=>`<li class="${p.v?'':'off'}"><div class="row"><span>${t('svc')[p.id][0]}</span><b>${p.v?'$'+p.v.toLocaleString('en'):'—'}</b></div><div class="bar"><i style="width:${p.v/max*100}%"></i></div></li>`).join('');
  $('#rng').textContent=total?`${t('between')} $${r10(total*.9).toLocaleString('en')} ${t('and')} $${r10(total*1.15).toLocaleString('en')}`:'';
  const hrs=Math.round(total/22);$('#hrs').textContent=hrs;
  $('#team1').textContent=hrs>60?`2 ${t('acctsN')}`:`1 ${t('accts')}`;
  const from=shown,to=total,st=performance.now();cancelAnimationFrame(anim);
  const step=n=>{const k=Math.min(1,(n-st)/350),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));$('#amt').textContent='$'+v.toLocaleString('en');$('#mAmt').textContent='$'+v.toLocaleString('en');shown=v;if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step);
  C.total=total;
}

const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;io.disconnect();$$('#ledger b').forEach(b=>{const to=+b.dataset.to,st=performance.now(),suf=b.dataset.suffix||'',plus=b.hasAttribute('data-plus')?'+':'';const f=n=>{const k=Math.min(1,(n-st)/1200);b.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString('en')+suf+(k===1?plus:'');if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})})},{threshold:.4});
io.observe($('#ledger'));
