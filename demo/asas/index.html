<style>
:root{--bp:#0F2A4A;--bp2:#16375F;--hv:#F2A900;--ink:#1B1E22;--ink2:#555B63;--con:#E6E4DF;--paper:#F5F4F1;--line:#D3D0C9;--wrap:1240px}
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.65}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.b-hv{background:var(--hv);color:var(--ink)}.b-hv:hover{background:#FFBE1A}
.b-out{border:2px solid #fff;color:#fff}.b-out:hover{background:rgba(255,255,255,.1)}
.b-wa{background:#25D366;color:#073B22}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
section{scroll-margin-top:70px}
.sec{padding:110px 0}
@media (max-width:700px){.sec{padding:72px 0}}
.bpgrid{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:40px 40px}
.ribbon{background:#071629;color:#C6D2E0;font-size:13px;text-align:center;padding:8px 16px}
.ribbon a{color:#fff;text-decoration:underline;text-underline-offset:3px}
header{position:sticky;top:0;z-index:40;background:var(--bp);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:26px}
.logo small{display:block;font-size:12px;font-weight:500;color:#9FB3CB;margin-top:-4px}
.links{display:flex;gap:26px;font-size:16px;font-weight:700;color:#C6D2E0}.links a:hover{color:#fff}

.lang{height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.3);font-size:14px;font-weight:700}
.nav .btn{height:44px;padding:0 20px;font-size:15px}

/* hero */
.hero{background:var(--bp);color:#fff;padding:60px 0 90px}
.hero-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(46px,6.6vw,92px)}
.hero h1 em{font-style:normal;color:var(--hv)}
.hero p{color:#C6D2E0;font-size:20px;margin:22px 0 32px;max-width:40ch}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:36px;margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18)}
.stats b{display:block;font-size:38px;font-weight:900;color:var(--hv);direction:ltr;text-align:start}
[dir=rtl] .stats b{text-align:right}
.stats span{font-size:14px;color:#9FB3CB}
.ba{position:relative;aspect-ratio:3/2;overflow:hidden;user-select:none;touch-action:pan-y;cursor:ew-resize;background:#000;box-shadow:16px 16px 0 var(--hv)}
[dir=rtl] .ba{box-shadow:-16px 16px 0 var(--hv)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .b{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.ba .line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:var(--hv)}
.ba .knob{position:absolute;top:50%;left:var(--x,50%);width:58px;height:58px;margin:-29px 0 0 -29px;background:var(--hv);color:var(--ink);display:grid;place-items:center}
.ba .lab{position:absolute;top:14px;padding:6px 12px;background:rgba(15,42,74,.85);color:#fff;font-size:14px;font-weight:800}
.ba .l1{left:14px}.ba .l2{right:14px}
.ba-cap{margin-top:30px;font-size:14px;color:#9FB3CB;display:flex;justify-content:space-between;gap:12px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:40px}.hero{padding:40px 0 70px}.stats{gap:22px}.stats b{font-size:30px}}

/* projects */
.ptabs{display:flex;gap:0;margin-top:36px;border-bottom:2px solid var(--ink);overflow-x:auto}
.ptab{padding:14px 22px;font-weight:800;font-size:17px;color:var(--ink2);white-space:nowrap}
.ptab[aria-selected=true]{background:var(--ink);color:#fff}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:34px}
.proj{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.proj .ba{box-shadow:none}
.proj .body{padding:24px 26px 26px;display:flex;flex-direction:column;gap:10px}
.proj h3{font-size:26px}
.proj .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--ink2)}
.proj .meta b{color:var(--ink);font-weight:800}
.phases{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.phases li{font-size:12px;font-weight:700;color:var(--ink2);padding-top:10px;border-top:4px solid var(--con)}
.phases li.ok{border-color:var(--bp);color:var(--ink)}
.phases li.now{border-color:var(--hv);color:var(--ink)}
.prog{display:flex;align-items:center;gap:14px;margin-top:6px}
.prog .bar{flex:1;height:10px;background:var(--con)}
.prog .bar i{display:block;height:100%;background:var(--hv)}
.prog b{font-size:22px;font-weight:900;direction:ltr}
.proj img.solo{aspect-ratio:4/3;object-fit:cover;width:100%}
@media (max-width:860px){.projects{grid-template-columns:1fr}}

/* estimator */

#estimate .lead{color:#C6D2E0}
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;margin-top:44px;border:1px solid rgba(255,255,255,.18)}
.ein{padding:36px;display:flex;flex-direction:column;gap:26px;border-inline-end:1px solid rgba(255,255,255,.18)}
.ein h4{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between}
.ein h4 output{color:var(--hv);direction:ltr}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{min-height:54px;padding:8px;border:1.5px solid rgba(255,255,255,.25);font-weight:800;font-size:16px;line-height:1.2}
.opt small{display:block;font-weight:500;font-size:12px;color:#9FB3CB;margin-top:2px}
.opt[aria-pressed=true]{background:var(--hv);border-color:var(--hv);color:var(--ink)}
.opt[aria-pressed=true] small{color:#4A3B00}
input[type=range]{width:100%;accent-color:var(--hv);direction:ltr}
.eout{padding:36px;display:flex;flex-direction:column;gap:6px}
.eout .lbl{color:#9FB3CB;font-size:15px;font-weight:700}
.eout .big{font-size:clamp(40px,5vw,64px);font-weight:900;color:var(--hv);direction:ltr;text-align:start;line-height:1.1}
[dir=rtl] .eout .big{text-align:right}
.eout .row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed rgba(255,255,255,.18);font-size:16px}
.eout .row b{font-weight:800}
.eout .fld{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-size:14px;font-weight:700;color:#C6D2E0}
.eout input{height:54px;background:var(--bp2);border:1.5px solid rgba(255,255,255,.25);color:#fff;padding:0 14px;font-size:16px}
.eout input:focus{outline:none;border-color:var(--hv)}
.eout .err{color:#FFB4A8;font-size:14px;min-height:20px;margin:8px 0}
.eout .disc{font-size:13px;color:#9FB3CB;margin-top:10px}

/* process */
.steps{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);margin-top:44px;counter-reset:s}
.steps li{padding:56px 20px 0 0;border-top:4px solid var(--ink);position:relative}
[dir=rtl] .steps li{padding:56px 0 0 20px}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;top:14px;inset-inline-start:0;font-weight:900;font-size:22px;color:var(--hv);background:var(--ink);padding:0 8px;line-height:30px}
.steps h3{font-size:20px;margin-bottom:6px}
.steps p{font-size:15px;color:var(--ink2)}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr;row-gap:40px}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* team */
.team{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px;margin-top:44px;align-items:stretch}
.team .about{background:var(--ink);color:#fff;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.team .about img{width:100%;aspect-ratio:16/10;object-fit:cover}
.team .about p{color:#C9CDD2}
.mem img{width:100%;aspect-ratio:4/5;object-fit:cover}
.mem h3{font-size:22px;margin-top:14px}
.mem p{color:var(--ink2);font-size:15px}
.certs{display:flex;gap:10px;flex-wrap:wrap}
.certs span{border:1px solid rgba(255,255,255,.3);padding:6px 12px;font-size:13px;font-weight:700}
@media (max-width:900px){.team{grid-template-columns:1fr 1fr}.team .about{grid-column:1/3}}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}

.contact h3{font-size:19px;margin-bottom:8px}
.contact p{color:var(--ink2);font-size:16px}
.contact a{color:var(--bp);font-weight:800;text-decoration:underline;text-underline-offset:4px}
@media (max-width:700px){.contact{grid-template-columns:1fr}}
footer{background:var(--ink);color:#9AA0A7;font-size:14px;padding:30px 0}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

let lang='ar';try{const s=localStorage.getItem('asas-lang');if(s==='ar'||s==='en')lang=s}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],t=k=>T[lang][k];
const E={type:'villa',area:180,level:1,floors:1,cat:'all'};
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=t('dir');document.title=lang==='ar'?'أساس للمقاولات والهندسة':'Asas Contracting & Engineering';
  $$('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(typeof v==='string')el.textContent=v});
  $$('[data-ia]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ia)));
  $('#langBtn').textContent=t('lang');
  renderProjects();renderEst();
  $('#steps').innerHTML=t('steps').map(([h,p])=>`<li><h3>${h}</h3><p>${p}</p></li>`).join('');
  $('#certs').innerHTML=t('certs').map(c=>`<span>${c}</span>`).join('');
  initBA();
}
function renderProjects(){
  $('#ptabs').innerHTML=Object.keys(t('cats')).map(k=>`<button class="ptab" role="tab" aria-selected="${E.cat===k}" data-c="${k}">${t('cats')[k]}</button>`).join('');
  $$('#ptabs .ptab').forEach(b=>b.onclick=()=>{E.cat=b.dataset.c;renderProjects();initBA()});
  const list=PROJ.filter(p=>E.cat==='all'||p.cat===E.cat);
  $('#projects-grid').innerHTML=list.map(p=>{const n=t('names')[p.id],c=t('cities')[p.city];
    if(p.cat==='on'){return `<article class="proj"><img class="solo" src="img/${p.id}.webp" alt="${n}" loading="lazy"><div class="body"><h3>${n}</h3><div class="meta"><span>${t('area')}: <b><span class="ltr">${p.area.toLocaleString('en')}</span> ${t('m2')}</b></span><span>${t('where')}: <b>${c}</b></span></div><div class="prog"><span>${t('progress')}</span><div class="bar"><i style="width:${p.pct}%"></i></div><b>${p.pct}%</b></div><ol class="phases">${t('phaseN').map((x,i)=>`<li class="${i<p.phase?'ok':i===p.phase?'now':''}">${x}</li>`).join('')}</ol></div></article>`}
    return `<article class="proj"><div class="ba" data-ba role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="${n}"><img src="img/${p.id}-a.webp" alt="" loading="lazy"><img class="b" src="img/${p.id}-b.webp" alt="" loading="lazy"><span class="line"></span><span class="knob" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></span><span class="lab l1">${t('before')}</span><span class="lab l2">${t('after')}</span></div><div class="body"><h3>${n}</h3><div class="meta"><span>${t('area')}: <b><span class="ltr">${p.area}</span> ${t('m2')}</b></span><span>${t('dur')}: <b>${p.months} ${p.months>10?t('monthsW'):t('months')}</b></span><span>${t('where')}: <b>${c}</b></span></div><ol class="phases">${t('phaseN').map(x=>`<li class="ok">${x}</li>`).join('')}</ol></div></article>`}).join('');
}
function initBA(){
  $$('[data-ba]').forEach(el=>{if(el._ba)return;el._ba=1;let drag=false;
    const set=x=>{x=Math.max(0,Math.min(100,x));el.style.setProperty('--x',x+'%');el.setAttribute('aria-valuenow',Math.round(x))};
    const pos=e=>{const r=el.getBoundingClientRect();return (e.clientX-r.left)/r.width*100};
    el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);set(pos(e))});
    el.addEventListener('pointermove',e=>{if(drag)set(pos(e))});
    el.addEventListener('pointerup',()=>drag=false);
    el.addEventListener('keydown',e=>{const v=+el.getAttribute('aria-valuenow');if(e.key==='ArrowLeft')set(v-5);if(e.key==='ArrowRight')set(v+5)});
    set(50)});
}
const r1k=x=>Math.round(x/1000)*1000;
function calc(){
  const rate=RATE[E.type][E.level]*(E.type==='villa'?[1,.97,.95][E.floors-1]:1);
  const total=rate*E.area,lo=r1k(total*.9),hi=r1k(total*1.12);
  const months=Math.max(1,Math.round(E.area*TIME[E.type][E.level]+(E.type==='villa'?E.floors*1.5:0)));
  return {rate:Math.round(rate),lo,hi,months};
}
function renderEst(){
  $('#eTypes').innerHTML=Object.keys(RATE).map(k=>`<button class="opt" type="button" data-t="${k}" aria-pressed="${E.type===k}">${t('types')[k][0]}<small>${t('types')[k][1]}</small></button>`).join('');
  $$('#eTypes .opt').forEach(b=>b.onclick=()=>{E.type=b.dataset.t;renderEst()});
  $('#eLevels').innerHTML=t('levels').map(([n,s],i)=>`<button class="opt" type="button" data-l="${i}" aria-pressed="${E.level===i}">${n}<small>${s}</small></button>`).join('');
  $$('#eLevels .opt').forEach(b=>b.onclick=()=>{E.level=+b.dataset.l;renderEst()});
  $('#eFloors').innerHTML=t('floors').map((n,i)=>`<button class="opt" type="button" data-f="${i+1}" aria-pressed="${E.floors===i+1}" ${E.type!=='villa'?'disabled style="opacity:.35"':''}>${n}</button>`).join('');
  $$('#eFloors .opt').forEach(b=>b.onclick=()=>{E.floors=+b.dataset.f;renderEst()});
  E.area=+$('#area').value;$('#oArea').textContent=E.area+' '+t('m2');
  const c=calc();$('#eTotal').textContent=`$${c.lo.toLocaleString('en')} – $${c.hi.toLocaleString('en')}`;
  $('#ePerM').textContent=`~$${c.rate}`;$('#eDur').textContent=`${c.months} ${c.months>10?t('monthsW'):t('monthsW2')}`;
}
$('#area').oninput=renderEst;
$('#eSend').onclick=()=>{const n=$('#eName').value.trim();if(!n){$('#eErr').textContent=t('needName');$('#eName').focus();return}$('#eErr').textContent='';const c=calc();
  const L=[t('waHead'),'',`• ${t('waType')}: ${t('types')[E.type][0]}`,`• ${t('waArea')}: ${E.area} ${t('m2')}`,`• ${t('waLevel')}: ${t('levels')[E.level][0]}`];
  if(E.type==='villa')L.push(`• ${t('waFloors')}: ${t('floors')[E.floors-1]}`);
  L.push(`• ${t('waEst')}: $${c.lo.toLocaleString('en')} - $${c.hi.toLocaleString('en')}`,`• ${t('waDur')}: ${c.months} ${t('monthsW')}`,`• ${t('waName')}: ${n}`,'',t('waFoot'));
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(L.join('\n'))}`,'_blank','noopener')};
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('asas-lang',lang)}catch(e){};render()};
render();
