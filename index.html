<style>
:root {
  --teal: #0E4D4A;
  --teal-deep: #0A3836;
  --teal-2: #145F5B;
  --mint: #D5E6E4;
  --mint-soft: #EEF5F4;
  --gold: #E2B04A;
  --gold-ink: #8A6416;
  --paper: #FFFFFF;
  --ink: #1B1B1F;
  --muted: #55555C;
  --line: #E1E7E6;
  --wa: #1F8A4C;
  --display: 'El Messiri', 'IBM Plex Sans Arabic', serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.7 }
a { color: inherit }
img, svg, iframe { max-width: 100% }
button, input, select, textarea { font-family: inherit; font-size: 16px }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance }
p { margin: 0 }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 14px; font-weight: 600; font-size: 17px; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap }
.btn-gold { background: var(--gold); color: var(--teal-deep) }
.btn-gold:hover { background: #EBBE5E }
.btn-line { background: transparent; color: #FFFFFF; border: 1.5px solid rgba(255,255,255,.55) }
.btn-line:hover { border-color: #FFFFFF }
.btn-teal { background: var(--teal); color: #FFFFFF }
.btn-teal:hover { background: var(--teal-deep) }
.btn-wa { background: var(--wa); color: #FFFFFF }
.btn-ghost { background: transparent; color: var(--teal); border: 1.5px solid var(--teal) }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line) }
@supports (backdrop-filter: blur(8px)) { .top { background: rgba(255,255,255,.85); backdrop-filter: blur(10px) } }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--teal) }
.brand b { font-family: var(--display); font-size: 27px; font-weight: 700; line-height: 1 }
.nav { display: flex; align-items: center; gap: 4px 26px; font-size: 15.5px }
.nav a { text-decoration: none; color: #3A3A40 }
.nav a:hover { color: var(--teal) }
.top .actions { display: flex; align-items: center; gap: 10px }
.lang { background: transparent; color: var(--teal); border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; min-height: 42px; font-weight: 600; cursor: pointer }
.top .btn { min-height: 42px; padding: 0 18px; font-size: 15px; border-radius: 999px }
@media (max-width: 900px) {
  .top .wrap { flex-wrap: wrap; row-gap: 0 }
  .nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; gap: 22px; padding: 0 0 10px; font-size: 14.5px; white-space: nowrap }
  .nav::-webkit-scrollbar { display: none }
}
@media (max-width: 420px) { .top .btn { display: none } }

/* hero */
.hero { background: var(--teal); color: #FFFFFF; position: relative; overflow: hidden }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 25% 40%, rgba(226,176,74,.16), transparent 70%); pointer-events: none }
[dir="ltr"] .hero::before { background: radial-gradient(60% 70% at 75% 40%, rgba(226,176,74,.16), transparent 70%) }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 48px; align-items: center; padding-block: 64px 72px }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 44px 56px; gap: 40px } }
.hero h1 { font-size: clamp(38px, 6.4vw, 66px); line-height: 1.22 }
.hero .lead { font-size: 19px; color: #D5E6E4; margin-top: 20px; max-width: 34em }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px }
.assure { list-style: none; padding: 0; margin: 34px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 10px 28px; font-size: 15.5px; color: #E8F1F0 }
@media (max-width: 520px) { .assure { grid-template-columns: minmax(0, 1fr) } }
.assure li { display: flex; align-items: center; gap: 10px }
.assure svg { flex: none; color: var(--gold) }

/* the window: live demo framed by shutters */
.window { display: flex; flex-direction: column; align-items: center; min-width: 0; width: 100% }
.frame { display: flex; align-items: center; justify-content: center; gap: 0 }
.shutter { width: 92px; height: 470px; flex: none; color: var(--teal-2) }
.shutter.r { transform: scaleX(-1) }
[dir="ltr"] .shutter.l { transform: scaleX(-1) }
[dir="ltr"] .shutter.r { transform: none }
@media (max-width: 520px) { .shutter { width: 44px; height: 300px } }
@media (max-width: 400px) { .shutter { width: 22px; height: 260px } }
.phone { position: relative; width: 300px; height: 610px; background: var(--teal-deep); border-radius: 44px; padding: 11px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08) inset; flex: none }
@media (max-width: 520px) { .phone { width: 262px; height: 540px; border-radius: 40px } }
.phone .screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #FFFFFF; isolation: isolate }
@media (max-width: 520px) { .phone .screen { border-radius: 30px } }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; overflow: hidden }
.slide.on { opacity: 1; z-index: 1 }
.slide img { position: absolute; top: 0; left: 0; width: 100%; height: auto; display: block; max-width: none; will-change: transform }
.slide.swap img { height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity .45s ease }
.slide.swap img.on { opacity: 1 }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #F3E3BD; font-size: 14.5px; font-weight: 600; border-radius: 999px; padding: 6px 14px; margin-bottom: 18px }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(226,176,74,.25) }
.hero h1 em { font-style: normal; color: var(--gold) }
.switch { flex-wrap: wrap; justify-content: center }
.wcap .go { color: #FFFFFF; font-weight: 600; text-decoration: underline; text-underline-offset: 3px }

/* work gallery */
.work { background: var(--paper) }
.work .whead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 36px }
.work .whead .head { margin: 0 }
.arrows { display: flex; gap: 8px }
.arrows button { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: #FFFFFF; color: var(--teal); cursor: pointer; display: grid; place-items: center }
.arrows button:hover { border-color: var(--teal) }
[dir="rtl"] .arrows svg { transform: scaleX(-1) }
@media (max-width: 700px) { .arrows { display: none } }
.feature { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 0; background: var(--teal-deep); color: #FFFFFF; border-radius: 28px; overflow: hidden; margin-bottom: 22px }
@media (max-width: 760px) { .feature { grid-template-columns: minmax(0, 1fr) } }
.feature .media { position: relative; min-height: 420px; background: #11100E }
.feature video, .feature .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none }
.feature .strip { position: absolute; inset-inline-end: 16px; bottom: 16px; display: flex; gap: 8px }
.feature .strip img { position: static; width: 64px; height: 120px; border-radius: 12px; object-fit: cover; object-position: top; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 8px 20px rgba(0,0,0,.35) }
@media (max-width: 760px) { .feature .media { min-height: 0; aspect-ratio: 4 / 5 } }
.feature .fb { padding: 40px 36px; display: flex; flex-direction: column; gap: 16px; justify-content: center }
@media (max-width: 760px) { .feature .fb { padding: 28px 22px 30px } }
.feature h3 { font-size: clamp(26px, 3.4vw, 36px) }
.feature p { color: #CFE2E0 }
.wtag { display: inline-block; width: fit-content; font-size: 13.5px; font-weight: 700; color: var(--gold-ink); background: #FBF2DE; border-radius: 999px; padding: 3px 12px }
.feature .wtag { background: rgba(226,176,74,.16); color: var(--gold) }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 }
.chips li { font-size: 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 12px; color: #E8F1F0 }
.feature .btn { width: fit-content; margin-top: 6px }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, calc((100% - 44px) / 3)); gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px; scrollbar-width: thin; scrollbar-color: var(--mint) transparent; overscroll-behavior-x: contain }
@media (max-width: 900px) { .rail { grid-auto-columns: minmax(250px, 72%); margin-inline: -20px; padding-inline: 20px; scroll-padding-inline: 20px } }
.wk { scroll-snap-align: start; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF }
.thumb { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--mint-soft); container-type: size; border-bottom: 1px solid var(--line) }
.thumb img { position: absolute; top: 0; left: 0; width: 100%; height: auto; max-width: none; transition: transform 7s cubic-bezier(.45, 0, .55, 1) }
@media (hover: hover) { .wk:hover .thumb img { transform: translateY(calc(-100% + 100cqh)) } }
@media (hover: none) and (prefers-reduced-motion: no-preference) { .wk.in .thumb img { transform: translateY(calc(-100% + 100cqh)) } }
.wb { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1 }
.wb h3 { font-family: var(--body); font-weight: 700; font-size: 19px; color: var(--ink) }
.wb p { color: var(--muted); font-size: 15px; flex: 1 }
.wl { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-weight: 600; color: var(--teal); text-decoration: none; font-size: 15.5px }
.wl.wa { color: var(--wa) }
.wl:hover { text-decoration: underline; text-underline-offset: 3px }

/* reveal */
@media (prefers-reduced-motion: no-preference) {
  html.js .rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1) }
  html.js .rv.in { opacity: 1; transform: none }
}
.sill { width: min(520px, 100%); height: 12px; border-radius: 6px; background: var(--gold); margin-top: 18px }
.switch { display: inline-flex; margin-top: 22px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px }
.switch button { border: 0; background: transparent; color: #E8F1F0; font-weight: 600; font-size: 15px; min-height: 40px; padding: 0 18px; border-radius: 999px; cursor: pointer }
.switch button[aria-pressed="true"] { background: #FFFFFF; color: var(--teal) }
.wcap { margin-top: 12px; font-size: 14.5px; color: #CFE2E0; text-align: center; max-width: 30em }
.wcap a { color: #FFFFFF; font-weight: 600 }

/* sections */
section.blk { padding-block: 96px }
@media (max-width: 700px) { section.blk { padding-block: 64px } }
.head { max-width: 640px; margin-bottom: 44px }
.head h2 { font-size: clamp(30px, 4.4vw, 44px); color: var(--teal-deep) }
.head p { color: var(--muted); font-size: 18px; margin-top: 12px }

/* services: split layout, quiet list */
.svc { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 56px; align-items: start }
@media (max-width: 860px) { .svc { grid-template-columns: minmax(0, 1fr); gap: 8px } }
.svc .head { position: sticky; top: 110px; margin: 0 }
@media (max-width: 860px) { .svc .head { position: static; margin-bottom: 28px } }
.feats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px }
@media (max-width: 560px) { .feats { grid-template-columns: minmax(0, 1fr) } }
.feat { padding: 26px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 44px 1fr; gap: 4px 16px; align-items: start }
.feat .ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; background: var(--mint-soft); color: var(--teal); display: grid; place-items: center }
.feat h3 { font-family: var(--body); font-size: 18px; font-weight: 600; color: var(--ink) }
.feat p { color: var(--muted); font-size: 15.5px }

/* steps: a real sequence */
.how { background: var(--mint-soft) }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; counter-reset: s; position: relative }
.steps::before { content: ""; position: absolute; top: 27px; inset-inline: 28px; height: 2px; background: repeating-linear-gradient(to left, var(--teal) 0 8px, transparent 8px 16px); opacity: .35 }
@media (max-width: 800px) { .steps { grid-template-columns: minmax(0, 1fr); gap: 28px } .steps::before { display: none } }
.steps li { counter-increment: s; position: relative }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--teal); color: #FFFFFF; font-family: var(--display); font-weight: 700; font-size: 26px; margin-bottom: 18px; position: relative; z-index: 1; box-shadow: 0 0 0 6px var(--mint-soft) }
.steps li:last-child::before { background: var(--gold); color: var(--teal-deep) }
.steps h3 { font-family: var(--body); font-weight: 600; font-size: 20px; color: var(--ink) }
.steps p { color: var(--muted); margin-top: 6px; max-width: 30em }

/* pricing */
.ptop { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 36px }
.ptop .head { margin: 0 }
.period { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px }
.period button { border: 0; background: transparent; color: var(--ink); font-weight: 600; font-size: 15px; min-height: 40px; padding: 0 18px; border-radius: 999px; cursor: pointer }
.period button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF }
.promo { display: flex; align-items: center; gap: 12px; background: #FBF2DE; color: #5E4410; border-radius: 14px; padding: 14px 18px; font-weight: 600; margin-bottom: 24px }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch }
@media (max-width: 900px) { .plans { grid-template-columns: minmax(0, 1fr) } }
.plan { border: 1.5px solid var(--line); border-radius: 22px; padding: 30px 26px; display: flex; flex-direction: column; gap: 18px; background: var(--paper) }
.plan.main { background: var(--teal); color: #FFFFFF; border-color: var(--teal); position: relative }
.plan .tag { position: absolute; top: -14px; inset-inline-start: 24px; background: var(--gold); color: var(--teal-deep); font-size: 13.5px; font-weight: 700; border-radius: 999px; padding: 4px 14px }
.plan h3 { font-size: 26px }
.plan .for { font-size: 15px; color: var(--muted) }
.plan.main .for { color: #CFE2E0 }
.price { font-family: var(--display); font-weight: 700; font-size: 50px; line-height: 1.1; direction: ltr; unicode-bidi: isolate; display: flex; align-items: baseline; gap: 8px; justify-content: flex-end }
[dir="ltr"] .price { justify-content: flex-start }
.price small { font-family: var(--body); font-size: 15px; font-weight: 400; color: var(--muted) }
.plan.main .price small { color: #CFE2E0 }
.price.word { font-size: 38px; direction: inherit }
.plan ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px; flex: 1 }
.plan li { display: flex; gap: 10px; align-items: flex-start }
.plan li svg { flex: none; margin-top: 5px; color: var(--teal) }
.plan.main li svg { color: var(--gold) }
.plan .btn { width: 100% }
.plan.main .btn-ghost { color: #FFFFFF; border-color: rgba(255,255,255,.6) }
.plan .demo { font-size: 14.5px; text-align: center }
.plan .subs { font-size: 14px; font-weight: 600; color: var(--teal); background: var(--mint-soft); border-radius: 10px; padding: 6px 12px; width: fit-content }
.plan.main .subs { color: var(--teal-deep); background: var(--gold) }
.ptotal { font-weight: 600; color: var(--teal); margin: -8px 0 20px }
.plan .demo a { font-weight: 600; color: var(--teal) }
.plan.main .demo a { color: var(--gold) }

/* faq */
.faqgrid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 56px }
@media (max-width: 860px) { .faqgrid { grid-template-columns: minmax(0, 1fr); gap: 0 } }
.faq details { border-top: 1px solid var(--line) }
.faq details:last-child { border-bottom: 1px solid var(--line) }
.faq summary { list-style: none; cursor: pointer; padding: 20px 0; font-weight: 600; font-size: 17.5px; display: flex; justify-content: space-between; gap: 16px; align-items: center }
.faq summary::-webkit-details-marker { display: none }
.faq summary::after { content: "+"; font-size: 26px; font-weight: 400; color: var(--teal); line-height: 1; transition: transform .2s }
.faq details[open] summary::after { transform: rotate(45deg) }
.faq details p { color: var(--muted); padding-bottom: 20px; max-width: 40em }
.about { margin-top: 28px; padding: 24px; border-radius: 18px; background: var(--mint-soft) }
.about h3 { font-size: 22px; color: var(--teal-deep) }
.about p { color: var(--muted); margin-top: 8px; font-size: 16px }

/* contact */
.contact { background: var(--teal-deep); color: #FFFFFF }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start }
@media (max-width: 860px) { .cgrid { grid-template-columns: minmax(0, 1fr); gap: 36px } }
.contact h2 { font-size: clamp(30px, 4.4vw, 46px) }
.contact .sub { color: #CFE2E0; font-size: 18px; margin-top: 14px; max-width: 30em }
.reach { list-style: none; padding: 0; margin: 30px 0 0; display: flex; flex-direction: column; gap: 14px }
.reach a { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-size: 17px }
.reach a:hover { color: var(--gold) }
.reach .ic { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; flex: none; color: var(--gold) }
.ltr { direction: ltr; unicode-bidi: isolate }
form.card { background: #FFFFFF; color: var(--ink); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px }
form.card h3 { font-size: 24px; color: var(--teal-deep) }
.field { display: flex; flex-direction: column; gap: 6px }
.field label { font-size: 14.5px; font-weight: 600 }

document.documentElement.classList.add('js');
let lang = 'ar', period = 'm', STATS = null;
try { const s = localStorage.getItem('nafetha-lang'); if (s === 'ar' || s === 'en') lang = s } catch (e) {}
const $ = (id) => document.getElementById(id);
const money = (n) => '$' + n;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.textContent = v });
  $('langBtn').textContent = t.langBtn;
  $('assure').innerHTML = t.assure.map(a => '<li>' + tick + '<span>' + a + '</span></li>').join('');
  $('feats').innerHTML = t.feats.map(f => '<div class="feat"><span class="ic">' + ico(f[0]) + '</span><h3>' + f[1] + '</h3><p>' + f[2] + '</p></div>').join('');
  $('steps').innerHTML = t.steps.map(s => '<li><h3>' + s[0] + '</h3><p>' + s[1] + '</p></li>').join('');
  $('faqList').innerHTML = t.faq.map(q => '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>').join('');
  $('fKind').innerHTML = t.kinds.map(k => '<option>' + k + '</option>').join('');
  $('heroTitle').innerHTML = t.heroTitle;
  $('fChips').innerHTML = t.fChips.map(c => '<li>' + c + '</li>').join('');
  $('fCta').textContent = t.likeThis; $('fCta').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waLike(t.fName));
  renderPlans(); renderSlides(); renderWork(); renderForm();
  $('waFloat').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waHello);
}
function renderPlans() {
  const t = T[lang];
  const tot = STATS ? STATS.total : 0; $('ptotal').hidden = !(tot >= 3); if (tot >= 3) $('ptotal').textContent = t.subsTotal + ' ' + tot;
  document.querySelectorAll('#period button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === period)));
  $('plans').innerHTML = t.plans.map(p => {
    const price = p.price ? '<div class="price word">' + p.price + '</div>' : '<div class="price">' + money(period === 'm' ? p.m : p.y) + '<small>' + (period === 'm' ? t.perMonth : t.perYear) + '</small></div>';
    const msg = encodeURIComponent((lang === 'ar' ? 'مرحبًا نافذة، أنا مهتم بباقة ' : 'Hello Nafetha, I am interested in the ') + p.name + (lang === 'ar' ? '.' : ' plan.'));
    return '<article class="plan' + (p.main ? ' main' : '') + '">' + (p.main ? '<span class="tag">' + t.popular + '</span>' : '') +
      '<div><h3>' + p.name + '</h3><p class="for">' + p.for + '</p></div>' + price +
      (STATS && STATS[p.k] >= 1 ? '<p class="subs">' + t.subsOnPlan + ' ' + STATS[p.k] + '</p>' : '') +
      '<ul>' + p.f.map(x => '<li>' + tick + '<span>' + x + '</span></li>').join('') + '</ul>' +
      '<a class="btn ' + (p.main ? 'btn-gold' : 'btn-ghost') + '" href="https://wa.me/' + WA + '?text=' + msg + '" target="_blank" rel="noopener">' + (p.price ? t.quote : t.start) + '</a>' +
      (p.demo ? '<p class="demo"><a href="' + p.demo + '" target="_blank" rel="noopener">' + t.tryDemo + '</a></p>' : '') + '</article>';
  }).join('');
}
/* hero phone: screens of our sites, scrolling or switching colours */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SL = [{ k: 'rest', img: 'baron' }, { k: 'shop', img: 'famesto' }, { k: 'estate', img: 'prime' }, { k: 'biz', swap: ['seam-0', 'seam-1', 'seam-2', 'seam-3', 'seam-4'] }];
const src = (n) => 'media/work/' + n + '.webp';
let cur = 0, timer = 0, swapT = 0, heroOn = true;
SL.forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'slide' + (s.swap ? ' swap' : '');
  d.innerHTML = s.swap ? s.swap.map(n => '<img alt="" data-src="' + src(n) + '">').join('') : '<img alt="" data-src="' + src(s.img) + '">';
  $('screen').appendChild(d); s.el = d;
});
function loadSlide(i) { SL[i].el.querySelectorAll('img[data-src]').forEach(im => { im.src = im.dataset.src; im.removeAttribute('data-src') }) }
function motion(i) {
  const s = SL[i]; clearInterval(swapT);
  if (s.swap) {
    const ims = [...s.el.querySelectorAll('img')]; let j = 0;
    ims.forEach((im, n) => im.classList.toggle('on', n === 0));
    if (!RM) swapT = setInterval(() => { ims[j].classList.remove('on'); j = (j + 1) % ims.length; ims[j].classList.add('on') }, 1100);
    return;
  }
  const im = s.el.querySelector('img');
  const go = () => {
    im.getAnimations().forEach(a => a.cancel());
    const d = im.offsetHeight - $('screen').clientHeight;
    if (!RM && d > 0) im.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(' + (-Math.min(d, im.offsetWidth * 3.2)) + 'px)' }], { duration: 5600, delay: 600, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' });
  };
  im.complete && im.naturalHeight ? go() : im.addEventListener('load', go, { once: true });
}
function show(i) {
  cur = i; loadSlide(i); loadSlide((i + 1) % SL.length);
  SL.forEach((s, n) => s.el.classList.toggle('on', n === i));
  renderSlides(); motion(i); clearTimeout(timer);
  if (heroOn) timer = setTimeout(() => show((cur + 1) % SL.length), SL[i].swap ? 6200 : 7000);
}
function renderSlides() {
  const t = T[lang];
  $('switch').innerHTML = SL.map((s, n) => '<button type="button" data-i="' + n + '" aria-pressed="' + (n === cur) + '">' + t.slides[s.k][0] + '</button>').join('');
  $('wcap').innerHTML = t.slides[SL[cur].k][1] + ' <a class="go" href="#work">' + t.seeAll + '</a>';
}
$('switch').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) show(+b.dataset.i) });
new IntersectionObserver(([e]) => { heroOn = e.isIntersecting; clearTimeout(timer); clearInterval(swapT); if (heroOn) show(cur) }).observe($('screen'));

/* work gallery */
function renderWork() {
  const t = T[lang];
  $('rail').innerHTML = t.works.map(w => '<article class="wk"><div class="thumb"><img src="' + src(w.img) + '" alt="" loading="lazy" width="600"></div><div class="wb"><span class="wtag">' + w.tag + '</span><h3>' + w.t + '</h3><p>' + w.d + '</p>' +
    (w.href ? '<a class="wl" href="' + w.href + '" target="_blank" rel="noopener">' + t.tryLive + ' ↗</a>'
      : '<a class="wl wa" href="https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waLike(w.t)) + '" target="_blank" rel="noopener">' + t.likeThis + '</a>') + '</div></article>').join('');
  document.querySelectorAll('.wk').forEach(el => io.observe(el));
}
const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .35 });
document.querySelectorAll('.rv, section.blk .head, .about').forEach(el => { el.classList.add('rv'); io.observe(el) });
const arrow = (dir) => { const r = $('rail'), w = r.querySelector('.wk'); if (!w) return; r.scrollBy({ left: dir * (lang === 'ar' ? -1 : 1) * (w.offsetWidth + 22), behavior: 'smooth' }) };
$('prevW').addEventListener('click', () => arrow(-1)); $('nextW').addEventListener('click', () => arrow(1));
new IntersectionObserver(([e]) => { const v = $('featVid'); if (e.isIntersecting && !RM) { v.preload = 'auto'; v.play().catch(() => {}) } else v.pause() }, { threshold: .3 }).observe($('featVid'));
function renderForm() {
  const t = T[lang], shop = $('fShop').value.trim(), btn = $('fSend');
  if (!shop) { btn.textContent = t.fillShop; btn.removeAttribute('href'); btn.setAttribute('aria-disabled', 'true'); btn.style.opacity = '.6'; return }
  btn.textContent = t.send; btn.style.opacity = ''; btn.removeAttribute('aria-disabled');
  btn.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waMsg(shop, $('fKind').value, $('fNeed').value.trim()));
}

$('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('nafetha-lang', lang) } catch (e) {} render() });
$('period').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (!b) return; period = b.dataset.p; renderPlans() });
['fShop', 'fKind', 'fNeed'].forEach(id => { $(id).addEventListener('input', renderForm); $(id).addEventListener('change', renderForm) });
$('leadForm').addEventListener('submit', (e) => e.preventDefault());
render();
fetch('data/stats.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && typeof j.total === 'number') { STATS = j; renderPlans() } }).catch(() => {});
document.getElementById('offerFloat').addEventListener('click', e => { e.preventDefault(); const o = document.getElementById('offer'); o.scrollIntoView({ behavior: 'smooth', block: 'center' }); o.classList.remove('flash'); setTimeout(() => o.classList.add('flash'), 450); setTimeout(() => o.classList.remove('flash'), 4000) });
