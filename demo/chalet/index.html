 for(var i=0;i<start;i++)h+='<div class="e"></div>';
 for(var d=1;d<=days;d++){
  var s=ds(new Date(y,m,d)),past=s<TODAY,cls='d',dis=past,lab='';
  if(ST.mode==='n'){
   var free=nightFree(s);
   if(ST.cin&&!ST.cout&&s>ST.cin){var ok=true,k=ST.cin;while(k<s){if(!nightFree(k)){ok=false;break}k=addD(k,1)}dis=past||!ok;if(ok)lab=''}
   else{if(!free&&!past){cls+=' bkd';dis=true}}
   if(!past&&free)lab=usd(nightP(s));
   if(isHol(s))cls+=' hol';else if(isWeNight(s))cls+=' we';
   if(s===ST.cin||s===ST.cout)cls+=' sel';else if(ST.cin&&ST.cout&&s>ST.cin&&s<ST.cout)cls+=' rng';
  }else{
   var fr=dayFree(s);if(!fr&&!past){cls+=' bkd';dis=true}
   if(!past&&fr)lab=usd(dayP(s));
   if(isHol(s))cls+=' hol';else if(isWeDay(s))cls+=' we';
   if(s===ST.day)cls+=' sel';
  }

function quote(){

  if(!ST.cin||!ST.cout)return q;
  var n=0,k=ST.cin,base=0;while(k<ST.cout){base+=nightP(k);n++;k=addD(k,1)}
  q.nights=n;q.lines.push([n+' '+_(n>1?'nights':'night',n>1?'ليالي':'ليلة'),base]);
  var ex=Math.max(0,ST.guests-SET.baseN);if(ex)q.lines.push([ex+' '+_('extra guests','أشخاص زيادة')+' × '+n,ex*SET.exN*n]);
  SET.addons.forEach(function(a){if(ST.adds[a.id]){var c=a.per==='night'?a.p*n:a.per==='pp'?a.p*ST.guests*n:a.p;q.lines.push([_(a.en,a.ar),c])}});
 }else{
  if(!ST.day)return q;q.nights=0;
  q.lines.push(['Day use · '+fmt(ST.day),dayP(ST.day)]);
  var ex2=Math.max(0,ST.guests-SET.baseD);if(ex2)q.lines.push([ex2+' '+_('extra guests','أشخاص زيادة'),ex2*SET.exD]);
  SET.addons.forEach(function(a){if(ST.adds[a.id]&&a.id!=='late'&&a.id!=='bf'){var c=a.per==='pp'?a.p*ST.guests:a.p;q.lines.push([_(a.en,a.ar),c])}});
 }
 q.sub=q.lines.reduce(function(s,l){return s+l[1]},0);q.dep=Math.round(q.sub*SET.deposit/100);q.ok=true;return q;
}
