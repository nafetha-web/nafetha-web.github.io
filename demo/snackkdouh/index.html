<style>
:root{--bg:#1b1411;--card:#261b16;--line:#3a2a22;--or:#ff8a00;--or2:#ffb347;--gr:#5fbf3b;--tx:#fff6ee;--mu:#c9b3a3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
header{text-align:center;padding:28px 16px 14px;background:radial-gradient(120% 90% at 50% 0,#3a2314,transparent 70%)}
header img{width:150px;height:auto}
header p{color:var(--mu);font-size:14px;margin-top:6px}
nav{position:sticky;top:0;z-index:5;background:rgba(27,20,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
nav a.on{background:var(--or);color:#1b1411;border-color:var(--or)}
main{max-width:640px;margin:0 auto;padding:0 14px}
section{padding-top:22px;scroll-margin-top:62px}
h2{font-size:22px;color:var(--or2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent);}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.it b{font-size:16px;display:block;direction:ltr;text-align:right}
.it small{display:block;color:var(--mu);font-size:13.5px;line-height:1.6;margin-top:4px}
.pr{flex:none;text-align:left;direction:ltr;font-weight:800;color:var(--gr);font-size:16px;white-space:nowrap}
.pr i{display:block;font-style:normal;font-size:11px;color:var(--mu);font-weight:600}
footer{text-align:center;color:var(--mu);font-size:13.5px;padding:28px 16px;line-height:1.9}
.wa{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;max-width:612px;margin:auto;background:#25d366;color:#052e16;font-weight:800;font-size:17px;text-align:center;text-decoration:none;padding:15px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:9}
</style>
</head>
<body>
<header>
<img src="logo.svg" alt="Snack Kdouh">
<p>حي السلّم · حدّ مدرسة الغزالة، قبالة صيدلية بازي</p>
</header>
<nav id="nav"></nav>
<main id="m"></main>
<footer>للطلب والاستفسار: <a href="https://wa.me/96170707343" style="color:var(--or2)" dir="ltr">70 707 343</a><br>الأسعار بالليرة اللبنانية</footer>
<a class="wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/96170707343?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%20%D8%B3%D9%86%D8%A7%D9%83%20%D9%82%D8%AF%D9%88%D8%AD%20%F0%9F%91%8B%20%D8%A8%D8%AF%D9%8A%20%D8%A3%D8%B7%D9%84%D8%A8%3A">اطلب عالواتساب</a>
<script>
const MENU=[
["برغر","burger",[
["Lebanese burger","قطعة لحمة، سلطة ملفوف، بطاطا، كاتشاب",300],
["Classic burger","قطعة لحمة، خس، بصل، بندورة، كبيس، تشيدر، مايو صوص",320],
["Chicken burger","قطعة دجاج، صوص تارتار، كبيس، خس، بندورة، بصل، موزريلا",350],
["Escalope burger","أسكالوب، توم، كبيس، بطاطا، سلطة مايونيز، كاتشاب",350],
["American burger","قطعة لحمة، خس، بصل مشوي، بندورة مشوية، تشيدر، شيبس، مايو صوص، باربكيو صوص",350],
["Fish burger","قطعتين كرسبي سمك، خس، كبيس، صوص تارتار، صوص كوكتيل",350],
["Zinger burger","صدر دجاج، حبش، مايو صوص، باربكيو، شيبس، كبيس، خس، تشدر",400]]],
["بلات","plate",[
["Fries small","",180],["Fries big","",280],
["Crispy plate 3 PCS","3 قطع كرسبي، سلطة ملفوف، توم، كبيس، بطاطا، صوص كوكتيل",450],
["Crispy plate 5 PCS","5 قطع كرسبي، سلطة ملفوف، توم، كبيس، بطاطا، صوص كوكتيل",650],
["Kamikaz plate","خبز فرنجي مع مايو صوص، موزريلا، بطاطا، كبيس، سلطة ملفوف، صوص كوكتيل",450],
["Combo extra","صوص كوكتيل، بطاطا",100]]],
["ساندويش","sandwich",[
["Batata sandwich","بطاطا، سلطة ملفوف، كبيس، ثوم، كاتشاب",250],
["Makanek sandwich","مقانق، مايونيز، خس، بندورة، كبيس، دبس رمان",300],
["Sojok sandwich","سجق، مايونيز، خس، بندورة، كبيس، دبس رمان",300],
["Chicken sab sandwich","دجاج، مايونيز، صويا، موزريلا، خس، ذرة، كبيس",350],
["Francisco sandwich","دجاج، مايونيز، صويا، موزريلا، خس، ذرة، كبيس",350],
["Crispy sandwich","دجاج، سلطة، ثوم، كبيس، بطاطا",350],
["Hot dog sandwich","هوت دوغ، خس، ذرة، كبيس، تشدر، باربكيو صوص، مايو صوص، تشيبس",350],
["Chicken fahita sandwich","دجاج، موزريلا، فليفلة ملونة، ذرة، أفوكادو صوص",400],
["Fajita shrimps sandwich","قريدس، فليفلة ملونة، موزريلا، ذرة، أفوكادو، صوص",450],
["Steak sandwich","شرائح لحمة، فطر، كريمة طبخ، مايو صوص، ذرة",500],
["Philadelphia sandwich","دجاج، موزريلا، فليفلة ملونة، ذرة، تشيدر، أفوكادو صوص",500]]],
["تروتيلا","trotiila",[
["Turkey & cheese sandwich","حبش مدخن، موزريلا، كبيس، ذرة، خس، تشيبس",300],
["Twister sandwich","دجاج، كبيس، بندورة، خس، مايو صوص، باربكيو صوص، تشدر صوص",350]]]
];
const f=n=>n+',000';
document.getElementById('m').innerHTML=MENU.map(([t,id,a])=>'<section id="'+id+'"><h2>'+t+'</h2>'+a.map(([n,d,p])=>'<div class="it"><div><b>'+n+'</b>'+(d?'<small>'+d+'</small>':'')+'</div><div class="pr">'+f(p)+'<i>ل.ل</i></div></div>').join('')+'</section>').join('');
const nav=document.getElementById('nav');
nav.innerHTML=MENU.map(([t,id])=>'<a href="#'+id+'" data-i="'+id+'">'+t+'</a>').join('');
const links=[...nav.children];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.dataset.i===e.target.id));const l=links.find(l=>l.dataset.i===e.target.id);l&&l.scrollIntoView({inline:'center',block:'nearest'})}}),{rootMargin:'-30% 0px -65% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>
