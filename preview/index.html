<style>
.tool { background: var(--mint-soft); padding-block: 56px 72px; position: relative; overflow: hidden }
.tool::before { content: ""; position: absolute; inset: -40% -10% auto auto; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(closest-side, rgba(226,176,74,.22), transparent); pointer-events: none }
.intro { max-width: 720px; margin-bottom: 34px; position: relative }
.intro h1 { font-size: clamp(32px, 5.4vw, 54px); color: var(--teal-deep) }
.intro h1 em { font-style: normal; color: var(--teal); background: linear-gradient(transparent 62%, rgba(226,176,74,.45) 62%) }
.intro p { color: var(--muted); font-size: 18.5px; margin-top: 12px }
.grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 40px; align-items: start; position: relative }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 28px } }

/* draft label + real sites */
.draft { display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 12px; padding: 8px 16px; border-radius: 999px; background: #FFF4D6; color: #7A5A12; font-weight: 700; font-size: 14px; border: 1px solid #F0DDA3 }
.stage { text-align: center }
.dev { text-align: initial }
.real { background: #FFFFFF }
.rgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px }
@media (max-width: 960px) { .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.rc { position: relative; display: block; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; background: #FFFFFF; transition: transform .2s, box-shadow .2s }
.rc:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -24px rgba(10,56,54,.5) }
.rc img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: top; background: var(--mint-soft) }
.rc div { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px }
.rc b { font-size: 16.5px }
.rc span { color: var(--teal); font-weight: 700; font-size: 14px }
.rc.on { border-color: var(--gold, #E2B04A); box-shadow: 0 0 0 3px rgba(226,176,74,.35) }
.rc em { position: absolute; top: 10px; inset-inline-start: 10px; font-style: normal; font-size: 12.5px; font-weight: 700; background: #E2B04A; color: #2b1e04; padding: 4px 10px; border-radius: 999px }
/* controls */
.ctl { background: #FFFFFF; border: 1px solid var(--line); border-radius: 24px; padding: 26px; box-shadow: 0 20px 40px -30px rgba(10,56,54,.35) }
@media (max-width: 520px) { .ctl { padding: 20px 18px } }
.q { padding-block: 16px; border-top: 1px dashed var(--line) }
.q:first-child { border: 0; padding-top: 0 }
.q:last-child { padding-bottom: 0 }
.q > label, .q > .lbl { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 10px; font-size: 16px }
.q .n { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #FFFFFF; display: grid; place-items: center; font-size: 13px; flex: none }
.q .opt { font-weight: 400; color: var(--muted); font-size: 13.5px; margin-inline-start: auto }
.in { width: 100%; border: 1.5px solid #C9D3D2; border-radius: 12px; padding: 12px 14px; min-height: 52px; background: #FFFFFF; font-size: 17px }
.in:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(14,77,74,.15) }
.secs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.sec { border: 1.5px solid var(--line); background: #FFFFFF; border-radius: 14px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .2s, background .2s; text-align: center; line-height: 1.3 }
.sec svg { color: var(--teal) }
.sec:hover { border-color: var(--mint) }
.sec[aria-pressed="true"] { border-color: var(--teal); background: var(--mint-soft); box-shadow: inset 0 0 0 1px var(--teal) }
.sws { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12) }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px var(--ink) }
.pick { position: relative; width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#E53935, #FDD835, #43A047, #1E88E5, #8E24AA, #E53935); overflow: hidden; cursor: pointer }
.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100% }
.pick[aria-pressed="true"] { box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px var(--ink) }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.seg button { border: 1.5px solid var(--line); background: #FFFFFF; border-radius: 14px; padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; font-size: 15px }
.seg button small { font-weight: 400; color: var(--muted); font-size: 12.5px }
.seg button .smp { font-size: 22px; line-height: 1.2 }
.seg button[aria-pressed="true"] { border-color: var(--teal); background: var(--mint-soft); box-shadow: inset 0 0 0 1px var(--teal) }
.up { display: flex; align-items: center; gap: 12px; border: 1.5px dashed #C9D3D2; border-radius: 14px; padding: 10px 14px; cursor: pointer; background: #FFFFFF }
.up input { display: none }
.up .ph { width: 44px; height: 44px; border-radius: 12px; background: var(--mint-soft); display: grid; place-items: center; color: var(--teal); flex: none; overflow: hidden }
.up .ph img { width: 100%; height: 100%; object-fit: contain }
.up span { font-size: 15px; color: var(--muted) }
.up b { color: var(--teal); font-weight: 600 }
.priv { font-size: 12.5px; color: var(--muted); margin-top: 6px }

/* stage */
.stage { display: flex; flex-direction: column; align-items: center; gap: 16px; position: sticky; top: 88px }
@media (max-width: 960px) { .stage { position: static } }
.views { display: inline-flex; background: #FFFFFF; border: 1px solid var(--line); border-radius: 999px; padding: 4px }
.views button { border: 0; background: transparent; font-weight: 600; font-size: 14.5px; min-height: 38px; padding: 0 16px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--muted) }
.views button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF }
.dev { position: relative; transition: width .4s }
.phone { width: 320px; height: 650px; background: #0B1F1E; border-radius: 46px; padding: 11px; box-shadow: 0 40px 70px -30px rgba(10,56,54,.55), 0 0 0 1px rgba(255,255,255,.06) inset; position: relative }
.phone::before { content: ""; position: absolute; top: 20px; left: 50%; width: 92px; height: 24px; margin-left: -46px; background: #0B1F1E; border-radius: 99px; z-index: 5 }
@media (max-width: 400px) { .phone { width: 290px; height: 590px } }
.screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #FFFFFF; position: relative; isolation: isolate }
.scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain }
.scroller::-webkit-scrollbar { display: none }
.laptop { width: min(640px, 100%) }
.laptop .lid { background: #0B1F1E; border-radius: 16px 16px 0 0; padding: 12px 12px 14px; box-shadow: 0 40px 70px -30px rgba(10,56,54,.55) }
.laptop .bar { height: 26px; background: #EEF2F1; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 6px; padding: 0 10px; direction: ltr }
.laptop .bar i { width: 9px; height: 9px; border-radius: 50%; background: #D0D7D6 }
.laptop .bar span { flex: 1; margin-inline: 10px; background: #FFFFFF; border-radius: 6px; font-size: 11px; color: var(--muted); padding: 1px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.laptop .dscr { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #FFFFFF; direction: ltr; border-radius: 0 0 4px 4px }
.laptop .dscr .scroller { width: 1200px; height: 750px; transform-origin: 0 0; inset: auto; top: 0; left: 0 }
.laptop .base { height: 16px; background: linear-gradient(#cfd8d7, #a9b6b4); border-radius: 0 0 18px 18px; width: 112%; margin-inline-start: -6%; position: relative }
.laptop .base::after { content: ""; position: absolute; top: 0; left: 50%; width: 90px; margin-left: -45px; height: 6px; background: #9aa8a6; border-radius: 0 0 8px 8px }
.hint { font-size: 13.5px; color: var(--muted) }
.building { position: absolute; inset: 0; z-index: 20; background: rgba(255,255,255,.94); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; color: var(--teal-deep); font-weight: 600 }
.building.on { display: flex }
.building .ring { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--mint); border-top-color: var(--teal); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* result actions */
.act { width: 100%; max-width: 520px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 10px }
.act .btn { width: 100% }
.act .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.act .row .btn { min-height: 46px; font-size: 15px; padding: 0 12px }
.act p { font-size: 13.5px; color: var(--muted); text-align: center }
.jump { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 140%); z-index: 45; display: none; align-items: center; gap: 10px; background: var(--teal-deep); color: #FFFFFF; border: 0; border-radius: 999px; padding: 0 20px 0 8px; min-height: 52px; font-weight: 700; font-size: 15.5px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.5); transition: transform .35s; cursor: pointer }
.jump i { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85) }
@media (max-width: 960px) { .jump { display: inline-flex } body.inctl .jump { transform: translate(-50%, 0) } body.intool .wafloat { opacity: 0; pointer-events: none } }
.wafloat { transition: opacity .3s }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: #FFFFFF; padding: 10px 18px; border-radius: 999px; font-size: 15px; opacity: 0; transition: .3s; z-index: 60; pointer-events: none }
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* what you get */
.get { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
@media (max-width: 860px) { .get { grid-template-columns: minmax(0, 1fr) } }
.get div { border: 1.5px solid var(--line); border-radius: 22px; padding: 26px }
.get b { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--mint-soft); color: var(--teal); font-family: var(--display); font-size: 22px; margin-bottom: 14px }
.get h3 { font-family: var(--body); font-size: 19px; font-weight: 700 }
.get p { color: var(--muted); font-size: 15.5px; margin-top: 6px }
.offer { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; background: var(--teal); color: #FFFFFF; border-radius: 22px; padding: 24px 28px }
.offer p { font-size: 17px; max-width: 40em }
.offer b { color: var(--gold) }

/* ============ mini site (the generated preview) ============ */
.ms { --c: #0E4D4A; --ci: #FFFFFF; --cs: #EEF5F4; --rad: 14px; --hf: 'IBM Plex Sans Arabic', sans-serif; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif; color: #1d1d1f; background: #FFFFFF; min-height: 100%; font-size: 14px; line-height: 1.6; container-type: inline-size; position: relative; padding-bottom: 10px }
.ms * { box-sizing: border-box }
.ms h1, .ms h2, .ms h3 { font-family: var(--hf); margin: 0; line-height: 1.25 }
.ms p { margin: 0 }
.ms a { text-decoration: none; color: inherit }
.ms-nav { display: flex; align-items: center; gap: 9px; padding: 40px 16px 12px; position: relative; z-index: 3 }
.ms-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--c); color: var(--ci); display: grid; place-items: center; font-family: var(--hf); font-weight: 700; font-size: 17px; flex: none; overflow: hidden }
.ms-logo img { width: 100%; height: 100%; object-fit: contain; background: #FFFFFF }
.ms-nav b { font-family: var(--hf); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.ms-links { display: none; gap: 22px; margin-inline-start: auto; font-size: 14px; opacity: .8 }
.ms-lang { margin-inline-start: auto; font-size: 11px; font-weight: 700; border: 1px solid rgba(0,0,0,.15); border-radius: 99px; padding: 1px 8px }
.ms-burger { width: 18px; height: 12px; border-block: 2px solid currentColor; position: relative; flex: none }
.ms-burger::after { content: ""; position: absolute; left: 0; right: 0; top: 3px; border-top: 2px solid currentColor }
.ms-hero { position: relative; margin: 0 12px; border-radius: var(--rad); overflow: hidden; min-height: 330px; display: flex; align-items: flex-end; color: #FFFFFF }
.ms-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.ms-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 20%, rgba(0,0,0,.72)) }
.ms-hx { position: relative; z-index: 1; padding: 18px }
.ms-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.18); backdrop-filter: blur(6px); border-radius: 99px; padding: 3px 10px; margin-bottom: 8px }
.ms-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3BD16F }
.ms-hero h1 { font-size: 30px; word-break: break-word }
.ms-hero p { opacity: .9; margin-top: 6px; font-size: 14.5px }
.ms-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px }
.ms-cta a { padding: 9px 16px; border-radius: calc(var(--rad) * .7); font-weight: 700; font-size: 13.5px }
.ms-cta .p { background: var(--c); color: var(--ci) }
.ms-cta .s { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.5) }
.ms-quick { display: flex; gap: 8px; padding: 14px 12px 4px; overflow: hidden }
.ms-quick span { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; background: var(--cs); border-radius: calc(var(--rad) * .8); padding: 9px 4px; font-size: 11.5px; font-weight: 600; line-height: 1.3 }
.ms-quick svg { color: var(--c) }
.ms-sec { padding: 20px 14px 6px }
.ms-sec h2 { font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px }
.ms-sec h2::after { content: ""; flex: 1; height: 2px; background: var(--cs); border-radius: 2px }
.ms-grid { display: grid; gap: 10px }
.ms-card { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; align-items: center; border: 1px solid #EEE; border-radius: var(--rad); padding: 8px; background: #FFFFFF }
.ms-card img { width: 86px; height: 70px; object-fit: cover; border-radius: calc(var(--rad) * .7) }
.ms-card b { display: block; font-size: 14.5px }
.ms-card small { color: #777; font-size: 12px; display: block }
.ms-card .pr { color: var(--c); font-weight: 700; font-size: 13.5px; margin-top: 2px; display: inline-block }
.ms-list { border: 1px solid #EEE; border-radius: var(--rad); overflow: hidden }
.ms-list div { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px dashed #E6E6E6 }
.ms-list div:first-child { border: 0 }
.ms-list b { font-weight: 600 }
.ms-list span { color: var(--c); font-weight: 700 }
.ms-band { margin: 18px 12px 0; background: var(--c); color: var(--ci); border-radius: var(--rad); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start }
.ms-band b { font-family: var(--hf); font-size: 17px; line-height: 1.35 }
.ms-band a { background: #25D366; color: #08361A; font-weight: 700; padding: 8px 14px; border-radius: 99px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center }
.ms-foot { text-align: center; font-size: 11px; color: #888; padding: 16px 10px 6px }
.ms-wa { position: sticky; bottom: 14px; margin-inline-start: calc(100% - 58px); width: 44px; height: 44px; border-radius: 50%; background: #25D366; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.25); z-index: 4; margin-top: -44px }
.ms-wa svg { width: 22px; fill: #FFFFFF }
/* style: luxury */
.ms.s-lux { background: #121212; color: #F3EEE6; --hf: 'El Messiri', serif; --rad: 3px }
.ms.s-lux .ms-lang { border-color: rgba(255,255,255,.3) }
.ms.s-lux .ms-hero { margin: 0; border-radius: 0; min-height: 360px; align-items: center; justify-content: center; text-align: center }
.ms.s-lux .ms-hero::after { background: linear-gradient(180deg, rgba(10,10,10,.45), rgba(10,10,10,.85)) }
.ms.s-lux .ms-hx { display: flex; flex-direction: column; align-items: center; padding: 26px 22px }
.ms.s-lux .ms-hero h1 { font-size: 34px; letter-spacing: .01em }
.ms.s-lux .ms-hero h1::after { content: ""; display: block; width: 46px; height: 2px; background: var(--c); margin: 10px auto 0 }
.ms.s-lux .ms-badge { background: transparent; border: 1px solid rgba(255,255,255,.35) }
.ms.s-lux .ms-cta { justify-content: center }
.ms.s-lux .ms-cta .s { background: transparent }
.ms.s-lux .ms-quick span { background: #1d1d1d; color: #E9E2D6 }
.ms.s-lux .ms-card, .ms.s-lux .ms-list { background: #1a1a1a; border-color: #2a2a2a }
.ms.s-lux .ms-list div { border-color: #2c2c2c }
.ms.s-lux .ms-card small { color: #9a958c }
.ms.s-lux .ms-sec h2 { justify-content: center; text-align: center }
.ms.s-lux .ms-sec h2::after, .ms.s-lux .ms-sec h2::before { content: ""; flex: 1; height: 1px; background: #333 }
.ms.s-lux .ms-card .pr, .ms.s-lux .ms-list span, .ms.s-lux .ms-quick svg { color: var(--cl) }
.ms.s-lux .ms-foot { color: #777 }
/* style: playful */
.ms.s-fun { --hf: 'Lalezar', 'IBM Plex Sans Arabic', sans-serif; --rad: 24px; background: var(--cs) }
.ms.s-fun .ms-hero { background: var(--c); color: var(--ci); flex-direction: column; align-items: stretch; min-height: 0; padding-bottom: 0 }
.ms.s-fun .ms-hero::after { display: none }
.ms.s-fun .ms-hero > img { position: relative; inset: auto; height: 190px; width: calc(100% - 24px); margin: 0 12px 12px; border-radius: 20px; order: 2; border: 4px solid rgba(255,255,255,.7) }
.ms.s-fun .ms-hx { padding: 20px 18px 12px }
.ms.s-fun .ms-hero h1 { font-size: 34px; font-weight: 400 }
.ms.s-fun .ms-hero h2, .ms.s-fun .ms-sec h2 { font-weight: 400 }
.ms.s-fun .ms-hero .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); z-index: 0 }
.ms.s-fun .ms-badge { background: rgba(255,255,255,.22) }
.ms.s-fun .ms-cta .p { background: #FFFFFF; color: var(--c) }
.ms.s-fun .ms-cta .s { border-color: currentColor; background: transparent }
.ms.s-fun .ms-quick span { background: #FFFFFF }
.ms.s-fun .ms-card { transform: rotate(-.6deg); box-shadow: 0 6px 0 rgba(0,0,0,.05) }
.ms.s-fun .ms-card:nth-child(2) { transform: rotate(.6deg) }
.ms.s-fun .ms-sec h2::after { background: #FFFFFF }
/* wide (desktop) layout of the mini site */
@container (min-width: 760px) {
  .ms { font-size: 16px }
  .ms-nav { padding: 22px 48px }
  .ms-nav b { font-size: 20px }
  .ms-logo { width: 42px; height: 42px }
  .ms-links { display: flex }
  .ms-lang { margin-inline-start: 18px }
  .ms-burger { display: none }

let lang = 'ar';
try { const s = localStorage.getItem('nafetha-lang'); if (s === 'ar' || s === 'en') lang = s } catch (e) {}
const st = { name: '', sec: 'rest', color: S.rest.c, custom: false, style: 'modern', logo: '', view: 'phone' };
// read shared link / sector pages
(() => { const p = new URLSearchParams(location.search);
  if (S[p.get('s')]) { st.sec = p.get('s'); st.color = S[st.sec].c }
  if (/^#?[0-9a-fA-F]{6}$/.test(p.get('c') || '')) { st.color = '#' + p.get('c').replace('#', ''); st.custom = true }
  if (['modern', 'lux', 'fun'].includes(p.get('st'))) st.style = p.get('st');
  if (p.get('n')) st.name = p.get('n').slice(0, 28);
  if (p.get('l') === 'en' || p.get('l') === 'ar') lang = p.get('l');
})();
const L = (pair) => Array.isArray(pair) ? pair[lang === 'ar' ? 0 : 1] : pair;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const lum = (h) => { const [r, g, b] = hex(h).map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4) }); return .2126 * r + .7152 * g + .0722 * b };
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');

function siteHTML() {
  const t = T[lang], s = S[st.sec], c = st.color;
  const name = esc(st.name.trim() || L(s.n));
  const ink = lum(c) > .45 ? '#1d1d1f' : '#FFFFFF';
  const soft = mix(c, '#FFFFFF', .88), light = mix(c, '#FFFFFF', .45);
  const logo = st.logo ? '<img src="' + st.logo + '" alt="">' : esc((st.name.trim() || L(s.n)).replace(/^(ال|مطعم |مقهى |عيادة |صالون |نادي |كاراج |بيت )/, '').charAt(0) || 'N');
  const items = s.list
    ? '<div class="ms-list">' + s.it.map((i) => '<div><b>' + L(i) + '</b><span>' + i[2] + '</span></div>').join('') + '</div>'
    : '<div class="ms-grid">' + s.it.map((i, k) => '<div class="ms-card"><img src="img/' + st.sec + '-' + (k + 1) + '.webp" alt="" loading="lazy"><div><b>' + L(i) + '</b>' + (Array.isArray(i[2]) ? '<small>' + L(i[2]) + '</small>' : '<span class="pr">' + i[2] + '</span>') + '</div></div>').join('') + '</div>';
  const blobs = st.style === 'fun' ? '<i class="blob" style="width:160px;height:160px;top:-50px;inset-inline-end:-40px"></i><i class="blob" style="width:90px;height:90px;bottom:120px;inset-inline-start:-30px"></i>' : '';
  return '<div class="ms s-' + st.style + '" dir="' + t.dir + '" style="--c:' + c + ';--ci:' + ink + ';--cs:' + soft + ';--cl:' + light + '">' +
    '<div class="ms-nav"><div class="ms-logo">' + logo + '</div><b>' + name + '</b><div class="ms-links">' + t.links.map((x) => '<span>' + x + '</span>').join('') + '</div><span class="ms-lang">' + (lang === 'ar' ? 'EN' : 'ع') + '</span><i class="ms-burger"></i></div>' +
    '<div class="ms-hero">' + blobs + '<img src="img/' + st.sec + '-0.webp" alt=""><div class="ms-hx"><span class="ms-badge">' + L(s.q[0].slice(1)) + '</span><h1>' + name + '</h1><p>' + L(s.tag) + '</p><div class="ms-cta"><a class="p">' + L(s.cta[0]) + '</a><a class="s">' + L(s.cta[1]) + '</a></div></div></div>' +
    '<div class="ms-quick">' + s.q.map((q) => '<span>' + ico(q[0], 18) + L(q.slice(1)) + '</span>').join('') + '</div>' +
    '<div class="ms-sec"><h2>' + L(s.sec) + '</h2>' + items + '</div>' +
    '<div class="ms-band"><b>' + L(s.band) + '</b><a>' + t.wa + '</a></div>' +
    '<div class="ms-foot">© ' + name + ' · ' + t.made + '</div><div class="ms-wa">' + WAICON + '</div></div>';
}

let building = 0;
function paint(anim) {
  const dev = $('dev'), t = T[lang];
  if (!dev.firstChild || dev.dataset.view !== st.view) {
    dev.dataset.view = st.view;
    dev.className = 'dev ' + (st.view === 'phone' ? '' : 'laptop');
    dev.innerHTML = st.view === 'phone'
      ? '<div class="phone"><div class="screen"><div class="scroller" id="sc"></div><div class="building" id="bld"><i class="ring"></i><span id="bldT"></span></div></div></div>'
      : '<div class="lid"><div class="bar"><i></i><i></i><i></i><span id="url"></span></div><div class="dscr" id="dscr"><div class="scroller" id="sc"></div><div class="building" id="bld"><i class="ring"></i><span id="bldT"></span></div></div></div><div class="base"></div>';
    fit();
  }
  const sc = $('sc'), top = sc.scrollTop;
  const done = () => { sc.innerHTML = siteHTML(); sc.scrollTop = anim ? 0 : top; if ($('url')) $('url').textContent = slug() + '.nafetha.com'; };
  if (anim) {
    const b = $('bld'), my = ++building; b.classList.add('on'); let i = 0; $('bldT').textContent = t.building[0];
    const iv = setInterval(() => { i++; if (i < 3) $('bldT').textContent = t.building[i] }, 260);
    setTimeout(() => { clearInterval(iv); if (my !== building) return; done(); b.classList.remove('on') }, 800);
  } else done();
  updateLinks();
}
function fit() { const d = $('dscr'); if (!d) return; const k = d.clientWidth / 1200; d.querySelector('.scroller').style.transform = 'scale(' + k + ')'; d.querySelector('.scroller').style.height = (d.clientHeight / k) + 'px' }
addEventListener('resize', fit);
function slug() { const n = (st.name.trim() || L(S[st.sec].n)); const a = n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); return a || ({ rest: 'restaurant', cafe: 'cafe', clinic: 'clinic', salon: 'salon', gym: 'gym', office: 'company', build: 'contracting', garage: 'garage', gift: 'gifts' })[st.sec] }
function shareURL() { const p = new URLSearchParams({ s: st.sec, c: st.color.slice(1), st: st.style, l: lang }); if (st.name.trim()) p.set('n', st.name.trim()); return location.origin + location.pathname + '?' + p }
function updateLinks() {
  const t = T[lang], s = S[st.sec], sty = STYLES.find((x) => x[0] === st.style);
  $('aWant').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waMsg({ n: st.name.trim() || '-', s: L(s.name), c: st.color, st: lang === 'ar' ? sty[1] : sty[2], u: shareURL() }));
  $('aDemo').href = s.demo; $('aDemo').textContent = t.demo(L(s.name));
  try { history.replaceState(null, '', '?' + shareURL().split('?')[1]) } catch (e) {}
}

const REAL = [['rest', 'rayhan'], ['clinic', 'ibtisama'], ['salon', 'lamsa'], ['gym', 'pulse'], ['office', 'mizan'], ['build', 'asas'], ['garage', 'pitstop'], ['gift', 'artisan']];
function renderReal() {
  const t = T[lang], cur = st.sec === 'cafe' ? 'rest' : st.sec;
  $('rgrid').innerHTML = REAL.map(([k, d]) => '<a class="rc' + (k === cur ? ' on' : '') + '" href="../demo/' + d + '/" target="_blank" rel="noopener">' + (k === cur ? '<em>' + t.realNear + '</em>' : '') + '<img src="real/' + d + '.webp" alt="' + esc(L(S[k].name)) + '" loading="lazy"><div><b>' + esc(L(S[k].name)) + '</b><span>' + t.realOpen + '</span></div></a>').join('');
  $('draft').textContent = t.draft;
}
function controls() {
  renderReal();
  const t = T[lang];
  $('secs').innerHTML = ORDER.map((k) => '<button type="button" class="sec" data-k="' + k + '" aria-pressed="' + (k === st.sec) + '">' + ico(k, 22) + '<span>' + L(S[k].name) + '</span></button>').join('');
  $('secs').querySelectorAll('.sec').forEach((b) => b.onclick = () => { if (st.sec === b.dataset.k) return; st.sec = b.dataset.k; if (!st.custom) st.color = S[st.sec].c; controls(); paint(true); window.nfOnce && nfOnce('sec', 'PreviewSector', { sector: st.sec }, true) });
  $('sws').innerHTML = COLORS.map((c) => '<button type="button" class="sw" style="background:' + c + '" data-c="' + c + '" aria-label="' + c + '" aria-pressed="' + (c.toLowerCase() === st.color.toLowerCase()) + '"></button>').join('') +
    '<label class="pick" aria-pressed="' + !COLORS.map((x) => x.toLowerCase()).includes(st.color.toLowerCase()) + '" title="+"><input type="color" id="iColor" value="' + st.color + '"></label>';
  $('sws').querySelectorAll('.sw').forEach((b) => b.onclick = () => { st.color = b.dataset.c; st.custom = true; controls(); paint() });
  $('iColor').oninput = (e) => { st.color = e.target.value; st.custom = true; paint() };
  $('iColor').onchange = () => controls();
  $('styles').innerHTML = STYLES.map((x) => '<button type="button" data-k="' + x[0] + '" aria-pressed="' + (x[0] === st.style) + '"><span class="smp" style="font-family:' + (x[0] === 'lux' ? "'El Messiri',serif" : x[0] === 'fun' ? "'Lalezar',sans-serif" : "'IBM Plex Sans Arabic',sans-serif") + '">' + (lang === 'ar' ? 'أب' : 'Aa') + '</span>' + (lang === 'ar' ? x[1] : x[2]) + '<small>' + (lang === 'ar' ? x[3] : x[4]) + '</small></button>').join('');
  $('styles').querySelectorAll('button').forEach((b) => b.onclick = () => { if (st.style === b.dataset.k) return; st.style = b.dataset.k; controls(); paint(true) });
  $('iName').placeholder = L(S[st.sec].n);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir; document.title = t.title;
  document.querySelectorAll('[data-t]').forEach((e) => { const v = t[e.dataset.t]; if (typeof v === 'string') e.textContent = v });
  $('h1').innerHTML = t.h1; $('langBtn').textContent = t.langBtn; $('offerTxt').innerHTML = t.offer;
  $('get').innerHTML = t.get.map((g, i) => '<div class="rv in"><b>' + (i + 1) + '</b><h3>' + g[0] + '</h3><p>' + g[1] + '</p></div>').join('');
  $('waFloat').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(lang === 'ar' ? 'مرحبًا نافذة، لديّ سؤال عن موقع لنشاطي.' : 'Hello Nafetha, I have a question about a website for my business.');
  controls(); paint();
}
$('iName').value = st.name;
let nt; $('iName').addEventListener('input', (e) => { st.name = e.target.value; clearTimeout(nt); nt = setTimeout(() => { paint(); window.nfOnce && nfOnce('name', 'PreviewBuilt', { sector: st.sec }, true) }, 120) });
$('iLogo').addEventListener('change', (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { st.logo = r.result; $('logoPh').innerHTML = '<img src="' + r.result + '" alt="">'; paint() }; r.readAsDataURL(f) });
$('vPhone').onclick = () => { st.view = 'phone'; $('vPhone').setAttribute('aria-pressed', 'true'); $('vDesk').setAttribute('aria-pressed', 'false'); paint() };
$('vDesk').onclick = () => { st.view = 'desk'; $('vDesk').setAttribute('aria-pressed', 'true'); $('vPhone').setAttribute('aria-pressed', 'false'); paint() };
$('aCopy').onclick = async () => { const u = shareURL(); try { await navigator.clipboard.writeText(u) } catch (e) { const i = document.createElement('input'); i.value = u; document.body.appendChild(i); i.select(); try { document.execCommand('copy') } catch (x) {} i.remove() } const to = $('toast'); to.textContent = T[lang].copied; to.classList.add('on'); setTimeout(() => to.classList.remove('on'), 1800) };
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('nafetha-lang', lang) } catch (e) {} render() };
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .12 });
document.querySelectorAll('.rv').forEach((e) => io.observe(e));
// mobile: pill that jumps from the controls down to the phone
const stageEl = document.querySelector('.stage'); let ctlVis = false, stageVis = false;
const upd = () => document.body.classList.toggle('inctl', ctlVis && !stageVis);
new IntersectionObserver((es) => { es.forEach((e) => { if (e.target === stageEl) stageVis = e.intersectionRatio > .35; else ctlVis = e.isIntersecting }); upd() }, { threshold: [0, .35] }).observe(stageEl);
new IntersectionObserver((es) => { ctlVis = es[0].isIntersecting; upd() }).observe($('ctl'));
new IntersectionObserver((es) => document.body.classList.toggle('intool', es[0].isIntersecting)).observe(document.querySelector('.tool'));
$('jump').onclick = () => stageEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
const _paint = paint; paint = function (a) { _paint(a); $('jumpSw').style.background = st.color };
render();
</script>
