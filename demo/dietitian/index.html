<style>
:root{--t:#0f5c5a;--t2:#0b4745;--t3:#e3f1ef;--c:#ef7b5b;--c2:#d9633f;--ink:#1b2a29;--mut:#5d6f6d;--line:#e3e8e4;--bg:#fbf8f2;--card:#fff;--sh:0 8px 28px rgba(15,92,90,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,system-ui,-apple-system,"Noto Sans Arabic",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:40;background:rgba(251,248,242,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--t)}

.sp{flex:1}
nav a{padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px;color:var(--mut)}nav a:hover{color:var(--t);background:var(--t3)}

.sh{margin-bottom:26px}.sh h2{font-size:30px;font-weight:800}.sh p{color:var(--mut);margin-top:4px}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.num{width:38px;height:38px;border-radius:50%;background:var(--t);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.band{background:var(--t);color:#fff;border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.band h2{font-size:28px}.band p{color:#cfe8e5}
/* wizard */
.wz{max-width:720px;margin:34px auto 70px;padding:0 20px}
.prog{height:8px;background:#e7ece8;border-radius:10px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--c);border-radius:10px;transition:.3s}
.pc{font-size:13px;color:var(--mut);margin-bottom:18px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh)}
.card h2{font-size:25px;margin-bottom:4px}.card .sub{color:var(--mut);margin-bottom:20px}
.f{margin-bottom:16px}.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--t);box-shadow:0 0 0 3px rgba(15,92,90,.12)}
.f small{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts{display:grid;gap:10px}.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.op{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;text-align:start;background:#fff;display:flex;gap:10px;align-items:center;transition:.12s}
.op small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.op .em{font-size:24px}
.op.on{border-color:var(--t);background:var(--t3);box-shadow:0 0 0 2px rgba(15,92,90,.15)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.err{color:#c0392b;font-weight:600;font-size:14px;margin-top:8px;min-height:20px}
.note{background:#fff7ec;border:1px solid #f3dfc0;color:#7a5316;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
/* result */
.rs{max-width:900px;margin:30px auto 70px;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--t)}.stat span{font-size:13px;color:var(--mut)}
.macro{display:flex;height:14px;border-radius:10px;overflow:hidden;margin:8px 0}
.macro i{display:block}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}
.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
.meal{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border:0}.meal h4{color:var(--t)}.meal p{white-space:pre-line}
.alert{background:#fff2ef;border:1.5px solid #f4c3b6;border-radius:18px;padding:20px;margin:18px 0}
.alert h3{color:#a8402a;margin-bottom:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.disc{font-size:13px;color:var(--mut);margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
/* admin */
.ad{max-width:1000px;margin:30px auto 70px;padding:0 20px}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{padding:9px 18px;border-radius:30px;font-weight:700;background:#fff;border:1.5px solid var(--line)}.tabs button.on{background:var(--t);color:#fff;border-color:var(--t)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;flex-wrap:wrap}
.row small{color:var(--mut)}
.tag{display:inline-block;background:var(--t3);color:var(--t);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-inline-end:4px}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;margin:0}
.chk input{width:auto;accent-color:var(--t)}
.mrow{display:grid;grid-template-columns:150px 1fr 1fr 40px;gap:8px;margin-bottom:8px}
.mrow input,.mrow textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
footer{background:#0b3b39;color:#a9cdca;padding:30px 0;margin-top:30px;font-size:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#1b2a29;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;padding:40px 20px}.hero h1{font-size:32px}.plate{max-width:220px}.g3,.g4{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:1fr 1fr}nav{display:none}.mrow{grid-template-columns:1fr 1fr}.meal{grid-template-columns:1fr}.two,.opts.c2{grid-template-columns:1fr}.band{padding:26px}}
@media print{header,footer,.acts,.nav,.noprint,.toast{display:none!important}body{background:#fff}.rs{margin:0}.card{box-shadow:none}}
</style>
</head>

nav_home:{ar:'الرئيسية',en:'Home'},nav_plan:{ar:'خطتي',en:'My plan'},nav_contact:{ar:'تواصل',en:'Contact'},cta_s:{ar:'ابدأ',en:'Start'},admin:{ar:'دخول الأخصائي',en:'Dietitian login'},
foot:{ar:'© جميع الحقوق محفوظة',en:'© All rights reserved'},
}

var $=function(s){return document.querySelector(s)};

var SEED=[
{id:'p1',name:{ar:'خطة تنقيص خفيفة 1400',en:'Light Weight-Loss 1400'},goal:'lose',kcal:1400,tags:[],veg:false,meals:[

 M('سناك','Snack','حبة فاكهة + 10 لوزات','1 fruit + 10 almonds'),
 M('الغدا','Lunch','120غ صدر دجاج مشوي + نصف كوب رز بني + سلطة كبيرة','120g grilled chicken + ½ cup brown rice + large salad'),
 M('العشا','Dinner','لبنة خفيفة + خضار مشوية + رغيف صغير','Light labneh + grilled vegetables + small bread')]},
{id:'p2',name:{ar:'خطة تنقيص متوازنة 1600 (٤ وجبات)',en:'Balanced Weight-Loss 1600 (4 meals)'},goal:'lose',kcal:1600,tags:[],veg:false,meals:[
 M('الفطور','Breakfast','نصف كوب شوفان بالحليب + موزة صغيرة + ملعقة زبدة فول سوداني','½ cup oats with milk + small banana + 1 tsp peanut butter'),
 M('سناك','Snack','لبن زبادي + خيارة','Plain yogurt + cucumber'),
 M('الغدا','Lunch','150غ سمك مشوي + كوب برغل + سلطة','150g grilled fish + 1 cup bulgur + salad'),
 M('العشا','Dinner','تونا مع خضار + رغيف أسمر صغير','Tuna with vegetables + small whole-wheat bread')]},
{id:'p3',name:{ar:'خطة نباتية للتنقيص 1500',en:'Vegetarian Weight-Loss 1500'},goal:'lose',kcal:1500,tags:['dairy'],veg:true,meals:[
 M('الفطور','Breakfast','جبنة قريش + خبز أسمر + خضار','Cottage cheese + whole-wheat bread + vegetables'),
 M('سناك','Snack','فاكهة + حفنة جوز','Fruit + handful of walnuts'),
 M('الغدا','Lunch','كوب عدس + نصف كوب رز + سلطة','1 cup lentils + ½ cup rice + salad'),
 M('العشا','Dinner','شوربة خضار + بيضتين','Vegetable soup + 2 eggs')]},
{id:'p4',name:{ar:'خطة زيادة وزن صحية 2500',en:'Healthy Weight-Gain 2500'},goal:'gain',kcal:2500,tags:['gluten','dairy','nuts'],veg:false,meals:[
 M('الفطور','Breakfast','3 بيضات + رغيفين + حبة أفوكادو + كوب حليب','3 eggs + 2 breads + 1 avocado + glass of milk'),
 M('سناك 1','Snack 1','سموذي موز + شوفان + زبدة فول سوداني','Banana-oat-peanut butter smoothie'),
 M('الغدا','Lunch','200غ لحم أو دجاج + كوب ونصف رز + خضار بزيت الزيتون','200g meat or chicken + 1½ cups rice + vegetables with olive oil'),
 M('سناك 2','Snack 2','مكسرات + تمر + لبن','Nuts + dates + yogurt'),
 M('العشا','Dinner','ساندويش دجاج بخبز أسمر + فاكهة','Chicken sandwich on whole-wheat + fruit')]},
{id:'p5',name:{ar:'خطة ثبات الوزن 2000',en:'Weight Maintenance 2000'},goal:'maintain',kcal:2000,tags:['gluten','dairy'],veg:false,meals:[
 M('الفطور','Breakfast','لبنة + زيتون + بندورة + رغيف','Labneh + olives + tomato + bread'),
 M('الغدا','Lunch','دجاج مشوي + رز + سلطة','Grilled chicken + rice + salad'),
 M('سناك','Snack','فاكهة + مكسرات','Fruit + nuts'),
 M('العشا','Dinner','سمك أو تونا + خضار مطبوخة','Fish or tuna + cooked vegetables')]}];
function plans(){var p=ld('dc_plans',null);if(!p){p=SEED;sv('dc_plans',p)}return p}
/* ---------- calculations ---------- */
function calc(S){
 var w=+S.weight,h=+S.height,a=+S.age,m=S.sex==='m';
 var bmi=w/Math.pow(h/100,2);
 var bmr=10*w+6.25*h-5*a+(m?5:-161);
 var af={sed:1.2,light:1.375,mod:1.55,high:1.725}[S.act]||1.2;
 var tdee=bmr*af,t=tdee;
 if(S.goal==='lose')t=tdee*0.8;if(S.goal==='gain')t=tdee*1.15;
 var floor=m?1500:1200;if(S.goal==='lose')t=Math.max(t,floor);
 t=Math.round(t/50)*50;tdee=Math.round(tdee/50)*50;
 var p=Math.round(w*(S.goal==='gain'?1.8:1.6)),f=Math.round(t*0.28/9),c=Math.round((t-p*4-f*9)/4);
 var wk=S.goal==='maintain'?0:Math.abs(+S.target-w);
 var perWeek=S.goal==='lose'?0.5:0.35;
 return{bmi:bmi,bmr:Math.round(bmr),tdee:tdee,kcal:t,p:p,f:f,c:Math.max(c,50),weeks:Math.ceil(wk/perWeek),diff:+(S.target-w)}
}
function flags(S,R){
 var f=[];
 if(+S.age<18)f.push({ar:'العمر أقل من 18 سنة: خطط التغذية للأطفال والمراهقين لازم تنعمل مع الأخصائي مباشرة.',en:'Under 18: nutrition plans for children and teens must be made directly with the dietitian.'});
 if(+S.age>75)f.push({ar:'العمر فوق 75 سنة: لازم مراجعة الأخصائي.',en:'Over 75: dietitian review is required.'});
 if(S.preg)f.push({ar:'الحمل أو الرضاعة: الاحتياجات الغذائية خاصة وبتحتاج متابعة الأخصائي.',en:'Pregnancy or breastfeeding: needs are special and require the dietitian.'});
 if(S.cond.length)f.push({ar:'عندك حالة صحية ('+S.cond.map(function(c){return COND[c][0]}).join('، ')+'): الخطة لازم تتفصّل لحالتك مع الأخصائي.',en:'You reported a health condition ('+S.cond.map(function(c){return COND[c][1]}).join(', ')+'): your plan must be tailored by the dietitian.'});
 if(R.bmi<18.5&&S.goal==='lose')f.push({ar:'وزنك الحالي أقل من الطبيعي، وما منقدر نعطيك خطة تنقيص.',en:'Your current weight is below normal, so we cannot offer a weight-loss plan.'});
 var tb=+S.target/Math.pow(+S.height/100,2);
 if(S.goal!=='maintain'&&(tb<18.5||tb>32))f.push({ar:'الوزن المطلوب مش ضمن المدى الصحي. بنحتاج نحدد هدف مناسب مع الأخصائي.',en:'Your target weight is outside a healthy range. Let us set a suitable goal with the dietitian.'});
 if(S.history)f.push({ar:'ذكرت إنو عندك تاريخ مع اضطرابات الأكل: لازم متابعة مختص.',en:'You mentioned a history with eating disorders: specialist follow-up is required.'});
 return f;
}
var COND={diabetes:['سكري','Diabetes'],pressure:['ضغط','High blood pressure'],heart:['قلب','Heart disease'],kidney:['كلى','Kidney disease'],thyroid:['غدة درقية','Thyroid'],liver:['كبد','Liver disease'],pcos:['تكيّس المبايض','PCOS'],other:['حالة أخرى','Other condition']};
function match(S,R){
 var P=plans().filter(function(p){return p.goal===S.goal});
 P=P.filter(function(p){
  if(S.diet==='veg'&&!p.veg)return false;
  return !p.tags.some(function(g){return S.allergy.indexOf(g)>-1})});
 if(!P.length)return null;
 P.forEach(function(p){p._s=Math.abs(p.kcal-R.kcal)+Math.abs(p.meals.length-S.meals)*120});
 P.sort(function(a,b){return a._s-b._s});
 return P[0].kcal&&Math.abs(P[0].kcal-R.kcal)<=450?P[0]:P[0];
}

var S0={goal:'',sex:'',age:'',height:'',weight:'',target:'',act:'',meals:3,wake:'',diet:'any',allergy:[],dislike:'',cond:[],preg:false,history:false,notes:'',name:'',phone:''};
var S=ld('dc_state',null)||JSON.parse(JSON.stringify(S0)),step=0;

var STEPS=['goal','body','act','meals','food','health','contact'];

function inp(k,lab,type,ph,small){return'<div class="f"><label>'+(L==='ar'?lab[0]:lab[1])+'</label><input data-i="'+k+'" type="'+(type||'text')+'" inputmode="'+(type==='number'?'decimal':'text')+'" value="'+esc(S[k])+'" placeholder="'+esc(ph||'')+'">'+(small?'<small>'+(L==='ar'?small[0]:small[1])+'</small>':'')+'</div>'}
function stepHtml(s){

function valid(s){
 var ar=L==='ar';
 if(s==='goal'&&!S.goal)return ar?'اختار هدفك':'Choose your goal';
 if(s==='body'){
  if(!S.sex)return ar?'اختار الجنس':'Choose sex';
  var a=+S.age,h=+S.height,w=+S.weight,t=+S.target;
  if(!(a>=5&&a<=100))return ar?'العمر غير صحيح':'Invalid age';
  if(!(h>=100&&h<=230))return ar?'الطول بين 100 و230 سم':'Height must be 100–230 cm';
  if(!(w>=25&&w<=300))return ar?'الوزن غير صحيح':'Invalid weight';
  if(S.goal!=='maintain'){if(!(t>=25&&t<=300))return ar?'اكتب الوزن المطلوب':'Enter target weight';
   if(S.goal==='lose'&&t>=w)return ar?'الوزن المطلوب لازم يكون أقل من الحالي':'Target must be lower than current';
   if(S.goal==='gain'&&t<=w)return ar?'الوزن المطلوب لازم يكون أكبر من الحالي':'Target must be higher than current'}
 }
 if(s==='act'&&!S.act)return ar?'اختار مستوى النشاط':'Choose activity level';
 if(s==='contact'){if(!S.name)return ar?'اكتب اسمك':'Enter your name';if(S.phone.replace(/\D/g,'').length<7)return ar?'رقم الهاتف غير صحيح':'Invalid phone number'}

}

 }else{
  var subs=ld('dc_subs',[]);
  h+='<h2 style="margin-bottom:12px">'+(ar?'طلبات الزبائن':'Client requests')+' ('+subs.length+')</h2>';
  if(!subs.length)h+='<p style="color:var(--mut)">'+(ar?'ما في طلبات بعد.':'No requests yet.')+'</p>';
  h+=subs.map(function(x){var s=x.S;return'<div class="row"><div><b>'+esc(s.name)+'</b> · <a href="tel:'+esc(s.phone)+'">'+esc(s.phone)+'</a>'+(x.flags?' <span class="tag" style="background:#fde4de;color:#a8402a">'+(ar?'يحتاج مراجعة':'Needs review')+'</span>':'')+'<br><small>'+{lose:ar?'تنقيص':'Lose',gain:ar?'زيادة':'Gain',maintain:ar?'ثبات':'Maintain'}[s.goal]+' · '+s.age+'y · '+s.height+'cm · '+s.weight+'→'+(s.target||s.weight)+'kg · '+s.meals+' '+(ar?'وجبات':'meals')+' · '+(s.cond.length?s.cond.map(function(c){return COND[c][ar?0:1]}).join(','):'—')+(s.allergy.length?' · '+s.allergy.map(function(a){return ALG[a][ar?0:1]}).join(','):'')+'<br>'+new Date(x.date).toLocaleString(ar?'ar-LB':'en-GB')+'</small></div><button class="btn s o" data-sd="'+x.id+'">'+(ar?'حذف':'Delete')+'</button></div>'}).join('');
 }
 return h+'</div>';
}
function vEdit(){
 var ar=L==='ar',p=EDIT;
 return'<div class="ad"><div class="card"><h2>'+(ar?'خطة':'Plan')+'</h2><br><div class="two"><div class="f"><label>'+(ar?'الاسم (عربي)':'Name (Arabic)')+'</label><input id="pn1" value="'+esc(p.name.ar)+'"></div><div class="f"><label>'+(ar?'الاسم (إنجليزي)':'Name (English)')+'</label><input id="pn2" value="'+esc(p.name.en)+'"></div></div><div class="two"><div class="f"><label>'+(ar?'الهدف':'Goal')+'</label><select id="pg"><option value="lose" '+(p.goal==='lose'?'selected':'')+'>'+(ar?'تنقيص':'Lose')+'</option><option value="gain" '+(p.goal==='gain'?'selected':'')+'>'+(ar?'زيادة':'Gain')+'</option><option value="maintain" '+(p.goal==='maintain'?'selected':'')+'>'+(ar?'ثبات':'Maintain')+'</option></select></div><div class="f"><label>'+(ar?'السعرات اليومية':'Daily calories')+'</label><input id="pk" type="number" value="'+p.kcal+'"></div></div><div class="f"><label>'+(ar?'نباتية؟':'Vegetarian?')+'</label><div class="chk"><label><input type="checkbox" id="pv" '+(p.veg?'checked':'')+'>'+(ar?'خطة نباتية':'Vegetarian plan')+'</label></div></div><div class="f"><label>'+(ar?'الخطة بتحتوي على (لتجنّبها لمن عندو حساسية)':'Plan contains (to avoid for allergic clients)')+'</label><div class="chk">'+Object.keys(ALG).map(function(k){return'<label><input type="checkbox" data-pt="'+k+'" '+(p.tags.indexOf(k)>-1?'checked':'')+'>'+ALG[k][ar?0:1]+'</label>'}).join('')+'</div></div><div class="f"><label>'+(ar?'الوجبات':'Meals')+'</label><div id="ml">'+p.meals.map(mrow).join('')+'</div><button class="btn s o" id="am" type="button">+ '+(ar?'وجبة':'Meal')+'</button></div><div class="f"><label>'+(ar?'ملاحظات (عربي)':'Notes (Arabic)')+'</label><textarea id="pa" rows="2">'+esc(p.notes?p.notes.ar:'')+'</textarea></div><div class="f"><label>'+(ar?'ملاحظات (إنجليزي)':'Notes (English)')+'</label><textarea id="pe" rows="2">'+esc(p.notes?p.notes.en:'')+'</textarea></div><div class="nav"><button class="btn o" id="cx">'+(ar?'إلغاء':'Cancel')+'</button><button class="btn t" id="sp">'+(ar?'حفظ':'Save')+'</button></div></div></div>';
}
function mrow(m){var ar=L==='ar';return'<div class="mrow"><input class="m0" placeholder="'+(ar?'الاسم':'Label')+'" value="'+esc(m.l.ar)+'"><textarea class="m1" rows="2" placeholder="العربي">'+esc(m.ar)+'</textarea><textarea class="m2" rows="2" placeholder="English">'+esc(m.en)+'</textarea><button type="button" class="btn s o" onclick="this.parentNode.remove()">×</button></div>'}
function initAdmin(){
 var ar=L==='ar';
 if(!ADM){$('#al').onclick=function(){if($('#ap').value===CFG.adminPass){ADM=true;sessionStorage.setItem('dc_adm','1');route()}else $('#er').textContent=ar?'كلمة السر غلط':'Wrong password'};return}
 if(EDIT){
  $('#am').onclick=function(){$('#ml').insertAdjacentHTML('beforeend',mrow(M('','','','')))};
  $('#cx').onclick=function(){EDIT=null;route()};
  $('#sp').onclick=function(){
   var p=EDIT;p.name={ar:$('#pn1').value.trim(),en:$('#pn2').value.trim()||$('#pn1').value.trim()};p.goal=$('#pg').value;p.kcal=+$('#pk').value||0;p.veg=$('#pv').checked;
   p.tags=[].filter.call(document.querySelectorAll('[data-pt]'),function(x){return x.checked}).map(function(x){return x.dataset.pt});
   p.meals=[].map.call(document.querySelectorAll('.mrow'),function(r){var n=r.querySelector('.m0').value.trim();return{l:{ar:n,en:n},ar:r.querySelector('.m1').value.trim(),en:r.querySelector('.m2').value.trim()||r.querySelector('.m1').value.trim()}}).filter(function(m){return m.ar||m.en});
   var na=$('#pa').value.trim(),ne=$('#pe').value.trim();p.notes=(na||ne)?{ar:na||ne,en:ne||na}:null;
   if(!p.name.ar||!p.kcal||!p.meals.length){toast(ar?'عبّي الاسم والسعرات ووجبة على الأقل':'Name, calories and one meal are required');return}
   var all=plans(),i=all.findIndex(function(x){return x.id===p.id});if(i>-1)all[i]=p;else all.push(p);sv('dc_plans',all);EDIT=null;toast(ar?'تم الحفظ':'Saved');route()};
  return}
 document.querySelectorAll('[data-tb]').forEach(function(b){b.onclick=function(){ATAB=b.dataset.tb;route()}});
 $('#lo').onclick=function(){ADM=false;sessionStorage.removeItem('dc_adm');route()};
 var np=$('#np');if(np)np.onclick=function(){EDIT={id:'p'+Date.now(),name:{ar:'',en:''},goal:'lose',kcal:1500,tags:[],veg:false,meals:[M('الفطور','Breakfast','','')],notes:null};route()};
 document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){EDIT=JSON.parse(JSON.stringify(plans().find(function(p){return p.id===b.dataset.e})));route()}});
 document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm(ar?'حذف هالخطة؟':'Delete this plan?')){sv('dc_plans',plans().filter(function(p){return p.id!==b.dataset.d}));route()}}});
 document.querySelectorAll('[data-sd]').forEach(function(b){b.onclick=function(){sv('dc_subs',ld('dc_subs',[]).filter(function(x){return String(x.id)!==b.dataset.sd}));route()}});
}
/* ---------- router ---------- */
function route(){
 var h=location.hash.replace(/^#\/?/,'')||'home',html,after=null;
 if(h==='start'){html=vStart();after=initStart}
 else if(h==='result'){html=vResult();after=initResult}
 else if(h==='contact'){html=vContact();after=initContact}
 else if(h==='admin'){html=vAdmin();after=initAdmin}
 else html=vHome();
 $('#app').innerHTML=html;setLang(L);window.scrollTo(0,0);if(after)after();
}
window.addEventListener('hashchange',function(){EDIT=null;if(location.hash==='#/start'&&window._res){}route()});
setLang(L);route();
</script>
</body>
