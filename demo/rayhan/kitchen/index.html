<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة المطبخ | مطبخ الريحان</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101614">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #101614; --panel: #18201D; --card: #F7F4EC; --ink: #17201B; --mute: #6B746E; --line: #2A3430; --light: #E9EEEA; --dim: #9AA59F;
  --new: #E5482D; --prep: #E3A24E; --ready: #3FAF6B; --basil: #24412F;
  --bf: 'IBM Plex Sans Arabic', system-ui, sans-serif;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--light); font-family: var(--bf); font-size: 15px; line-height: 1.45; min-height: 100vh }
button, input { font: inherit; color: inherit }
button { cursor: pointer; border: 0; background: none; padding: 0 }
[hidden] { display: none !important }
html[lang=en] .ord .tb { display: inline-flex; flex-direction: row-reverse; gap: 6px; align-items: baseline }
.num { font-variant-numeric: tabular-nums }
:focus-visible { outline: 3px solid var(--prep); outline-offset: 2px }

.login { min-height: 100vh; display: grid; place-items: center; padding: 20px }
.lbox { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px 22px; text-align: center }
.lbox h1 { font-size: 22px; margin: 10px 0 4px }
.lbox p { color: var(--dim); margin: 0 0 16px; font-size: 14px }
.fld { width: 100%; height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); padding: 0 14px; font-size: 16px; color: var(--light) }
.fld:focus { border-color: var(--prep); outline: 0 }
.btn { width: 100%; height: 50px; border-radius: 14px; background: var(--ready); color: #fff; font-weight: 700; font-size: 16px; margin-top: 12px }
.err { color: #FF8A73; min-height: 20px; font-size: 13.5px; margin-top: 8px }

.top { position: sticky; top: 0; z-index: 10; background: rgba(16,22,20,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.top h1 { font-size: 18px; margin: 0; flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px }
.top h1 small { font-weight: 400; color: var(--dim); font-size: 13px }
.clock { font-size: 22px; font-weight: 700 }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim) }
.live i { width: 8px; height: 8px; border-radius: 99px; background: var(--ready); box-shadow: 0 0 0 0 rgba(63,175,107,.6); animation: pulse 2s infinite }
.live.off i { background: var(--new); animation: none }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(63,175,107,0) } 100% { box-shadow: 0 0 0 0 rgba(63,175,107,0) } }
.tbtn { border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; color: var(--light); white-space: nowrap }
.tbtn.on { border-color: var(--ready); color: #9BE3B6 }
.tbtn.warn { border-color: var(--prep); color: var(--prep); animation: blink 1.4s infinite }
@keyframes blink { 50% { opacity: .55 } }

.calls { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 16px 0 }
.call { display: flex; align-items: center; gap: 10px; background: var(--new); color: #fff; border-radius: 16px; padding: 8px 8px 8px 14px; font-weight: 700; font-size: 15px; animation: pop .3s ease }
[dir=rtl] .call { padding: 8px 14px 8px 8px }
.call.bill { background: var(--prep); color: #1B1206 }
.call small { font-weight: 500; opacity: .85; font-size: 12.5px }
.call button { background: rgba(255,255,255,.95); color: var(--ink); border-radius: 12px; padding: 7px 12px; font-weight: 700; font-size: 13.5px }
@keyframes pop { from { transform: scale(.9); opacity: 0 } }

.tabs { display: none; gap: 6px; padding: 12px 16px 0 }
.tabs button { flex: 1; border-radius: 12px; padding: 9px 6px; font-weight: 700; font-size: 14px; background: var(--panel); color: var(--dim); border: 1px solid var(--line) }
.tabs button[aria-pressed="true"] { color: #fff; border-color: currentColor }
.tabs button[data-col="new"][aria-pressed="true"] { background: var(--new) }
.tabs button[data-col="prep"][aria-pressed="true"] { background: #8A5C1C }
.tabs button[data-col="ready"][aria-pressed="true"] { background: #23704A }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 14px 16px 40px; align-items: start }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 12px; min-height: 60vh }
.col h2 { font-size: 16px; margin: 2px 4px 12px; display: flex; align-items: center; gap: 8px }
.col h2 i { width: 10px; height: 10px; border-radius: 99px; display: inline-block }
.col h2 .n { margin-inline-start: auto; background: var(--line); border-radius: 99px; padding: 1px 10px; font-size: 13px }
.col.new h2 i { background: var(--new) } .col.prep h2 i { background: var(--prep) } .col.ready h2 i { background: var(--ready) }
.stack { display: grid; gap: 12px }
.empty { color: var(--dim); text-align: center; padding: 30px 8px; font-size: 14px }
@media (max-width: 900px) { .tabs { display: flex } .board { grid-template-columns: minmax(0, 1fr) } .col { display: none; min-height: 0 } .col.show { display: block } }

.ord { background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px; border-top: 6px solid var(--new); animation: pop .3s ease }
.col.prep .ord { border-top-color: var(--prep) } .col.ready .ord { border-top-color: var(--ready) }
.ord.fresh { box-shadow: 0 0 0 3px var(--new), 0 0 26px rgba(229,72,45,.5) }
.ord .oh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.ord .tb { font-size: 26px; font-weight: 700; line-height: 1 }
.ord .tb small { font-size: 14px; font-weight: 600; color: var(--mute) }
.ord .ago { font-size: 13px; font-weight: 700; color: var(--mute); background: #ECE7DA; border-radius: 99px; padding: 2px 10px; white-space: nowrap }
.ord .ago.late { background: #FCE2DC; color: #B8321C }
.ord ul { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 4px; font-size: 16px }
.ord li { display: flex; gap: 8px; align-items: baseline }
.ord li b { min-width: 30px; font-size: 17px }
.ord .note { background: #FFF2C6; border-radius: 10px; padding: 7px 10px; font-weight: 600; font-size: 14.5px; margin-bottom: 10px }
.ord .act { display: flex; gap: 8px; align-items: center }
.ord .go { flex: 1; height: 46px; border-radius: 12px; font-weight: 700; font-size: 15.5px; color: #fff; background: var(--basil) }
.col.new .go { background: var(--new) } .col.prep .go { background: #B9741E } .col.ready .go { background: #23704A }
.ord .cx { color: var(--mute); font-size: 13px; text-decoration: underline; padding: 6px }
.ord .tot { font-size: 13px; color: var(--mute) }
.done { margin: 0 16px 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px }
.done summary { cursor: pointer; font-weight: 700; color: var(--dim) }
.done div { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px }
.done span { background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--dim) }
.demo { background: #E3A24E; color: #1B1206; text-align: center; font-size: 12.5px; padding: 6px 12px; font-weight: 600 }
.demo a { color: inherit }
</style>
<script src="../../shared/panel-i18n.js"></script>
</head>
<body>
<div class="demo">نموذج تجريبي لباقة Pro: هكذا تبدو شاشة المطبخ. افتح <a href="../#t5" target="_blank" rel="noopener">صفحة الطاولة 5</a> من هاتف آخر واطلب، وشاهد الطلب يصل هنا.</div>

<section class="login" id="loginV">
  <form class="lbox" id="loginF">
    <svg width="54" height="54" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#24412F"/><circle cx="24" cy="26" r="13" fill="none" stroke="#F6F3EC" stroke-width="2.6"/><path d="M24 33c-6-2-8-8-6-13 5 .6 9 4.2 6 13z" fill="#C9822B"/><path d="M24 33c4.6-2.4 6-7.4 4-11-3.8 1-6.4 4.4-4 11z" fill="#7FB08C"/><path d="M15 9.5h18" stroke="#C9822B" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h1>شاشة المطبخ</h1>
    <p>مطبخ الريحان</p>
    <input class="fld" id="pass" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <button class="btn" id="loginB" type="submit">دخول</button>
    <div class="err" id="loginE" role="alert"></div>
  </form>
</section>

<div id="appV" hidden>
  <header class="top">
    <h1>👨‍🍳 شاشة المطبخ <small>مطبخ الريحان</small></h1>
    <span class="live" id="live"><i></i><span id="liveT">متصل</span></span>
    <span class="clock num" id="clock"></span>
    <button type="button" class="tbtn warn" id="soundB">🔕 فعّل الصوت</button>
    <button type="button" class="tbtn" id="outB">خروج</button>
  </header>
  <div class="calls" id="calls"></div>
  <div class="tabs" id="tabs" role="group" aria-label="columns"></div>
  <main class="board" id="board">
    <section class="col new show" data-col="new"><h2><i></i>طلبات جديدة<span class="n num" id="nNew">0</span></h2><div class="stack" id="cNew"></div></section>
    <section class="col prep" data-col="prep"><h2><i></i>قيد التحضير<span class="n num" id="nPrep">0</span></h2><div class="stack" id="cPrep"></div></section>
    <section class="col ready" data-col="ready"><h2><i></i>جاهز للتقديم<span class="n num" id="nReady">0</span></h2><div class="stack" id="cReady"></div></section>
  </main>
  <details class="done" id="doneW"><summary id="doneT">آخر ما قُدِّم</summary><div id="done"></div></details>
</div>

<script src="../data.js"></script>
<script>
const API = 'https://nafetha-api.nafetha-web.workers.dev/rayhan';
const $ = (s) => document.querySelector(s);
let pass = '', data = { orders: [], calls: [], done: [] }, seen = null, seenCalls = null, sound = false, col = 'new', skew = 0, fails = 0;
try { pass = localStorage.getItem('rh_kitchen') || '' } catch (e) {}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => (Math.round(n * 100) / 100) + '$';
function ago(ts) { const m = Math.max(0, Math.floor((Date.now() + skew - ts) / 60000)); return m < 1 ? 'الآن' : m < 60 ? 'منذ ' + m + ' د' : 'منذ ' + Math.floor(m / 60) + ' س' }

async function api(path, opt) {
  const r = await fetch(API + path, Object.assign({ cache: 'no-store' }, opt, { headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + pass } }));
  if (r.status === 401) { logout(); throw new Error('auth') }
  if (!r.ok) throw new Error('net');
  return r.json();
}
$('#loginF').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#loginB').disabled = true; $('#loginE').textContent = ''; pass = $('#pass').value.trim();
  try { const r = await fetch(API + '/login', { method: 'POST', headers: { Authorization: 'Bearer ' + pass } }); if (!r.ok) throw 0; try { localStorage.setItem('rh_kitchen', pass) } catch (x) {} enter() }
  catch (x) { $('#loginE').textContent = 'كلمة السر غير صحيحة'; pass = '' }
  $('#loginB').disabled = false;
});
function logout() { pass = ''; try { localStorage.removeItem('rh_kitchen') } catch (e) {} $('#appV').hidden = true; $('#loginV').hidden = false }
$('#outB').addEventListener('click', logout);
function enter() { $('#loginV').hidden = true; $('#appV').hidden = false; pull(); }

/* sound: browsers need one tap before playing audio */
let ac = null;
function beep(times) {
  if (!sound || !ac) return;
  for (let k = 0; k < (times || 2); k++) [880, 1175].forEach((f, j) => { const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + k * 0.5 + j * 0.16; o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 0.16) });
}
$('#soundB').addEventListener('click', () => {
  sound = !sound; if (sound) { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); beep(1) }
  $('#soundB').textContent = sound ? '🔔 الصوت مفعّل' : '🔕 فعّل الصوت'; $('#soundB').className = 'tbtn' + (sound ? ' on' : ' warn');
});

async function pull() {
  try {
    const j = await api('/orders'); skew = j.now - Date.now(); data = j; fails = 0;
    const ids = new Set(j.orders.filter((o) => o.status === 'new').map((o) => o.id)), cks = new Set(j.calls.map((c) => c.tbl + c.kind + c.created));
    if (seen) { const fresh = [...ids].filter((x) => !seen.has(x)); if (fresh.length) { beep(2); flash(fresh) } }
    if (seenCalls) { if ([...cks].some((x) => !seenCalls.has(x))) beep(1) }
    seen = ids; seenCalls = cks;
    $('#live').className = 'live'; $('#liveT').textContent = 'متصل';
    render();
  } catch (e) { if (e.message !== 'auth') { fails++; if (fails > 1) { $('#live').className = 'live off'; $('#liveT').textContent = 'لا يوجد اتصال' } } }
}
let freshIds = new Set();
function flash(ids) { ids.forEach((x) => freshIds.add(x)); setTimeout(() => { ids.forEach((x) => freshIds.delete(x)); render() }, 12000) }
const NEXT = { new: ['prep', 'ابدأ التحضير'], prep: ['ready', 'جاهز ✓'], ready: ['done', 'قُدِّم للطاولة'] };
function card(o) {
  const mins = (Date.now() + skew - o.created) / 60000;
  return '<article class="ord' + (freshIds.has(o.id) ? ' fresh' : '') + '"><div class="oh"><span class="tb">' + o.tbl + ' <small>طاولة</small></span><span class="ago' + (mins > 15 && o.status !== 'ready' ? ' late' : '') + '">' + ago(o.created) + '</span></div>' +
    '<ul>' + o.items.map((i) => '<li><b class="num">' + i.q + '×</b><span>' + esc(i.n) + '</span></li>').join('') + '</ul>' +
    (o.note ? '<div class="note">📝 ' + esc(o.note) + '</div>' : '') +
    '<div class="act"><button type="button" class="go" data-id="' + o.id + '" data-to="' + NEXT[o.status][0] + '">' + NEXT[o.status][1] + '</button>' + (o.status === 'new' ? '<button type="button" class="cx" data-id="' + o.id + '" data-to="cancel">إلغاء</button>' : '') + '</div>' +
    '<div class="tot num">' + money(o.total) + '</div></article>';
}
function render() {
  const by = { new: [], prep: [], ready: [] }; data.orders.forEach((o) => by[o.status] && by[o.status].push(o));
  [['new', '#cNew', '#nNew'], ['prep', '#cPrep', '#nPrep'], ['ready', '#cReady', '#nReady']].forEach(([k, c, n]) => {
    $(n).textContent = by[k].length;
    $(c).innerHTML = by[k].length ? by[k].map(card).join('') : '<div class="empty">' + (k === 'new' ? 'لا طلبات جديدة الآن' : k === 'prep' ? 'لا شيء قيد التحضير' : 'لا شيء بانتظار التقديم') + '</div>';
  });
  $('#tabs').innerHTML = [['new', 'جديد'], ['prep', 'تحضير'], ['ready', 'جاهز']].map(([k, l]) => '<button type="button" data-col="' + k + '" aria-pressed="' + (col === k) + '">' + l + ' (' + by[k].length + ')</button>').join('');
  document.querySelectorAll('.col').forEach((c) => c.classList.toggle('show', c.dataset.col === col));
  $('#calls').innerHTML = data.calls.map((c) => '<div class="call' + (c.kind === 'bill' ? ' bill' : '') + '">' + (c.kind === 'bill' ? '🧾' : '🙋') + ' طاولة ' + c.tbl + ' <small>' + (c.kind === 'bill' ? 'تطلب الحساب' : 'تطلب النادل') + ' · ' + ago(c.created) + '</small><button type="button" data-tbl="' + c.tbl + '" data-kind="' + c.kind + '">تمّ ✓</button></div>').join('');
  $('#doneW').hidden = !data.done.length; $('#doneT').textContent = 'آخر ما قُدِّم (' + data.done.length + ')';
  $('#done').innerHTML = data.done.map((d) => '<span>طاولة ' + d.tbl + ' · ' + money(d.total) + ' · ' + ago(d.updated) + '</span>').join('');
  const nn = by.new.length; document.title = (nn ? '(' + nn + ') ' : '') + 'شاشة المطبخ | مطبخ الريحان';
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.col && b.closest('#tabs')) { col = b.dataset.col; render(); return }
  if (b.dataset.to) {
    const o = data.orders.find((x) => x.id === b.dataset.id); if (!o) return;
    if (b.dataset.to === 'cancel' && !confirm('إلغاء طلب الطاولة ' + o.tbl + '؟')) return;
    const prev = o.status; if (b.dataset.to === 'done' || b.dataset.to === 'cancel') data.orders = data.orders.filter((x) => x !== o); else o.status = b.dataset.to; render();
    try { await api('/status', { method: 'POST', body: JSON.stringify({ id: o.id, status: b.dataset.to }) }); pull() } catch (x) { o.status = prev; pull() }
    return;
  }
  if (b.dataset.tbl) { data.calls = data.calls.filter((c) => !(String(c.tbl) === b.dataset.tbl && c.kind === b.dataset.kind)); render(); try { await api('/callok', { method: 'POST', body: JSON.stringify({ table: +b.dataset.tbl, kind: b.dataset.kind }) }) } catch (x) {} }
});
function tickClock() { $('#clock').textContent = new Date().toLocaleTimeString('ar-LB', { hour: '2-digit', minute: '2-digit' }) }
setInterval(() => { tickClock(); if (!$('#appV').hidden) render() }, 30000); tickClock();
setInterval(() => { if (!$('#appV').hidden && !document.hidden) pull() }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#appV').hidden) pull() });
if (pass) enter();
</script>
</body>
</html>
