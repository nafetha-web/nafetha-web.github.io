<style>
:root{--y:#FBCE00;--red:#E21F26;--ink:#1A1410;--paper:#FFFDF5;--bg:#F6F1E2;--mute:#6B6052;--line:#E8DFC4;--ok:#1F9D55;--hf:'Lalezar','Cairo',sans-serif;--bf:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px;line-height:1.5;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}h1,h2,h3{font-family:var(--hf);font-weight:400;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:360px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:26px 20px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.lbox .bd{width:64px;height:64px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;margin:0 auto 8px}
.lbox h1{font-size:28px}.lbox p{color:var(--mute);margin:4px 0 16px}
.fld{width:100%;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--paper);padding:0 12px;font-size:16px}
textarea.fld{height:auto;padding:10px 12px;resize:vertical}
.fld:focus{border-color:var(--ink);outline:0;background:#fff}
.btn{width:100%;height:48px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.y{background:var(--y);color:var(--ink);border:2px solid var(--ink)}.btn.red{background:#fde8e6;color:#b5121a}.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.55}.err{color:#b5121a;font-size:14px;min-height:21px;margin-top:6px}
/* top */
.top{position:sticky;top:0;z-index:30;background:var(--y);border-bottom:3px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.top h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a,.top .tb{font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:99px;padding:5px 12px;background:#fff;text-decoration:none;color:var(--ink);white-space:nowrap}
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:3px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 2px 7px;font-weight:700;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button i{font-style:normal;font-size:21px}.tabs button[aria-pressed=true]{color:var(--ink);background:var(--y)}
.pub{position:fixed;inset-inline:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:29;padding:0 14px}
.pub .in{max-width:640px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pub span{flex:1;font-weight:700;font-size:14px}.pub button{background:var(--y);color:var(--ink);font-weight:800;border-radius:11px;padding:9px 16px}
.pub button.u{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:8px 12px;font-weight:600}
/* menu */
.sr{margin:12px 0;position:relative}.sr .fld{padding-inline-start:40px}.sr i{position:absolute;inset-inline-start:12px;top:12px;font-style:normal;opacity:.5}
.cat{margin:18px 0 6px}.cat .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat h2{font-size:24px;flex:1}.cat.hid h2{opacity:.45;text-decoration:line-through}
.cat .cm{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);font-weight:800}
.it{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;margin-bottom:8px;text-align:start;width:100%}
.it .th{width:62px;height:62px;border-radius:12px;background:var(--bg);flex:none;overflow:hidden;display:grid;place-items:center;font-size:30px}.it .th img{width:100%;height:100%;object-fit:cover}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .pr{font-weight:800;color:var(--red)}.it .pr s{color:var(--mute);font-weight:600;font-size:13px;margin-inline-start:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}.chip{font-size:11.5px;font-weight:700;border-radius:99px;padding:0 8px;background:#eee;color:#555}
.chip.o{background:#fde8e6;color:#b5121a}.chip.g{background:#e3f5ea;color:#177a42}.chip.y{background:#fff1b8;color:#6a5200}
.it.dim{opacity:.55}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:#d6cfba;flex:none;transition:.2s}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw[aria-pressed=true]{background:var(--red)}.sw[aria-pressed=true]::after{inset-inline-start:21px}
.swl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);flex:none}
.add{width:100%;border:2.5px dashed var(--ink);border-radius:16px;padding:12px;font-weight:800;background:transparent;margin-bottom:6px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(26,20,16,.55);z-index:50}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-top:3px solid var(--ink)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:-16px;background:var(--paper);padding:6px 0}
.sheet h3{font-size:24px}.x{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:20px}
.lb{display:block;font-weight:800;font-size:13.5px;margin:12px 0 4px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;gap:12px;align-items:center}.ph .big{width:110px;height:80px;border-radius:14px;background:#fff;border:2px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:44px;flex:none}.ph .big img{width:100%;height:100%;object-fit:cover}
.ph .bs{display:flex;flex-direction:column;gap:6px;flex:1}.ph .bs button{border:2px solid var(--ink);border-radius:10px;padding:7px;font-weight:700;background:var(--y);font-size:14px}.ph .bs button.l{background:#fff}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.lib button{aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#fff}.lib button img{width:100%;height:100%;object-fit:cover}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tg button{border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;background:#fff}.tg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dur{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.dur button{border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;background:#fff}.dur button[aria-pressed=true]{background:var(--y);border-color:var(--ink)}
/* cards */
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}.card h3{font-size:22px;margin-bottom:4px}.card p.s{color:var(--mute);margin:0 0 6px;font-size:13.5px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pal button{border:2.5px solid var(--line);border-radius:14px;padding:8px;font-weight:700;font-size:12.5px;background:#fff}.pal button[aria-pressed=true]{border-color:var(--ink)}
.pal i{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-bottom:5px}.pal i b{flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cp{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--paper);font-weight:700;font-size:13.5px}
.cp input{width:42px;height:34px;border:0;padding:0;background:none;flex:none;cursor:pointer}
.prz{border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;background:var(--paper)}.prz .r{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px}
.hs{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.hs button{border:2px solid var(--ink);border-radius:10px;padding:5px 12px;font-weight:700;background:var(--y)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}.toast.on{opacity:1}
.empty{color:var(--mute);text-align:center;padding:20px}
</style>
</head>
<body>

<section class="login" id="loginV">
  <form class="lbox" id="loginF">
    <div class="bd">🍝</div><h1 id="lt">لوحة التحكم</h1><p>Crazy Pasta</p>
    <input class="fld" id="pass" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <button class="btn" id="loginB" type="submit">دخول</button>

<script>

const EN = {"عملة الأسعار":"Price currency","ليرة لبنانية":"Lebanese pound","دولار":"US dollar","ساعات الدوام (عربي":"Opening hours (Arabic","مثلًا: يوميًا 2 ظهرًا – 12 ليلًا":"e.g. Daily 2 PM – 12 AM","الزبون بيلفّ الدولاب والجائزة بتنضاف عطلبو. بتقدر تقفّلها": "The customer spins the wheel and the prize is added to their order. You can turn it off", "كل مرة بتنشر، منحفظ النسخة اللي قبلها. فيك ترجّع أي وحدة": "Every time you publish, the previous version is saved. You can restore any of them", "بعد ما تعدّل، دوس «نشر عالموقع» لتظهر التغييرات للزباين": "After editing, tap “Publish to site” so customers see the changes", "المنيو: دوس على الصنف لتعدّل السعر والصورة والوصف": "Menu: tap an item to edit its price, photo and description", "بدك تتراجع عن كل التعديلات اللي ما نشرتها؟": "Discard all the changes you have not published?", "اللعبة بدها جائزتين على الأقل، أو قفّلها": "The game needs at least 2 prizes, or turn it off", "في تعديلات غير منشورة رح تنمحى. كمّل؟": "Unpublished changes will be lost. Continue?", "«نفد» بيخلّي الصنف ظاهر بس ما بينطلب": "“Sold out” keeps the item visible but not orderable", "لازم جائزتين على الأقل لتشتغل اللعبة": "At least 2 prizes are needed for the game to work", "بدك ترجّع هالنسخة وتنشرها عالموقع؟": "Restore this version and publish it to the site?", "ما انرفعت الصورة، جرّب صورة تانية": "Photo upload failed, try another photo", "رقم الواتساب (مع رمز الدولة، بدون": "WhatsApp number (with country code, without", "سعر العرض لازم يكون أقل من السعر": "The offer price must be lower than the price", "؟ (فيك ترجّعو من النسخ السابقة": "? (you can restore it from previous versions", "اختار نمط جاهز أو عدّل كل لون": "Pick a preset or adjust each color", "انتهت الجلسة، فوت مرة تانية": "Session expired, please sign in again", "ما في اتصال، جرّب مرة تانية": "No connection, please try again", "محاولات كتير. جرّب بعد شوي": "Too many attempts. Try again shortly", "لعبة «وقّف وشوف شو طلعلك»": "Game “Stop and see what you get”", "بالإنكليزي (بيطلع باللوغو": "In English (shown in the logo", "بيظهر عالموقع خلال ثواني": "It appears on the site within seconds", "رقم الواتساب ناقص أو غلط": "WhatsApp number is missing or wrong", "اكتب إيموجي للصنف (مثلًا": "Type an emoji for the item (e.g.", "إخفاء القسم عن الموقع": "Hide section from site", "حذف القسم بكل أصنافو": "Delete section with all its items", "إظهار القسم عالموقع": "Show section on site", "كلمة السر غير صحيحة": "Wrong password", "لسا ما في نسخ سابقة": "No previous versions yet", "صوّر أو اختار صورة": "Take or choose a photo", "شرط (مثلًا مع طلبك": "Condition (e.g. with your order", "بدون صورة (إيموجي": "No photo (emoji", "لازم يضل قسم واحد": "At least one section must remain", "نص التوصيل (عربي": "Delivery text (Arabic", "التواصل والعنوان": "Contact & address", "تعديل اسم القسم": "Rename section", "اسم الصنف (عربي": "Item name (Arabic", "اكتب اسم المطعم": "Enter the restaurant name", "اكتب اسم الصنف": "Enter the item name", "اكتب اسم القسم": "Enter the section name", "مخفي عن الموقع": "Hidden from site", "جرّب مرة تانية": "try again", "الاسم بالعربي": "Name in Arabic", "العنوان (عربي": "Address (Arabic", "بدون وقت محدد": "No end time", "دوّر على صنف…": "Search items…", "الصور الجاهزة": "Ready photos", "النسخ السابقة": "Previous versions", "اللون الرئيسي": "Main color", "أخضر وبرتقالي": "Green & orange", "الجائزة (عربي": "Prize (Arabic", "انتهت الجلسة": "Session expired", "خيارات القسم": "Section options", "مساعدة سريعة": "Quick help", "الأكثر طلبًا": "Most popular", "لون التمييز": "Accent color", "صنف جديد بـ": "New item in ", "حسب المحفوظ": "As saved", "تعديل الصنف": "Edit item", "حذف الجائزة": "Delete prize", "نشر عالموقع": "Publish to site", "أحمر وكريمي": "Red & cream", "إضافة الصنف": "Add item", "جائزة جديدة": "New prize", "رجعت النسخة": "Version restored", "الوصف (عربي": "Description (Arabic", "هو آخر صنف": "Already the last item", "هو أول صنف": "Already the first item", "اكتب السعر": "Enter the price", "اسم المطعم": "Restaurant name", "تسجيل خروج": "Sign out", "، اختياري": ", optional", "أزرق وأحمر": "Blue & red", "اسم القسم": "Section name", "حذف الصنف": "Delete item", "ما انحفظ:": "Not saved:", "سعر العرض": "Offer price", "بدون عرض": "no offer", "قسم جديد": "New section", "(اختياري": "(optional", "لون النص": "Text color", "صنف جديد": "New item", "تم النشر": "Published", "نقل لفوق": "Move up", "نقل لتحت": "Move down", "بالعربي": "Arabic", "الخلفية": "Background", "الألوان": "Colors", "الجوائز": "Prizes", "عم نرفع": "Uploading", "ما زبطت": "Failed", "الأصلي": "Original", "إيموجي": "Emoji", "المظهر": "Look", "بنفسجي": "Purple", "٣ أيام": "3 days", "مقفّلة": "Off", "شغّالة": "On", "المنيو": "Menu", "السعر": "Price", "القسم": "Section", "اليوم": "Today", "أسبوع": "1 week", "داكن": "Dark", "أكتر": "More", "مخفي": "Hidden", "صنف؟": "items?", "رجّع": "Restore", "فاضي": "empty", "تحت": "Down", "حذف": "Delete", "حار": "Spicy", "فوق": "Up", "نفد": "Sold out", "عرض": "Offer", "حفظ": "Save", "مع": "with", "لوحة التحكم": "Control panel", "كلمة السر": "Password", "دخول": "Sign in", "عاين الموقع ↗": "View site ↗", "في تعديلات غير منشورة": "You have unpublished changes", "تراجع": "Undo", "اللغة": "Language"};
let lang = 'ar'; try { lang = localStorage.getItem('cp_lang') === 'en' ? 'en' : 'ar' } catch (e) {}
const T = (a) => (lang === 'en' && EN[a] != null ? EN[a] : a);
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = T('لوحة التحكم') + ' | Crazy Pasta';
  $('lt').textContent = T('لوحة التحكم'); $('pass').placeholder = T('كلمة السر'); $('loginB').textContent = T('دخول');
  $('viewB').textContent = T('عاين الموقع ↗'); $('pubT').textContent = T('في تعديلات غير منشورة'); $('pubU').textContent = T('تراجع'); $('pubB').textContent = T('نشر عالموقع');
  document.querySelectorAll('[data-lang]').forEach((b) => { b.textContent = lang === 'en' ? 'عربي' : 'EN'; b.setAttribute('aria-label', T('اللغة')) });
  if (cfg) render(true);
}
function setLang(l) { lang = l; try { localStorage.setItem('cp_lang', l) } catch (e) {} applyLang() }
const rid = () => Math.random().toString(36).slice(2, 8);
let pass = '', cfg = null, saved = '', tab = 'menu', q = '', busy = false;
try { pass = localStorage.getItem('cp_admin') || '' } catch (e) {}

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600) }
async function api(path, opt) {
  const r = await fetch(API + path, Object.assign({ cache: 'no-store' }, opt, { headers: Object.assign({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + pass }, opt && opt.headers) }));
  if (r.status === 401) { logout(); throw new Error('auth') }
  if (r.status === 429) throw new Error('many');
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'net'); return j;
}
const dirty = () => cfg && JSON.stringify(cfg) !== saved;
function logout() { pass = ''; try { localStorage.removeItem('cp_admin') } catch (e) {} $('appV').hidden = true; $('loginV').hidden = false }

$('loginF').addEventListener('submit', async (e) => {
  e.preventDefault(); $('loginB').disabled = true; $('loginE').textContent = ''; pass = $('pass').value.trim();
  try { await api('/login', { method: 'POST' }); try { localStorage.setItem('cp_admin', pass) } catch (x) {} await enter() }

async function enter() {

  $('loginV').hidden = true; $('appV').hidden = false; render();
}
applyLang();

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); scrollTo(0, 0); if (tab === 'more') loadHist(); return }
  if (t.dataset.out) { const [, i] = find(t.dataset.out); i.out = i.out ? 0 : 1; mark(); return }
  if (t.dataset.ed) return editItem(t.dataset.ed);
  if (t.dataset.add) return editItem(null, t.dataset.add);
  if (t.dataset.cm) return catMenu(t.dataset.cm);
  if (t.dataset.addcat) return catForm(null);
  if (t.dataset.pal) { const P = JSON.parse($('palD').textContent)[+t.dataset.pal]; cfg.colors = { y: P[1], red: P[2], ink: P[3], paper: P[4] }; mark(); return }
  if (t.dataset.gon) { cfg.game.on = !cfg.game.on; mark(); return }
  if (t.dataset.pzadd) { cfg.game.prizes.push({ em: '🎁', ar: '', en: '', sa: '', se: '' }); mark(); return }
  if (t.dataset.pzdel) { cfg.game.prizes.splice(+t.dataset.pzdel, 1); mark(); return }
  if (t.dataset.lang) return setLang(lang === 'en' ? 'ar' : 'en');
  if (t.dataset.cur) { cfg.brand.cur = t.dataset.cur; mark(); return }
  if (t.dataset.logout) return logout();
  if (t.dataset.restore) return restore(+t.dataset.restore);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { q = t.value; const p = t.selectionStart; $('main').innerHTML = menuV(); const n = $('q'); n.focus(); n.setSelectionRange(p, p); return }
  if (t.dataset.b) { const [a, b] = t.dataset.b.split('.'); if (b) { cfg.brand[a] = cfg.brand[a] || {}; cfg.brand[a][b] = t.value } else cfg.brand[a] = t.value; $('topT').textContent = cfg.brand.ar; flag(); return }

  if (t.dataset.pz) { const [i, k] = t.dataset.pz.split('.'); cfg.game.prizes[+i][k] = t.value; flag(); return }
});

function clientCheck() {
  if (!cfg.brand.ar.trim()) return T('اكتب اسم المطعم');
  if (cfg.game.on && cfg.game.prizes.filter((p) => p.ar.trim()).length < 2) return T('اللعبة بدها جائزتين على الأقل، أو قفّلها');
  if (!cfg.brand.wa || cfg.brand.wa.replace(/\D/g, '').length < 8) return T('رقم الواتساب ناقص أو غلط');
  return '';
}

    $('sx').onclick = closeSheet;
    $('e_off').oninput = () => { $('durB').hidden = !$('e_off').value.trim() };
    document.querySelectorAll('[data-dur]').forEach((b) => b.onclick = () => { dur = b.dataset.dur; document.querySelectorAll('[data-dur]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))) });
    document.querySelectorAll('[data-tgk]').forEach((b) => b.onclick = () => { d[b.dataset.tgk] = d[b.dataset.tgk] ? 0 : 1; b.setAttribute('aria-pressed', String(!!d[b.dataset.tgk])) });
    $('e_cat').onchange = () => { dest = $('e_cat').value };
    $('p_up').onclick = () => $('p_file').click();
    $('p_file').onchange = async () => { const f = $('p_file').files[0]; if (!f) return; grab(); $('p_up').textContent = ('… ' + T('عم نرفع')); try { d.pic = await upload(f); delete d.ph; delete d.em; draw() } catch (e) { toast(e.message === 'auth' ? T('انتهت الجلسة') : T('ما انرفعت الصورة، جرّب صورة تانية')); draw() } };
    $('p_lib').onclick = () => { const used = [...new Set(cfg.menu.flatMap((x) => x.items.map((y) => y.pic).filter(Boolean)))]; $('libA').innerHTML = '<div class="lib">' + LIB.map((k) => '<button type="button" data-lib="' + k + '"><img src="' + LIBURL(k) + '" alt=""></button>').join('') + used.map((u) => '<button type="button" data-libp="' + u + '"><img src="' + API + u + '" alt=""></button>').join('') + '</div>';
      document.querySelectorAll('[data-lib]').forEach((b) => b.onclick = () => { grab(); d.ph = b.dataset.lib; delete d.pic; delete d.em; draw() });
      document.querySelectorAll('[data-libp]').forEach((b) => b.onclick = () => { grab(); d.pic = b.dataset.libp; delete d.ph; delete d.em; draw() }) };
    $('p_em').onclick = () => { const v = prompt((T('اكتب إيموجي للصنف (مثلًا') + ' 🍕)'), d.em || '🍽️'); if (v) { grab(); d.em = v.trim().slice(0, 4); delete d.ph; delete d.pic; draw() } };
    $('e_ok').onclick = () => {
      grab(); const ar = d.ar.trim(); if (!ar) return toast(T('اكتب اسم الصنف'));
      const p = parseFloat(String(d.p).replace(',', '.')); if (!(p >= 0)) return toast(T('اكتب السعر'));
      const offS = String(d.off).trim(), off = offS ? parseFloat(offS.replace(',', '.')) : null; if (offS && !(off >= 0 && off < p)) return toast(T('سعر العرض لازم يكون أقل من السعر'));
      const o = { id: d.id, ar, en: d.en.trim() || ar, dar: d.dar.trim(), den: d.den.trim() || d.dar.trim(), p };
      if (off != null) { o.off = off; if (dur === 'keep') o.until = d.until; else if (dur !== 'none') o.until = Date.now() + (+dur) * 86400000 }
      ['ph', 'pic', 'em', 'pop', 'hot', 'out', 'hid'].forEach((k) => { if (d[k]) o[k] = d[k] });
      if (!o.ph && !o.pic && !o.em) o.em = '🍽️';
      const to = cfg.menu.find((x) => x.id === dest);
      if (isNew) to.items.push(o); else { const at = c.items.findIndex((x) => x.id === o.id); if (to === c) c.items[at] = o; else { c.items.splice(at, 1); to.items.push(o) } }
      closeSheet();
    };
    if (!isNew) {
      const at = c.items.findIndex((x) => x.id === i.id);
      $('e_up').onclick = () => { if (at > 0) { c.items.splice(at - 1, 0, c.items.splice(at, 1)[0]); closeSheet() } else toast(T('هو أول صنف')) };
      $('e_dn').onclick = () => { if (at < c.items.length - 1) { c.items.splice(at + 1, 0, c.items.splice(at, 1)[0]); closeSheet() } else toast(T('هو آخر صنف')) };
      $('e_del').onclick = () => { if (confirm((T('حذف') + ' «') + i.ar + ('»' + T('؟ (فيك ترجّعو من النسخ السابقة') + ')'))) { c.items.splice(at, 1); closeSheet() } };
    }
  };
  draw();
}
/* resize to 602x440 (cover) and upload */
function upload(file) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = async () => {
      try {
        const W = 602, H = 440, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
        const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s; g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u);
        let data = cv.toDataURL('image/webp', .82); if (!data.startsWith('data:image/webp')) data = cv.toDataURL('image/jpeg', .85);
        if (data.length > 560000) data = cv.toDataURL('image/jpeg', .6);
        const j = await api('/img', { method: 'POST', body: JSON.stringify({ data }) }); res(j.pic);
      } catch (e) { rej(e) }
    };
    im.onerror = () => rej(new Error('bad')); im.src = u;
  });
}
